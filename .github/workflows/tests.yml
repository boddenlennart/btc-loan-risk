# Runs all tests and the browser tests for every push and every pull request
# (your own changes, edits on the GitHub website). The weekly data update runs
# the same tests inside its own workflow, before it opens its pull request.
#
# The browser tests run in five setups side by side (three computer browsers, an iPhone, an Android
# phone), so none waits for the others. "test" at the end is the check the protected main branch
# requires: green only when the unit tests and all five setups passed. A failed browser test shows
# as a note on the run's page (readable without logging in), with the test's name and the reason.
#
# GitHub's computers are pinned to Ubuntu 24.04: from 19 Oct 2026 "ubuntu-latest" moved to a newer Ubuntu,
# where installing the browsers took up to 30 minutes and Safari's engine hit the time limit (26 Oct).
# Move to a newer version deliberately, on a branch, after its tests passed.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install tools
        run: npm ci
      - name: All tests
        run: npm test

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, engine: chromium }
          - { project: webkit, engine: webkit }
          - { project: firefox, engine: firefox }
          - { project: iphone, engine: webkit }
          - { project: android, engine: chromium }
    name: browser (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install tools
        run: npm ci
      - name: Build the page from the sources (the browser tests use this build)
        run: node tools/build.mjs
      # the browser is kept between runs (installing it from scratch took up to 30 minutes on 26 Oct 2026)
      - name: Keep the installed browser between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.engine }}-${{ hashFiles('package-lock.json') }}
      - name: Install the browser and what it needs from the system
        timeout-minutes: 15
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: The finished page in a real browser
        timeout-minutes: 30
        run: npx playwright test --project=${{ matrix.project }}

  test:
    if: always()
    needs: [unit, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: All tests passed
        run: |
          echo "unit: ${{ needs.unit.result }}, browser: ${{ needs.browser.result }}"
          test "${{ needs.unit.result }}" = success && test "${{ needs.browser.result }}" = success
