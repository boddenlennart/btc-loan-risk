<!doctype html>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src /*SCRIPT_HASH*/; style-src 'unsafe-inline'; font-src data:; img-src data: 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
/*HEAD*/

<body>
/*HEADER*/
<main class="wrap page" id="top">
  <div class="intro">
    <h1 class="pos" data-t="method.title"></h1>
    <p class="subhead" data-t="method.short"></p>
  </div>
  <nav class="toc" aria-labelledby="toc-h"><h2 class="label" id="toc-h" data-t="method.toc"></h2><ol>
    <li><a href="#steps" data-t="method.stepsTitle"></a></li>
    <li><a href="#methods" data-t="method.methodsTitle"></a></li>
    <li><a href="#test" data-t="method.testTitle"></a></li>
    <li><a href="#data" data-t="method.dataTitle"></a></li>
    <li><a href="#trend" data-t="method.trendTitle"></a></li>
    <li><a href="#limits" data-t="method.limitsTitle"></a></li>
    <li><a href="#verify" data-t="method.verifyTitle"></a></li>
  </ol></nav>

  <section class="part" id="steps" aria-labelledby="steps-h">
    <h2 id="steps-h" data-t="method.stepsTitle"></h2>
    <ol class="steps" id="steps-list"></ol>
    <p class="hint" id="example-note"></p>
    <h3 data-t="method.fanTitle"></h3>
    <p class="hint" data-t="method.fanNote"></p>
    <div id="fan-chart"></div>
    <h3 data-t="method.byMonthTitle"></h3>
    <div id="months-chart"></div>
  </section>

  <section class="part" id="methods" aria-labelledby="methods-h">
    <h2 id="methods-h" data-t="method.methodsTitle"></h2>
    <p data-t="method.methodsIntro"></p>
    <ul id="methods-list"></ul>
    <h3 id="compare-h" data-t="method.compareTitle"></h3>
    <div class="table-wrap" id="compare" tabindex="0" role="region" aria-labelledby="compare-h"></div>
  </section>

  <section class="part" id="test" aria-labelledby="test-h">
    <h2 id="test-h" data-t="method.testTitle"></h2>
    <p data-t="method.test"></p>
  </section>

  <section class="part" id="data" aria-labelledby="data-h">
    <h2 id="data-h" data-t="method.dataTitle"></h2>
    <ul id="data-list"></ul>
    <p class="hint" id="data-period"></p>
    <p data-t="method.measure"></p>
  </section>

  <section class="part" id="trend" aria-labelledby="trend-h">
    <h2 id="trend-h" data-t="method.trendTitle"></h2>
    <div id="trend-facts"></div>
    <p data-t="method.trend"></p>
  </section>

  <section class="part" id="limits" aria-labelledby="limits-h">
    <h2 id="limits-h" data-t="method.limitsTitle"></h2>
    <ul id="limits-list"></ul>
  </section>

  <section class="part" id="verify" aria-labelledby="verify-h">
    <h2 id="verify-h" data-t="method.verifyTitle"></h2>
    <p id="code-line"></p>
    <ul id="verify-list"></ul>
  </section>

  /*FOOTER*/
