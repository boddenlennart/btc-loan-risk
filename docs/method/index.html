:root {
  color-scheme: light;
  --serif: "Source Serif 4", Charter, "Iowan Old Style", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #f6f5f1;         /* paper */
  --surface: #ffffff;    /* answer panel, inputs */
  --surface-2: #efede6;  /* tiles */
  --border: #e2dfd6;     /* hairlines */
  --field: #8a877e;      /* input borders, "nothing happened" rings: 3.6:1 */
  --text: #15140f;       /* 16.9:1 on paper */
  --text-2: #46443e;     /* 8.9:1 */
  --muted: #65635c;      /* 5.5:1 */
  --accent: #1f4e79;     /* brand: links, buttons, selection, focus: 7.9:1 */
  --accent-ink: #1f4e79;
  --fill-strong: #1f4e79; /* white on it 8.7:1 */
  --series-1: #1f4e79;
  --band-outer: rgba(31, 78, 121, 0.14);
  --band-inner: rgba(31, 78, 121, 0.30);
  --critical: #b42318;   /* liquidated: 6.0:1 */
  --critical-ink: #b42318;
  --critical-bg: #fbeceb;
  --warning: #a16207;    /* margin call: 4.5:1 */
  --warning-ink: #8a5300;
  --partial: #c2410c;    /* partly sold */
  --good: #2e7d32;
  --neutral-fill: #8a877e;
  --path-kept: #a3a29a;
  --warn-bg: #fff6e0;
  --grid: #e9e6de;
  --focus: #1f4e79;
  --story-1: #b42318;
  --story-2: #a14f00;
  --story-3: #6b3fa0;
  --story-4: #2e7d32;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121210; --surface: #1b1a17; --surface-2: #24231f; --border: #2e2d29; --field: #77746b;
    --text: #f2f0ea; --text-2: #c9c6bd; --muted: #a29f96;
    --accent: #9cc0e8; --accent-ink: #9cc0e8; --fill-strong: #2c5f8f; --series-1: #6fa0d6; --focus: #9cc0e8;
    --band-outer: rgba(111, 160, 214, 0.18); --band-inner: rgba(111, 160, 214, 0.38);
    --critical: #f07167; --critical-ink: #f07167; --critical-bg: #3a1e1e; --warning: #e0a43a; --warning-ink: #f0c060; --partial: #f09a5b; --good: #5cb860;
    --neutral-fill: #77746b; --path-kept: #6b6a64; --warn-bg: #33290f; --grid: #2c2c2a;
    --story-1: #f07167; --story-2: #e08a3a; --story-3: #b48be6; --story-4: #5cb860;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121210; --surface: #1b1a17; --surface-2: #24231f; --border: #2e2d29; --field: #77746b;
  --text: #f2f0ea; --text-2: #c9c6bd; --muted: #a29f96;
  --accent: #9cc0e8; --accent-ink: #9cc0e8; --fill-strong: #2c5f8f; --series-1: #6fa0d6; --focus: #9cc0e8;
  --band-outer: rgba(111, 160, 214, 0.18); --band-inner: rgba(111, 160, 214, 0.38);
  --critical: #f07167; --critical-ink: #f07167; --critical-bg: #3a1e1e; --warning: #e0a43a; --warning-ink: #f0c060; --partial: #f09a5b; --good: #5cb860;
  --neutral-fill: #77746b; --path-kept: #6b6a64; --warn-bg: #33290f; --grid: #2c2c2a;
  --story-1: #f07167; --story-2: #e08a3a; --story-3: #b48be6; --story-4: #5cb860;
}

/* Type scale: 7 sizes (hero 56/72, xl 26/32, lg 20, base 16, sm 14, xs 13, label 12). */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.5 var(--sans); }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0; }
h3 { font-size: 20px; line-height: 1.3; }
h4 { font-size: 16px; margin: 20px 0 4px; }
a { color: var(--accent-ink); }
p { margin: 8px 0; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sub, .hint { color: var(--muted); font-size: 14px; }
.small, .meta { color: var(--muted); font-size: 13px; line-height: 1.4; }
.label { font: 600 12px/1.3 var(--sans); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num, .tiles, table, .lv b { font-variant-numeric: tabular-nums lining-nums; }

/* top bar */
.top { background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.brand { display: flex; align-items: center; gap: 8px; font: 600 18px/1 var(--serif); color: var(--text); text-decoration: none; min-height: 44px; }
.brand .mark { flex: none; }
/* navigation between the three pages: in the top bar on desktop; on phones a second row under
   the name that scrolls away (the name bar stays) */
.skip { position: absolute; left: 8px; top: -60px; z-index: 20; background: var(--surface); color: var(--accent-ink); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); }
.skip:focus { top: 8px; }
.site-nav a { display: flex; align-items: center; min-height: 44px; font: 600 14px var(--sans); color: var(--text-2); text-decoration: none; border-bottom: 3px solid transparent; }
.site-nav a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }
.site-nav a:hover { color: var(--text); }
.desk-nav { display: none; }
.phone-nav { border-bottom: 1px solid var(--border); background: var(--bg); }
.phone-nav .wrap { display: flex; }
.phone-nav a { flex: 1; justify-content: center; text-align: center; padding: 0 4px; }
@media (min-width: 1024px) {
  .desk-nav { display: flex; gap: 4px; margin-right: auto; margin-left: 20px; align-self: stretch; }
  .desk-nav a { padding: 0 12px; }
  .phone-nav { display: none; }
}
/* language menu: the current language, a short list, and "Your language is missing?" */
.lang-menu { position: relative; }
button.lang { display: inline-flex; align-items: center; gap: 6px; font: 600 14px var(--sans); color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0 12px; min-height: 44px; }
button.lang[aria-expanded="true"] { border-color: var(--accent); }
.lang-list { position: absolute; right: 0; top: calc(100% + 6px); min-width: 220px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); padding: 6px; z-index: 10; }
.lang-list[hidden] { display: none; }
.lang-list button, .lang-list a { display: flex; align-items: center; width: 100%; min-height: 44px; padding: 0 10px; border: none; background: none; color: var(--text); font: 400 16px var(--sans); text-align: left; border-radius: 4px; cursor: pointer; }
.lang-list button[aria-current="true"] { font-weight: 600; }
.lang-list button[aria-current="true"]::after { content: "✓"; margin-left: auto; color: var(--accent); }
.lang-list button:hover, .lang-list a:hover { background: var(--surface-2); }
.lang-list a { color: var(--accent-ink); font-size: 14px; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; border-radius: 0; text-decoration: underline; }

/* positioning */
.intro { padding: 20px 0 4px; }
.pos { font-size: 26px; line-height: 1.2; letter-spacing: -0.005em; }
.subhead { color: var(--text-2); font-size: 14px; line-height: 1.45; max-width: 62ch; }
.trust { color: var(--muted); font-size: 13px; margin: 8px 0 16px; }
.trust > :not(.sep) { white-space: nowrap; } /* each part stays whole; a line may end with a dot */
.trust a { color: var(--accent-ink); }

/* buttons */
button { font: inherit; cursor: pointer; }
button.secondary { background: var(--surface); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 6px; padding: 8px 14px; min-height: 44px; font-weight: 600; }
button.primary { background: var(--fill-strong); color: #fff; border: 1px solid var(--fill-strong); border-radius: 6px; padding: 8px 16px; min-height: 44px; font-weight: 600; }
button.link { background: none; border: none; color: var(--accent-ink); text-decoration: underline; padding: 6px 0; min-height: 44px; font-size: inherit; text-align: left; }
button.link.strong { font-weight: 600; text-decoration: none; }
.buttons, .actions { display: flex; flex-wrap: wrap; gap: 8px; }

.notice { background: var(--surface-2); border-left: 4px solid var(--field); padding: 10px 12px; border-radius: 6px; font-size: 14px; }
.notice.error { border-left-color: var(--critical); background: var(--critical-bg); }
.banner { background: var(--warn-bg); border: 1px solid var(--warning); border-radius: 6px; padding: 8px 12px; font-size: 14px; }

/* the answer */
.answer { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin: 0 0 8px; scroll-margin-top: 64px; }
.ans-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ans-top .link { font-size: 14px; padding: 0; }
.example-story { color: var(--text-2); font-size: 14px; margin: 2px 0 12px; }
.example-story:empty { display: none; }
.headline { margin: 0; font-size: 16px; line-height: 1.5; }
.headline .hero-n { font: 600 56px/1 var(--serif); font-style: normal; color: var(--text); letter-spacing: -0.01em; font-variant-numeric: tabular-nums lining-nums; }
.headline .of { font: 600 20px/1 var(--serif); color: var(--text-2); }
.headline .sentence { display: block; margin-top: 6px; }
.dots { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; margin: 12px 0 8px; max-width: 420px; }
.dots i { aspect-ratio: 1; border-radius: 50%; display: block; }
.d-liq { background: var(--critical); }
.d-part { background: var(--partial); }
.d-margin { background: var(--warning); }
.d-none { box-shadow: inset 0 0 0 1.5px var(--field); }
.d-good { background: var(--good); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--text-2); margin: 4px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.best-lever { margin: 12px 0 0; padding: 10px 12px; background: var(--surface-2); border-radius: 6px; font-size: 14px; }
.best-lever:empty, .assume:empty, .sold-line:empty { display: none; }
.sold-line { font-size: 14px; color: var(--text-2); margin: 10px 0 0; }
.undo-line { font-size: 14px; margin: 8px 0 0; padding: 4px 12px; background: var(--surface-2); border-radius: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.undo-line[hidden] { display: none; }
/* phones: while the terms are being edited, the answer stays in view as a bar at the bottom */
.answer-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.12); font-size: 14px; }
.answer-bar[hidden] { display: none; }
#answer-bar-text b { font: 600 20px/1 var(--serif); }
.bar-go { flex: none; background: var(--fill-strong); color: #fff; border: none; border-radius: 6px; padding: 0 14px; min-height: 44px; font: 600 14px var(--sans); cursor: pointer; }
body.bar-on { padding-bottom: 72px; }
@media (min-width: 1024px) { .answer-bar { display: none !important; } body.bar-on { padding-bottom: 0; } }
.assume { font-size: 14px; color: var(--text-2); margin: 8px 0 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); /* 3 per row on phones, 2 on the narrowest */ gap: 8px; margin: 12px 0 0; }
.tile { background: var(--surface-2); border-radius: 6px; padding: 10px; min-width: 0; }
.tile .v { font: 600 17px/1.2 var(--serif); margin-top: 4px; overflow-wrap: anywhere; }
.tile .s { color: var(--text-2); font-size: 13px; line-height: 1.35; margin-top: 2px; }
.tile .label { overflow-wrap: anywhere; }
.sale-line { font-size: 14px; color: var(--text-2); margin: 12px 0 0; }
#kept-line:empty { display: none; }
.answer .actions { margin: 14px 0 4px; }
.answer .meta { margin: 6px 0 0; }
.shared-note { margin: 0 0 12px; padding: 8px 12px; border-radius: 6px; background: var(--surface-2); font-size: 14px; }
.progress { color: var(--muted); font-style: italic; font-size: 14px; }
body.outdated .answer, body.outdated #safer, body.outdated details.section { opacity: 0.55; transition: opacity 0.2s; }
body.invalid .answer, body.invalid #safer, body.invalid details.section { opacity: 0.35; }
.big-line { font-weight: 600; }

/* comparing offers: a table above the answer; the answer below follows the selected column */
.compare { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin: 0 0 8px; }
table.cmp { margin-top: 8px; }
table.cmp { table-layout: fixed; }
table.cmp th, table.cmp td { vertical-align: top; padding: 8px 4px; white-space: normal; overflow-wrap: anywhere; }
table.cmp thead th:first-child, table.cmp tbody th { width: 30%; }
table.cmp thead th { padding: 0 2px 4px; }
table.cmp tbody th { font-weight: 400; color: var(--text-2); white-space: normal; text-align: left; }
table.cmp small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
table.cmp .big { font: 600 20px/1.1 var(--serif); }
button.col { font: 600 14px/1.2 var(--serif); color: var(--text); background: none; border: none; border-bottom: 3px solid transparent; padding: 8px 4px; min-height: 44px; width: 100%; text-align: right; cursor: pointer; }
button.col.active { border-bottom-color: var(--accent); }
.compare .actions { margin: 10px 0 0; }
.showing { margin: 0 0 8px; padding: 8px 12px; background: var(--surface-2); border-radius: 6px; font-size: 14px; }
@media (max-width: 1023px) { tr.desk-only { display: none; } }
@media (max-width: 420px) { .compare { padding: 12px 10px; } table.cmp tbody th, table.cmp td { font-size: 13px; } table.cmp .big { font-size: 20px; } }

/* your terms */
.terms { border-top: 1px solid var(--border); padding: 12px 0 4px; margin-top: 8px; }
.terms-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.terms-head .link { padding: 0 4px; }
.terms-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.terms-chips span { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
.terms.closed #form-wrap { display: none; }
.terms:not(.closed) .terms-chips { display: none; }

/* form */
.field { margin: 12px 0; }
.label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.field label, .field .label, legend .label { font: 600 14px/1.4 var(--sans); text-transform: none; letter-spacing: 0; color: var(--text); display: block; margin-bottom: 4px; }
button.q { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); color: var(--accent-ink); font-weight: 700; margin-left: 6px; position: relative; }
button.q::before { content: ""; position: absolute; inset: -6px; } /* 44px tap target */
button.q[aria-expanded="true"] { background: var(--fill-strong); color: #fff; border-color: var(--fill-strong); }
.help { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; font-size: 14px; margin: 6px 0; }
input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--field); border-radius: 6px; padding: 9px 11px; min-height: 44px; width: 100%; max-width: 100%; font-variant-numeric: tabular-nums; }
textarea { resize: vertical; }
.with-unit { display: flex; align-items: center; gap: 6px; }
.with-unit .unit { color: var(--muted); white-space: nowrap; }
.amount-row { display: flex; gap: 8px; align-items: flex-end; }
.amount-row .field { flex: 1; margin-bottom: 12px; }
.amount-row select.cur { width: auto; margin-bottom: 12px; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--field); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1 1 auto; background: var(--surface); color: var(--text-2); border: none; border-right: 1px solid var(--field); padding: 9px 10px; min-height: 44px; font-weight: 600; font-size: 14px; }
.seg button:last-child { border-right: none; }
.seg button[aria-pressed="true"] { background: var(--fill-strong); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips > button, .chip { border: 1px solid var(--field); border-radius: 999px; padding: 6px 12px; background: var(--surface); color: var(--text); min-height: 44px; display: inline-flex; align-items: center; gap: 4px; }
.chips > button[aria-pressed="true"] { background: var(--fill-strong); color: #fff; border-color: var(--fill-strong); }
.chips > button[aria-pressed="true"] .sub { color: #fff; }
.chips .other { width: 150px; }
.chips .other input { min-height: 44px; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip:has(input:checked) { background: var(--fill-strong); color: #fff; border-color: var(--fill-strong); }
.chip:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.pair { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pair > * { flex: 1 1 140px; }
.pair.tax .field { margin: 6px 0; }
.rate-row { border-left: 3px solid var(--border); padding-left: 10px; margin: 8px 0; }
.rate-row label { font-weight: 400; font-size: 14px; color: var(--text-2); }
.price-line { font-size: 14px; color: var(--muted); }
.price-line.stale { color: var(--critical-ink); font-weight: 600; }
.where { background: var(--surface-2); border-radius: 6px; padding: 8px 12px; font-size: 14px; }
.where .sample { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
details.more { border-top: 1px solid var(--border); padding: 4px 0; }
details.more > summary { cursor: pointer; font-weight: 600; padding: 10px 0; min-height: 44px; color: var(--accent-ink); }
details.more > summary .sum { font-weight: 400; color: var(--muted); font-size: 13px; }
.sub-group { border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; margin: 12px 0; }
.sub-group legend { display: flex; align-items: center; padding: 0 4px; }
.err { color: var(--critical-ink); font-weight: 600; font-size: 14px; margin: 6px 0 0; }
.err[hidden] { display: none; }
label.block { display: block; font-weight: 600; margin: 10px 0; }
label.check { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
label.check input { width: 20px; min-height: 20px; }
fieldset { border: none; padding: 0; margin: 10px 0; }
fieldset legend { font-weight: 600; padding: 0; margin-bottom: 4px; }

/* make it safer */
.block { border-top: 1px solid var(--border); padding: 14px 0 6px; }
.sec-title { font-size: 20px; line-height: 1.3; }
.slider label { font-weight: 600; display: block; }
/* The slider: a 22 px handle on a 6 px track. The labels below are placed with the same formula
   the browser uses for the handle (centre = 11 px + share × (width − 22 px)). */
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; padding: 0; margin: 0; min-height: 44px; background: transparent; border: none; --fill: 0%; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--fill), var(--surface-2) var(--fill)); box-shadow: inset 0 0 0 1px var(--field); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; box-sizing: content-box; width: 18px; height: 18px; margin-top: -8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--accent); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--field); }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--accent); }
.ticks { position: relative; height: 18px; font-size: 12px; color: var(--muted); margin-top: -6px; }
.ticks span { position: absolute; left: calc(11px + var(--at) * (100% - 22px)); transform: translateX(-50%); white-space: nowrap; }
.levers { margin: 6px 0; }
.lv { display: grid; grid-template-columns: 1fr 90px 28px; gap: 8px; align-items: center; font-size: 14px; margin: 6px 0; }
.lv .b { height: 8px; border-radius: 2px; background: var(--surface-2); position: relative; overflow: hidden; }
.lv .b i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text-2); border-radius: 2px; }
.lv b { text-align: right; }
.lv.base { font-weight: 700; }
.questions { padding-left: 1.2em; margin: 8px 0; }
/* "Before you sign": a folded checklist tile, set apart from the plain sections below */
details.checklist { background: var(--surface-2); border-radius: 12px; padding: 0 16px; margin: 16px 0 12px; }
details.checklist > summary { list-style: none; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; min-height: 44px; }
details.checklist > summary::-webkit-details-marker { display: none; }
details.checklist > summary::after { content: "▸"; margin-left: auto; color: var(--accent); font-weight: 600; transition: transform 0.15s; }
details.checklist[open] > summary::after { transform: rotate(90deg); }
details.checklist[open] { padding-bottom: 12px; }
.cl-icon { flex: none; color: var(--accent); margin-top: 1px; }
.cl-text { display: flex; flex-direction: column; gap: 2px; }
.cl-title { font: 600 16px/1.3 var(--serif); color: var(--text); }
.cl-preview { font-size: 14px; color: var(--text-2); }
.questions li { margin: 6px 0; }
.range-label { display: block; font-weight: 600; margin-top: 10px; }

/* folded sections: hairlines, not cards */
details.section { border-top: 1px solid var(--border); }
details.section:last-of-type { border-bottom: 1px solid var(--border); }
details.section > summary { cursor: pointer; padding: 14px 0; min-height: 44px; list-style-position: inside; color: var(--text); }
details.section > summary::marker { color: var(--accent); }
details.section > summary h3 { display: inline; }
details.section[open] { padding-bottom: 14px; }
details.limits > summary { cursor: pointer; color: var(--accent-ink); font-size: 14px; padding: 6px 0; }
#limits { padding-left: 1.2em; font-size: 16px; }
.ladder { position: relative; --line: 8px; height: 72px; margin: 10px 4px 6px; }
.ladder.two-rows { --line: 56px; height: 120px; }
.ladder .ln { position: absolute; left: 0; right: 0; top: var(--line); height: 4px; border-radius: 2px; background: var(--grid); }
.ladder .dot { position: absolute; top: calc(var(--line) - 5px); width: 14px; height: 14px; transform: translateX(-50%); border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border); }
.ladder .lab { position: absolute; top: calc(var(--line) + 14px); text-align: center; font-size: 12px; line-height: 1.25; white-space: nowrap; }
.ladder .lab.up { top: auto; bottom: calc(100% - var(--line) + 10px); }
.ladder .dot-today { background: var(--series-1); }
.ladder .dot-margin { background: var(--warning); }
.ladder .dot-sale { background: var(--critical); }
.story-legend { list-style: none; padding: 0; font-size: 14px; }
.story-legend li { margin: 4px 0; }
.story-legend i { display: inline-block; width: 12px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
ul.method { padding-left: 1.2em; }
ul.method li { margin: 6px 0; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
details.sub-details { border-top: 1px solid var(--border); margin-top: 14px; }
details.sub-details > summary { cursor: pointer; font: 600 16px/1.3 var(--serif); padding: 12px 0; min-height: 44px; color: var(--text); }
details.table-details > summary { cursor: pointer; color: var(--accent-ink); padding: 6px 0; }

/* charts */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 12px; }
.chart .band-outer { fill: var(--band-outer); }
.chart .band-inner { fill: var(--band-inner); }
.chart .line-series { fill: none; stroke: var(--series-1); stroke-width: 2; }
.chart .line-critical { fill: none; stroke: var(--critical); stroke-width: 2; stroke-dasharray: 6 4; }
.chart .line-warning { fill: none; stroke: var(--warning); stroke-width: 2; stroke-dasharray: 3 3; }
.chart .label-critical { fill: var(--critical-ink); font-size: 12px; font-weight: 600; }
.chart .label-warning { fill: var(--warning-ink); font-size: 12px; font-weight: 600; }
.chart .path-kept { fill: none; stroke: var(--path-kept); stroke-width: 1.2; stroke-opacity: 0.75; }
.chart .path-sold { fill: none; stroke: var(--critical); stroke-width: 1.6; stroke-opacity: 0.9; }
.chart .mark-sold { fill: var(--critical-ink); font-size: 13px; font-weight: 700; }
.chart .story { fill: none; stroke-width: 2.4; }
.chart .story-after { fill: none; stroke-width: 1.2; stroke-dasharray: 2 3; opacity: 0.6; }
.chart .bar { fill: var(--series-1); }
.chart .bar.dim { opacity: 0.45; }
.chart .cross { stroke: var(--text-2); stroke-width: 1; }
.chart .tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15); white-space: nowrap; z-index: 2; }
.t-critical { color: var(--critical-ink); }

/* the line under the answer that links to the insights */
.hook { margin: 12px 0 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 14px; }

/* "Insights" and "How it works": one reading column with numbered parts */
.page > * { max-width: 760px; }
.toc { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin: 8px 0 8px; }
.toc ol { margin: 6px 0 0; padding-left: 1.4em; }
.toc li { margin: 2px 0; }
.toc a { display: inline-block; padding: 6px 0; min-height: 32px; }
.part { border-top: 1px solid var(--border); padding: 16px 0 8px; scroll-margin-top: 64px; }
.part h2 { font-size: 20px; line-height: 1.3; }
.part h3 { font-size: 16px; margin: 20px 0 4px; }
.steps { padding-left: 1.4em; }
.steps li { margin: 8px 0; }

/* footer */
footer { margin: 20px 0 40px; border-top: 1px solid var(--border); padding-top: 16px; font-size: 14px; color: var(--text-2); }
footer .maker { color: var(--text); font-weight: 600; }
footer details { border-top: 1px solid var(--border); }
footer details > summary { cursor: pointer; padding: 10px 0; min-height: 44px; color: var(--accent-ink); }
.donate { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin: 14px 0; }
.donate .qr svg { width: 112px; height: 112px; background: #fff; border-radius: 6px; display: block; }
.addr { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; color: var(--text); }
dl dt { font-weight: 700; margin-top: 10px; }
dl dd { margin: 2px 0 0; }
dt, details, h3, #terms, .part { scroll-margin-top: 64px; }
@media (max-width: 420px) { .donate { flex-direction: column; } }
@media print { .top { position: static; } button { display: none; } details { display: block; } }

/* desktop: the report on the left, your terms beside it */
@media (min-width: 1024px) {
  .wrap { max-width: 1180px; padding: 0 32px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; column-gap: 40px; align-items: start; }
  .layout > * { grid-column: 1; min-width: 0; }
  .intro { padding-top: 28px; }
  .pos { font-size: 32px; }

time, otherwise the lender sells everything",partialAfterCure:"Top up in time, otherwise the lender sells only enough",autoPartial:"The lender sells part of the BTC at once"},curePeriodHours:{label:"Time to top up"},liquidationSale:{label:"At the liquidation LTV the lender sells",all:"everything",partial:"only enough"},cureTargetLtv:{label:"LTV the lender brings you back to",hint:"Empty means your starting LTV."},liquidationFee:{label:"Liquidation fee",debt:"% of the amount owed",collateralSold:"% of the BTC sold"},repayWith:{label:"How will you repay?",sell:"By selling BTC at the end",cash:"With new money"},currency:{label:"Currency"},startDate:{label:"Start date",hint:"Only matters if interest is counted by actual days."},dayCount:{label:"How days are counted","30/360":"Yearly rate \xF7 12 each month","act/365":"Actual days \xF7 365","act/360":"Actual days \xF7 360"},simPaths:{label:"Simulated futures",2e3:"2,000 (fast)",1e4:"10,000",2e4:"20,000 (slow on phones)"},bootstrapBlockDays:{label:"Length of copied price stretches (days)"}},help:{initialLtv:"LTV = loan \xF7 value of the BTC you pledge. A lower LTV means more BTC behind the same loan, so the price can fall further. Example: loan \u20AC10,000 at 50% LTV means you pledge BTC worth \u20AC20,000. At a BTC price of \u20AC50,000 that is 0.4 BTC.",liquidationLtv:"When BTC falls, your loan stays the same but your BTC is worth less, so the LTV rises. At this LTV the lender sells your BTC. A higher number gives you more room. Example: \u20AC10,000 loan, 0.4 BTC, liquidation at 80%: the sale happens when 0.4 BTC is worth \u20AC12,500, which is a BTC price of \u20AC31,250.",repayment:"If interest is added to the loan, what you owe grows every month, and so does the price at which your BTC is sold. Example: \u20AC10,000 at 10% for a year. Paid monthly, you owe \u20AC10,000 all year. Added to the loan, you owe about \u20AC11,000 at the end, and the sale price rises by about 10%.",marginCall:"A [[marginCall]] comes before a sale: your LTV has risen to a warning level. What happens next depends on your lender. It may be only a warning. You may have some hours to add BTC or repay part, or the lender sells everything or just enough. Or the lender sells part of your BTC at once. Example: margin call at 70% with a 48-hour deadline: if the LTV is still 70% after 48 hours, the lender sells."}},where:{title:"Where to find these numbers",intro:"Your offer or loan agreement contains five numbers this page needs. Look for these words:",items:[{field:"Loan amount",words:'"principal", "loan amount", "Darlehensbetrag"'},{field:"Starting LTV",words:'"LTV", "loan-to-value", "Beleihungsquote". If only the collateral amount is given: loan \xF7 collateral value'},{field:"Liquidation LTV",words:'"liquidation", "Verwertung", the section on selling or enforcing the collateral'},{field:"Duration",words:'"term", "maturity", "Laufzeit"'},{field:"Interest rate",words:'"nominal rate", "interest rate", "Sollzins". Not the APR: the page calculates that itself'}],others:'The other terms are in sections called "fees", "collateral monitoring" or "margin call". The page fills them with starting values you can change under "More terms from your offer".',sample:"Principal amount: EUR 15,000.00 \xB7 Term: 12 months \xB7 Loan-to-Value at origination: 50 % \xB7 Nominal interest rate: 11.5 % p.a. \xB7 If the LTV reaches 83 %, the lender may sell collateral."},results:{title:"Your result",heroOf:"of 100",heroLiq:"simulated futures end with this loan liquidated within {months} months.",heroLiqExisting:"simulated futures end with this loan liquidated in the {months} months left.",heroPartial:"simulated futures end with all your BTC sold to close the loan within {months} months. In {m} more, the lender sells part of it.",labelExample:"Example",labelYours:"Your terms",labelShared:"Shared with you",ownTerms:"Use your own terms \u2192",editTerms:"Change the terms",exampleStory:"Borrow {amount} for {months} months against BTC w "Is the leverage worth it?",history:"Your loan in every crash since 2014",feedback:"Help improve this page"},falls:{ladderToday:"Today",ladderMargin:"Margin call",ladderSale:"Liquidation",marginWarning:"At {mcPrice} (margin call): you get a warning. Adding {topUp} BTC (\u2248 {topUpValue}) or repaying {repay} would bring the LTV back to {target}.",marginCure:"At {mcPrice} (margin call): you have {hours} hours to add {topUp} BTC (\u2248 {topUpValue}) or repay {repay}. Otherwise the lender sells {what}.",marginAuto:"At {mcPrice} (margin call): the lender sells about {sold} BTC at once to bring the LTV back to {target}. You keep {left} of your {btc} BTC, and the loan continues.",whatAll:"everything",whatPartial:"about {sold} BTC, just enough to reach {target}",liquidationAll:"At {price} (liquidation): the lender sells {sold} BTC, including the fee. You get back {returned} BTC (\u2248 {returnedValue}) and keep the money you borrowed.",liquidationPartial:"At {price} (liquidation): the lender sells about {sold} BTC, just enough to bring the LTV back to {target}. You keep {left} of your {btc} BTC, and the loan continues.",futuresTitle:"20 possible futures",futuresLine:"Each line is one possible path of the BTC price over your loan, built from real 30-day stretches of BTC's past, joined at random. \u2715 = the lender sells. {k} of these 20 end with a sale.",futuresHelp:"The simulation takes the real daily price moves of BTC since 2014 and cuts them into 30-day pieces. It joins randomly chosen pieces into a new path for the length of your loan. Each path keeps the real mix of calm and wild weeks. Example: one path may start with a stretch from May 2021 (a 50% fall) followed by one from late 2023 (a steady rise).",futuresMarginNote:"Some \u2715 sit above the red line: there, a margin call (amber line) was not fixed in time, or the lender sold part of the BTC.",showOthers:"Show 20 other futures ({n} of {sets})",questionsTitle:"Before you sign: {n} questions to ask your lender",questionsPreview:"What happens after a margin call, which price counts, who holds your BTC \u2026",questions:["At which LTV do you sell my BTC?","What exactly happens after a margin call? Only a warning, or a sale after a number of hours? Everything or only part?","Which BTC price do you use: one exchange, an average, over how long?","Do you sell all my BTC or only as much as needed?","What does a liquidation cost?","Who holds my BTC? Is it kept separate? Is it lent out?","If I switch lenders: how is my current loan paid off, and how long is my BTC in transit?","Is there a fee for repaying early?"]},cost:{line:"You receive {received} and pay back {payback}. The loan costs {cost} if nothing goes wrong ({apr} a year including fees).",lineExisting:"You pay back {payback} in total from today, of which {interest} is interest.",timingNote:"The yearly rate including fees counts when you pay: the same total paid earlier, for example interest every month instead of at the end, gives a higher rate.",schedule:"Show the monthly payment plan",scheduleHead:["Month","Date","Interest","Repayment","Payment","Owed afterwards"],sellIntro:"Borrowing only beats selling BTC today if BTC rises enough. Assuming you repay by selling BTC at the end:",breakeven:"BTC must be at least {rise} higher at the end, and the loan must not be liquidated on the way.",taxNow:"Tax if you sell BTC today",taxLater:"Tax if you sell at the end",taxNote:"Enter your own tax rates (0 if none). Rules differ by country and holding period; ask a tax adviser. A liquidation is a sale too and may be taxed.",levIntro:"With {received} you buy {bought} BTC today.",levHeadline:"In {more} of 100 futures you end with more BTC than without the loan. In {less} of 100 with less ({liq} of them liquidated).",levSizes:"How much, as the middle value of each group, in BTC compared with not borrowing: more BTC {more}, less but not sold {less}, liquidated {liq}.",levLegendMore:"more BTC",levLegendLess:"less, not sold",levLegendLiq:"liquidated",levLiquidated:"If liquidated, you end with about {end} BTC instead of {start} BTC, even though you bought more.",levBreakeven:"Breakeven: BTC must be {rise} higher at the end, without a sale on the way.",levCash:"Repaying with new money: you keep the bought BTC unless your collateral is sold, and pay {payback} from other money.",levTrendTitle:"Does the price trend matter here?",levTrendUnit:"Number = futures of 100 in which you end with more BTC than without the loan."},history:{replay:"Started on any day since 2014, this exact loan would have been liquidated {n} times in 100{partial}.",replayPartial:", and in {m} more, part of the BTC would have been sold",storiesTitle:"If one of these real years started today",storiesLine:"Your loan, on real BTC prices from these start dates, scaled to today's price. \u2715 = sale. Dotted = what happened afterwards.",sold:"{date}: sold after {days} days. One year later BTC was {end}\xD7 the start.",partial:"{date}: part sold after {days} days; you keep {left} of your BTC.",survived:"{date}: no sale. One year later BTC was {end}\xD7 the start.",byMonth:"More than half of all liquidations in the simulation happen in the first {months} months.",trendTitle:"Does the price trend matter?",trendIntro:"Nobody knows where BTC goes next. Here is your loan with five different yearly [[priceTrend]] values. The swings stay as they were in the past.",trendRow:"{trend} a year",trendNone:"No trend (the answer above)",trendUnit:"Number = futures of 100 in which the loan is liquidated.",trendConclusion:"A rising price lowers the risk, but even at {topTrend} a year, {top} of 100 futures still end in liquidation.",bridgeLower:"The answer at the top says {n}. The difference: real history includes BTC's strong rise since 2014; the simulation keeps the swings but leaves the rise out, because nobody knows if it will continue.",bridgeOther:'The answer at the top says {n}. History and simulation do not have to match: see "How it works" (link above).',trendUncertainty:"Since 2014, BTC grew by about {estimate} a year. But the swings are so large that this is only known to lie between {low} and {high}. The past trend is too uncertain to build on.",trendPast:"BTC's yearly growth (compounded) over 4-year periods since 2014: weakest {worst}, middle {median}, strongest {best}. It has fallen over time: {firstFrom}\u2013{firstTo} {firstRate} a year, {lastFrom}\u2013{lastTo} {lastRate} a year.",trendSwings:"In {deep} of {years} calendar years since 2014, BTC fell at least 50% from a high within the same year. A loan has to survive these falls, whatever the long-term direction."},insights:{title:"Insights",metaTitle:"Insights \xB7 Bitcoin Loan Check",metaDescription:"What happened to Bitcoin-backed loans since 2014: how much buffer they needed, which terms mattered most, and how fast BTC crashes went. Not a forecast, not advice.",intro:'What happened to BTC-backed loans since 2014, measured on the same hourly prices as the check. Not a forecast and not advice: it shows what happened, never what is "best".',coming:"This page is being built. It will show:",groups:["How much buffer does a loan need?","Which terms matter most?","Comparing offers fairly","By goal: buying more BTC, or spending without selling","Today's price swings compared with history"],levFacts:"Since 2014, BTC was higher 4 years later on {h4} of start days in this page's data. One year later it was higher on only {h1}, and the worst year ended {w1}. A loan has to survive the path, not just reach the destination. The past does not guarantee the future."},method:{title:"How it works",metaTitle:"How it works \xB7 Bitcoin Loan Check",metaDescription:"How Bitcoin Loan Check computes the risk of a BTC-backed loan, which data it uses, how it was tested against history, and how to verify every number yourself.",short:"The page takes BTC's real price moves since 2014 and builds 10,000 possible futures from them. On each one, it applies your lender's rules hour by hour. The number at the top counts in how many of 100 futures your BTC is sold. Two other methods check it.",example:"The charts and numbers on this page use the example loan: {story}",toc:"On this page",stepsTitle:"How the numbers are made",steps:["Real prices: every hour since 2014, with its lowest price, so short crashes are not missed.","Possible futures: real daily price moves, cut into 30-day pieces and joined at random into 10,000 paths.","The lender's rules: margin call, deadlines, partial sales and fees, applied exactly as entered, on every path.","Counted: in how many of 100 paths the BTC is sold before the loan ends. That is the number at the top."],fanTitle:"Range of simulated prices",fanNote:"Each month: 9 of 10 simulated prices lie in the light band, half in the dark band; the line is the middle one. The bands show prices, not outcomes: a path that dips below the liquidation line and recovers still ended in a liquidation.",byMonthTitle:"Liquidated by the end of each month (of 100)",methodsTitle:"Three methods side by side",methodsIntro:"Every method can be wrong in its own way. So the page computes the same loan three ways, plus a textbook formula as a rough check.",methods:["Possible futures from past price moves: the method above. It gives the number at the top.","Volatility model ([[garch]]): wild days make more wild days likely. It is fitted to the same prices.","Real history: the same loan, started on every day since 2014, against the real lowest price of every hour. It includes BTC's rise since 2014."],compareTitle:"Methods compared (liquidated, of 100)",compareRows:{bootstrap:"Possible futures from past price moves",garch:"Volatility model (GARCH)",replay:"Real history since 2014",barrier:"Textbook formula (calm, regular moves)"},barrierNote:"The textbook formula assumes calm, regular price moves (volatility {sigma} a year) and ignores the margin-call rules, so it tends to show a lower number. It is a rough check only.",settings:"Settings used: {paths} futures, {block}-day stretches, data {from} to {to}.",testTitle:"The test against history",test:'From 2016 on, the method only saw the past and then predicted the lowest price of the next 90 and 365 days. Reality fell below its "worst 5%" level in 0 to 6 of 100 cases, close to or below the promised 5. The method is cautious rather than optimistic.',dataTitle:"Data and the weekly update",data:["Price data: hourly prices from the exchanges Bitstamp (USD since 2014, EUR since 2017) and Kraken (EUR 2014\u20132016), as published by the exchanges. Known gap: Bitstamp was offline from 5 to 9 January 2015.","Other currencies (CHF, GBP, CAD, AUD, CZK, PLN): the euro prices, converted hour by hour with the daily exchange rate of the European Central Bank. Compared with real exchange prices, half of all hours differ by 0.2% or less.","Current price: Coinbase, or if that fails Kraken, Binance or CoinGecko. The page also adds the hours since the last update from Bitstamp.","Once a week, an automatic job adds the newest prices and exchange rates. It checks them first (gaps, impossible prices, sources that disagree) and stops if something looks wrong."],measure:"Your lender decides which BTC price counts: one exchange, an average of several, or an average over some minutes. A single exchange can briefly drop much lower than others. This page uses the lowest price of every hour on one exchange, which is cautious, but it cannot copy your lender's method exactly.",trendTitle:"Why no price trend is assumed",trend:`With BTC's past average growth built in, the test against history failed: the method became too optimistic. On the check page, "Does the price trend matter?" shows how much a trend would change your answer.`,limitsTitle:"What the model cannot do",limits:["It only knows price moves that happened since 2014. A crash of a new kind is not in it.","It joins 30-day pieces at random, so longer rising or falling phases are mixed up. The test against history checks that this does not make it too optimistic.","It assumes no price trend. If BTC rises strongly, real outcomes are better; if it falls for years, they are worse."],verifyTitle:"Verify it yourself",code:"All code, data and tests are open: {link}",verify:["The tests recompute 12 reference loans to 9 decimal places. They also check every rule of the lender model, and break the code on purpose to see that the tests notice.",`Check one number by hand: take the liquidation price from your answer and look up in the price data how often BTC fell that far within your loan's duration. That is roughly the "real history" number.`]},feedback:{intro:"Four short questions. Your answers go into an e-mail in your own mail app, and you decide whether to send it. Nothing is sent by this page.",use:"What will you mainly use the money for?",useOptions:{spend:"Spend it",compare:"Compare offers",buy:"Buy more BTC",curious:"Just curious"},meaning:"In one sentence: what does the big number at the top mean?",useful:"This page gives me what I need to decide.",easy:"This page is easy to use.",scaleLow:"not at all",scaleHigh:"fully",missing:"What was confusing, or what is missing? (optional)",language:"Which language would you prefer for this page? (optional)",languageMissing:"Your language is missing? Tell us.",languageSubject:"Language request for Bitcoin Loan Check",attach:"Attach my loan terms (no personal data)",write:"Write e-mail",copy:"Copy text",copied:"Copied. Send it to {email}.",subject:"Bitcoin Loan Check feedback"},compare:{add:"+ Compare an offer",addRefi:"+ Compare with a refinancing offer",addC:"+ Offer C",remove:"Remove {name}",end:"End comparison",title:"Compare offers",titleRefi:"Current loan and refinancing",sameFutures:"same simulated futures for all",names:["Offer A","Offer B","Offer C"],current:"Current loan",refinanced:"Refinancing",nameLabel:"Name of this offer (stays in your browser)",rowLiq:"Liquidated, of 100",withinMonths:"within {months} months",nextMonths:"next {months} months, both",wholeTerm:"whole new term, {months} months",rowSold:"Sold at",rowCost:"Full cost",perYear:"effective {apr} a year",interestLeft:"interest left",inclSwitching:"incl. switching costs",rowReceive:"You receive",rowReceiveNow:"You receive now",rowMargin:"Margin call at",fixTerms:"fix the terms",noWinner:"No offer is marked as better: one can be safer, another cheaper. Tap a name to see that offer in full below.",diffAmount:"The offers lend different amounts.",diffMonths:"The offers run for different lengths; a longer loan has more time to be liquidated.",shorterRefi:"The new loan is shorter than the months left on the current one.",showing:"Showing below: {name}. Everything under this line is about this offer.",startsFrom:"Starts from your current loan: you owe {owed} against {btc} BTC, {months} months left.",newLoanLine:"New loan: {amount} against {btc} BTC, starting LTV {ltv}.",whatChanges:"What changes?",same:"Same amount",more:"Borrow more",back:"Take back BTC",extra:"Extra cash",backBtc:"BTC taken back",moreTerms:"More terms of the new loan",switching:"Switching costs",switchingSum:"{sum} so far",exitFee:"Fee for repaying the current loan early",transferFee:"Other costs of switching (transfer, network fees)"},share:{compare:"Loan offers compared, liquidated within the term, of 100: {list}.",refi:"Refinancing checked: next {months} months, liquidated, of 100: current loan {a}, refinancing {b}.",one:"Loan offer checked: {n} of 100 simulated futures end in liquidation within {months} months. BTC is sold at {price} ({drop}). Full cost {cost}.",existing:"Loan checked: {n} of 100 simulated futures end in liquidation in the {months} months left. BTC is sold at {price} ({drop})."},donate:{text:"This page is free and has no ads. If it helped you, you can support its upkeep with a Bitcoin donation.",copy:"Copy address",copied:"Address copied",public:"Donations on the Bitcoin network are public."},footer:{maker:"Independent project by {name}. No lender pays for or influences this page.",license:'Open source under the MIT licence. Provided "as is", without warranty of any kind: use it at your own risk.',notAdvice:"This page is not financial, investment or tax advice. It is a calculator with a model of past price moves. It cannot know your situation or the future. Check every number against your lender's documents."},glossary:{title:"Glossary",terms:{ltv:{term:"LTV (loan-to-value)",text:"The loan divided by the value of the pledged BTC, in percent. Loan \u20AC10,000 and BTC worth \u20AC20,000 means an LTV of 50%. When the BTC price falls, the LTV rises."},marginCall:{term:"Margin call",text:"A warning from the lender that your LTV has risen to a set level. Depending on the lender, you must add BTC or repay part of the loan within some hours, or the lender sells part of your BTC."},liquidation:{term:"Liquidation",text:"The lender sells your pledged BTC to repay the loan, without asking you. It happens when the LTV reaches the liquidation level, or when a margin call is not fixed in time."},partialLiquidation:{term:"Partial sale",text:"The lender sells only part of your BTC, enough to bring the LTV back to a lower level. The loan continues, with less BTC behind it."},collateral:{term:"Collateral",text:"Something you give as security for a loan. Here: your BTC. You get it back when the loan is repaid."},curePeriod:{term:"Cure period",text:"The time you have after a margin call to fix it, for example by adding BTC."},originationFee:{term:"Origination fee",text:"A one-off fee for opening the loan. It can be taken from the money you receive."},aprVsRate:{term:"APR vs. interest rate",text:"The interest rate is the price of borrowing before fees. The effective APR adds fees and the timing of payments, as one yearly percentage."},compounding:{term:"Compounding",text:"Interest that is added to the debt also earns interest. The debt grows a little faster."},dayCount:{term:"Day count",text:"The rule for turning a yearly rate into interest for a period: each month as one twelfth of a year, or the actual days."},drawdown:{term:"Drawdown",text:"How far a price falls from an earlier high. From \u20AC60,000 down to \u20AC30,000 is a drawdown of 50%."},ohlc:{term:"OHLC (candle)",text:"Four prices for a period such as one hour: open, high, low, close. This page uses the low of every hour to check for sales."},priceIndex:{term:"Price index",text:"The price source a lender uses to value your BTC: one exchange, or an average of several. It decides when a margin call or sale happens."},counterpartyRisk:{term:"Counterparty risk",text:"The risk that the other side, here the lender, does not keep its promise, for example because it goes bankrupt."},rehypothecation:{term:"Rehypothecation",text:"The lender lends out or reuses the BTC you pledged. If the lender gets into trouble, your BTC may be gone."},simulatedFuture:{term:"Simulated future",text:'One possible path of the BTC price over your loan, built from real past price moves. Counting what happens in many of them gives a chance in "N of 100".'},blockBootstrap:{term:"Block bootstrap",text:"The method behind the simulated futures: pieces of real price history (30 days each) are picked at random and joined together."},garch:{term:"GARCH model",text:"A statistics model for prices in which wild days make further wild days more likely, and very large moves happen more often than in the textbook model."},historicalReplay:{term:"Historical replay",text:"The loan is started on every past day and checked against what the price really did afterwards."},priceTrend:{term:"Price trend",text:"An assumed yearly price change of the middle simulated future (compounded). It shifts all simulated futures up or down; the swings stay the same."}}},errors:{LOAN_AMOUNT_INVALID:{problem:"The loan amount must be a number above zero.",fix:"Enter the amount from your offer, for example 10000."},PRICE_INVALID:{problem:"The BTC price must be a number above zero.",fix:"Load the current price or type today's price."},LTV_OUT_OF_RANGE:{problem:"The starting LTV must be between 0% and 100%.",fix:"Enter the LTV from your offer, for example 50."},LIQ_LTV_NOT_ABOVE_INITIAL:{problem:"The liquidation LTV is not higher than the starting LTV. The loan would be liquidated at once.",fix:"Check both numbers. The liquidation LTV must be higher, for example 50% at the start and 80% for liquidation."},LIQ_LTV_TOO_HIGH:{problem:"The liquidation LTV must be a number up to 100%.",fix:"Enter the liquidation LTV from your offer, for example 80."},MARGIN_LTV_OUT_OF_RANGE:{problem:"The margin-call LTV must lie between the starting LTV and the liquidation LTV.",fix:"Check the number, or leave it empty if your offer has no margin call."},DURATION_INVALID:{problem:"The duration must be a whole number of months, at least 1.",fix:"Enter the months, for example 12 for one year."},NEGATIVE_RATE:{problem:"An interest rate cannot be negative here.",fix:"Enter the rate as a positive number, for example 10, or 0."},RATE_PATH_INVALID:{problem:"The rate changes are not in order, do not start at month 0, or go past the end of the loan.",fix:"Start with month 0, then add later months in increasing order, all before the end."},NEGATIVE_FEE:{problem:"A fee cannot be negative, and a percentage fee must be below 100%.",fix:"Enter the fee from your offer, or 0."},FEE_EXCEEDS_LOAN:{problem:"The origination fee is as large as the loan or larger.",fix:"Check whether the fee is a percentage or a fixed amount."},CURE_NEGATIVE:{problem:"The time to top up cannot be negative.",fix:"Enter the hours from your offer."},TAX_RATE_INVALID:{problem:"A tax rate must be between 0% and below 100%.",fix:"Enter a percentage such as 25, or 0."},RESERVE_NEGATIVE:{problem:"The amount kept ready cannot be negative.",fix:"Enter an amount, or 0."},CURE_TARGET_INVALID:{problem:"The LTV the lender brings you back to must be above 0% and below the margin-call LTV.",fix:"Leave it empty to use your starting LTV, or enter the number from your offer."},COLLATERAL_INVALID:{problem:"The amount of BTC pledged must be a number above zero.",fix:"Enter the BTC amount, for example 0.25."},EXISTING_LOAN_AT_LIQUIDATION:{problem:"With these numbers, your LTV today is already at or above the liquidation LTV.",fix:"Check the amount owed, the BTC pledged and the BTC price. If they are right, contact your lender now."}},legal:{templateNote:"Template: the parts in \xABangle quotes\xBB must be filled in, and the text should be checked by a lawyer before publishing.",impressumTitle:"Legal notice (Impressum)",impressum:["Information under \xA7 5 DDG (German Digital Services Act), if it applies to this page:","bitcoinloancheck \u2014 Lennart Bodden","c/o Online-Impressum 11950, Europaring 90, 53757 Sankt Augustin, Germany","E-mail: {email}","Responsible for the content under \xA7 18 (2) MStV: Lennart Bodden, address as above","Supervisory authority: Landesanstalt f\xFCr Medien Nordrhein-Westfalen (media authority of North Rhine-Westphalia)","This page is a free, private calculator. It does not offer loans, does not arrange loans, and has no business relationship with any lender."],privacyTitle:"Privacy notice",privacy:[{h:"1. Who is responsible",p:["Responsible for data processing on this page: \xABFirst and last name\xBB, \xABStreet and house number\xBB, \xABPostcode and town\xBB, \xABCountry\xBB, {email}."]},{h:"2. Hosting by GitHub Pages",p:["This page is delivered by GitHub Pages, a service of GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA. When you open the page, GitHub processes technical data that every web server needs: your IP address, date and time, the requested address, and your browser type. GitHub may store this data in log files.","Legal basis: Art. 6 (1) (f) GDPR. Our legitimate interest is delivering the page securely and reliably. GitHub is located in the USA. \xABCheck and name the legal basis for the transfer to the USA, for example the EU-US Data Privacy Framework.\xBB GitHub privacy statement: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement"]},{h:"3. Current BTC price (automatic requests when the page opens)",p:["To show the current BTC price, your browser contacts public price services directly when the page opens: first api.coinbase.com (Coinbase); only if that does not answer, then api.kraken.com (Kraken), api.binance.com (Binance) and api.coingecko.com (CoinGecko), one after the other. In addition, your browser loads the most recent hourly prices from www.bitstamp.net (Bitstamp). Loading the current price again or changing the currency repeats the price request.","These services receive your IP address, the time and your browser type, as with any visit to a website. The requests contain no cookies, no referrer and nothing that you entered in the form. We do not receive any of this data. \xABAdd the full company name and address of each service, and the legal basis for any transfer outside the EU.\xBB","Legal basis: Art. 6 (1) (f) GDPR. Our legitimate interest is showing an up-to-date price, without which the results would be outdated."]},{h:"4. Your inputs, local storage and shared links",p:["All calculations take place in your browser. Your inputs are not sent to us or to anyone else.",'So that your inputs and your language choice are still there on your next visit, the page stores them in the local storage of your browser (keys "btc-loan-risk:form" and "btc-loan-risk:lang"). This data stays on your device. You can delete it at any time with the button "Start over and forget my inputs" or in your browser settings.','If you use "Copy link to this calculation", your inputs are written into the link after the "#" sign. Browsers do not send this part to any server, including GitHub. Whoever you give the link to can see your inputs.',"Legal basis: \xA7 25 (2) No. 2 TDDDG, because the storage is strictly necessary for the function you use. \xABCheck this assessment.\xBB"]},{h:"
