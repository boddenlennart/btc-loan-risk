levers:"Which terms mattered most?",offers:"Comparing offers fairly",goal:"By goal",today:"Today's market compared with history"},survival:{title:"Liquidated loans by starting LTV and duration",lead:"Of 100 start days, how many ended with the reference loan liquidated. Only the starting LTV and the duration change.",takeSome:"At a starting LTV of {ltv} or lower, no {months}-month loan was liquidated on any start day since 2014.",takeNone:"No starting LTV in this table survived every start day. Even at LTV 20%, {n} of 100 one-year loans were liquidated.",colLtv:"Starting LTV",months:"{n} months",unit:"Number = liquidated, of 100 start days. Darker = more often."},falls:{title:"The largest falls within 30 days to one year",lead:"From each day's opening price to the lowest hourly price within the window.",take:"Within one year, BTC fell by {q90} or more in 10 of 100 periods. The worst fall was {worst}, starting on {date}.",head:["Within","In half of the periods","In 10 of 100","In 5 of 100","Worst"],days:"{n} days",unit:"Read: in 10 of 100 periods of this length, BTC fell at least this far at some point.",bridge:"A loan is liquidated after a fall of 1 \u2212 starting LTV \xF7 liquidation LTV. Example: LTV 50% and liquidation at 80% give a fall of 37.5%."},speed:{title:"How fast a margin call turned into a liquidation",lead:"The reference loan with the margin call as a warning only: the time from the first margin call until the price reached the liquidation level.",take:"Of 100 margin calls, {a} were followed by the liquidation price within 24 hours.",head:["Liquidation price reached","Of 100 margin calls"],within:"within 24 hours",between:"{a} to {b} hours later",later:"later in the loan",never:"not before the loan ended",night:"{n} of 100 margin calls came at night or at the weekend (outside 8:00\u201320:00 on weekdays, Central European Time).",note:"Time to top up only helps if you can act before the price gets there."},levers:{title:"One change at a time",lead:"The reference loan was liquidated on {base} of 100 start days. Here it is with one term changed.",names:{lowerLtv:"Starting LTV 40% instead of 50%",higherLiq:"Liquidation LTV 90% instead of 80%",longerCure:"72 hours to top up instead of 48",warningOnly:"Margin call only a warning",reserve:"US$2,000 ready to add at a margin call",shorter:"6 months instead of 12"},base:"The reference loan as it is",unit:"Number = liquidated, of 100 start days.",note:"A higher liquidation LTV and a longer time to top up changed little here. After a margin call at 70%, the price had seldom recovered when that time ended, so the lender sold anyway."},reserve:{title:"How much extra BTC would have been enough",lead:"Extra BTC, as a share of the BTC pledged, that would have kept the LTV below the liquidation LTV (80%) for the whole year.",head:["Starting LTV","Enough on half of the start days","Enough on 90 of 100","Enough on 95 of 100","Worst start day"],take:"At a starting LTV of 50%, {q90} more BTC would have been enough on 90 of 100 start days. The worst start day needed {max} more.",note:"Pledged at the start, extra BTC lowers the starting LTV. Kept aside, it only helps if it can be added in time."},partial:{title:"Partial or full liquidation: the BTC you keep",lead:"On the {n} start days on which the reference loan was liquidated: how much of the pledged BTC was still yours at the end, after repaying the loan.",full:"Full liquidation: the lender sells everything",part:"Partial liquidation: the lender sells enough to return to LTV 50%",head:["Rule","BTC kept (middle value)"],take:"With partial liquidations, more BTC was left on {n} of 100 of these start days.",note:"A partial liquidation keeps the loan going, so a further fall can lead to another one."},cost:{title:"What liquidations cost since 2014",lead:"Interest and fees, plus the average loss of a liquidation times how often it happened. The loss: the BTC sold, valued at the end of the loan, minus the loan it repaid.",head:["Starting LTV","Interest and fees","Liquidated, of 100","Average loss if liquidated","Interest, fees and liquidations"],offer:"Offer",sameCost:"Interest and fees: {cost} in every row; only the starting LTV changes.",offersTitle:"Two offers for the same US$10,000 over 12 months",offerA:"A: 8% a year, LTV 60%",offerB:"B: 12% a year, LTV 40%",takeMore:"Offer A has the lower interest. Including the liquidations since 2014, it cost {a} against {b} for offer B.",takeLess:"Offer A has the lower interest, and including the liquidations since 2014 it also cost less: {a} against {b} for offer B.",note:"An average over start days, not a price you pay. A single liquidation can cost far more.",differs:`How this differs from "Cost including the liquidation risk" on the check: this table shows what liquidations really cost on prices since 2014. BTC's strong rise is included, so a missed recovery weighs heavily. The check prices protection against a liquidation over simulated futures, without any assumed trend. The two answer different questions, so their numbers differ.`},measure:{title:"Hourly lows or a smoother price",lead:"Lenders measure the BTC price differently. Here: the lowest price of every hour (as on the check) against the hourly closing price, a smoother stand-in for an averaged price index.",head:["Starting LTV","Hourly lows","Hourly closes"],take:"For these loans, the two prices gave almost the same result: at most {n} of 100 start days apart.",note:"The hourly low includes every short dip within the hour. A lender that averages over exchanges or minutes sees fewer of these dips."},buy:{title:"Buying more BTC with the loan",lead:"The loan buys BTC at the start and is repaid by selling BTC at the end. Of 100 start days, how many ended with more BTC than pledged.",take:"Over 12 months, {a} of 100 start days ended with more BTC at LTV 20%, and {b} at LTV 50%.",unit:"Number = more BTC at the end, of 100 start days. Liquidations included.",neededTitle:"The rise a loan needs, and how often it happened",neededHead:["Duration","Rise needed to pay off","BTC rose more, of 100 periods"],neededNote:"This table leaves liquidation out; the one above includes it."},spend:{title:"Borrowing instead of selling",lead:"You need US$10,000. Either sell BTC for it at the start, or borrow it and repay at the end by selling BTC. Of 100 start days, how often borrowing left more BTC.",head:["Starting LTV","No tax","Selling now taxed at 25%, later tax-free"],take:"Without tax, borrowing at LTV 30% left more BTC on {n} of 100 start days.",note:"Tax rules differ by country and person. The 25% is an example only."},entry:{title:"What BTC did before the start",lead:"The reference loan on every start day since 2014, grouped by BTC's move in the 90 days before the start.",take:"After BTC fell more than 10% in 90 days, the reference loan was liquidated on {fell} of 100 start days; after a doubling, on {doubled}; overall, on {all}.",note:"History, not a forecast: a few crashes and bull markets fill each row, and neighbouring start days share them. The check page shows this table for your own loan."},swings:{title:"Today's price swings compared with history",lead:"How much the BTC price moved in the last 30 days, in yearly terms, against every 30-day period since 2014.",take:"In the last 30 days, the price swung by {now} in yearly terms (volatility). Since 2014, {n} of 100 periods of 30 days were calmer.",range:"Half of all periods swung by less than {q50}. 10 of 100 swung by less than {q10}, and 10 of 100 by more than {q90}.",chartTitle:"30-day price swings since 2014, in yearly terms",now:"Dot: the last 30 days, {now}. Dashed lines: the halvings of 2016, 2020 and 2024, when the number of new BTC per block was cut in half.",halving:"Halving",vsSim:"For comparison: the simulation on the check assumes {sim} a year, more than today's swings. So it errs on the cautious side, also if calm ends.",note:"Not a forecast: calm periods can end quickly."}},method:{title:"How it works",metaTitle:"How it works \xB7 Bitcoin Loan Check",metaDescription:"How Bitcoin Loan Check computes the risk of a BTC-backed loan: the simulation step by step, which volatility it uses and why, the maths, and how to verify every number.",short:"The page builds 10,000 possible futures for the BTC price from real price moves since 2014, with recent years counting more. On each one, it applies your lender's rules. The number at the top counts in how many of 100 futures your loan is liquidated. Two other methods check it.",toc:"On this page",layers:{everyone:"For everyone",details:"The details",experts:"For experts"},oneTitle:"One simulated future, step by step",oneLead:"The example loan: {story} The price falls to the liquidation line after a fall of {drop}.",oneSteps:["Pick 30 real days. A random start day since 2014; the next 30 days are taken as they happened, each day's move and its lowest price. In this future, the first piece comes from {first}.","Join pieces. Thirteen pieces make a year. Crashes stay intact inside a piece, because bad days often follow bad days.","Check every day. Is the day's lowest price at or below your liquidation price? Is a margin call not fixed in time? In this future, the loan is liquidated on day {day}, {why}, in a piece from {crash}.","Repeat 10,000 times, each time with other pieces, and count."],oneWhy:{liquidationLtv:"when the price reached the liquidation price",cureExpired:"because a margin call was not fixed within {hours} hours",autoPartial:"after partial liquidations"},oneChartNote:"Amber line: margin call, in the example only a warning. Red line: liquidation, where the lender sells.",oneChartTitle:"One simulated future of the example loan, piece by piece",onePiece:"This piece: real days from {origin}",volTitle:"Which volatility, and why it matters",volLead:"The simulation does not use a volatility someone chose. It reuses real days, so it has the volatility of BTC's real history. But BTC has become calmer as its market grew:",volChartTitle:"Volatility per year (how much the price swings, in yearly terms)",volChartNote:"Darker bars count more in the simulation. A day from {h} years ago counts half as much as one from today.",volSim:"what the simulation uses: {vol}",volTip:"{year}: {vol} a year; {weight} of all draws",volTipSoFar:"{year} so far: {vol} a year; {weight} of all draws",volWhy:"Why recent years count more: as BTC's market grew, its swings shrank, from 80\u201390% a year in 2017\u20132021 to 42\u201352% since 2023. A larger market needs more money to move it by the same percentage. So recent years get more weight, while older crashes still count: 2014\u20132018 still make up {pre} of all draws.",volHead:["How the years count","Volatility used","Example loan: liquidated, of 100"],volRows:{equal:"All years equally",half:"Half-life {n} years",current:"(this page)",since2020:"Only 2020 onwards",since2022:"Only 2022 onwards"},volLimit:"Honest limit: the test against history cannot tell these weightings apart; all of them passed and stayed cautious. The weighting is a judgement, backed by the falling volatility. If BTC became as wild as in 2017 again, the true risk would be closer to the first row.",volStress:"Under the answer, the check also shows the same loan with calmer and wilder swings. It keeps the same real days and scales every move: to BTC's calmest 12 months so far ({calm}, up to {calmEnd}) or to 2017\u20132021 ({wild}). Scaling also makes the single worst days smaller or bigger in the same proportion.",numTitle:"From 10,000 futures to your number",num:["Counted: {k} of the {n} futures end with the example loan liquidated. That is {p} of 100, shown as {shown}. Each dot stands for 100 futures.","Precise to about \xB11: with {n} futures, the count lands within about {ci} points if it is repeated with other random draws.",'The same terms always give the same number, because the random draws are fixed. "Make it safer", the slider and the comparison of offers use the very same futures, so a difference comes only from the one change.',"Not a forecast: it says how often a loan like this failed in futures built from the past, not what will happen."],rulesTitle:"Your lender's rules in the simulation",exampleChanged:"Changed on 27 October 2026: the example's margin call is now only a warning, so a sale happens only at the liquidation LTV. Before, the lender sold everything if a margin call was not fixed within 48 hours; the example's number was higher then.",rulesChanged:"Changed on 27 October 2026: before, a sale was counted at exactly the liquidation price; now at the lowest price of that hour. The cost of the risk is now higher and the BTC kept after a sale lower; how often loans are liquidated hardly changed.",riskTitle:"The cost of the risk",riskWhat:"The check shows a cost including the liquidation risk: interest and fees plus the cost of the risk. That is what a liquidation takes from you by the end of the loan: the rise you miss on the BTC sold, and the BTC paid as the fee. If BTC falls further after the sale, the sale did no extra harm and counts as 0.",riskOneTitle:"One future, worked through",riskOne:"In one simulated future, the example loan is liquidated on day {day} at {price}. {repaid} BTC repaid the loan, {fee} BTC was the liquidation fee. At the end, BTC is at {end} (scaled, see below). Missed rise: {repaid} \xD7 ({end} \u2212 {price}) = {missed}. Liquidation fee: {fee} \xD7 {end} = {feeValue}. In this future: {total}.",riskOneFell:"In one simulated future, the example loan is liquidated on day {day} at {price}. {repaid} BTC repaid the loan, {fee} BTC was the liquidation fee. At the end, BTC is at {end} (scaled, see below), below the sale price, so no rise was missed. Liquidation fee: {fee} \xD7 {end} = {feeValue}. In this future: {total}.",riskAllTitle:"From 10,000 futures to the number",riskAll:"Each of the {n} futures gets its own cost, worked out as above. In {none} futures nothing is sold, so their cost is \u20AC0. In the other {sold}, it is {avgSold} on average: half of them cost less than {median}, one in ten more than {p90}. The cost of the risk is the average over all futures, those without a sale included as 0:",riskFormula:"Cost of the risk = sum of all {n} costs \xF7 {n} = ({none} \xD7 \u20AC0 + {sold} \xD7 {avgSold}) \xF7 {n} = {sumSold} \xF7 {n} = {risk}",riskFormula2:"The same with shares: share of futures with a sale \xD7 their average cost = {share} \xD7 {avgSold} = {risk}",riskAllEnd:'Precise to about \xB1{ci}. Added to interest and fees, it gives the cost including the liquidation risk: {total} instead of {cost}. The check page shows it rounded to \u20AC10, with "about".',riskScaleTitle:"Why the end prices are scaled",riskScale:"In the simulation, the middle price stays at today's level, but the average end price is {up} higher, because large rises pull it up. A fair price for protection needs an average equal to today's price, as in option pricing with an interest rate of 0. So every end price is multiplied by the same factor. The number then needs no guess about the price trend.",riskOptionTitle:"The option view",riskOption:"The cost of the risk is the price of an option that pays you back what a liquidation takes. It is a down-and-in barrier option on the BTC sold, with the strike at the sale price. A textbook formula exists for it.",riskHead:["Method","Cost of the risk, example loan"],riskRowFormula:"Textbook option formula: smooth prices, a constant volatility of {vol}, sold at the liquidation price",riskRowSim:"This page's simulation (the number on the check)",riskWhy:"The two differ because the simulation uses BTC's real moves, including crashes within a day, and the lender's rules as set. The formula knows neither.",riskReadTitle:"How to read it",riskRead:["An average, not a payment: no one charges it to you.","Zero in {none} of 100 futures; after a liquidation, far more than the average.","For comparing offers: lower interest with a higher liquidation chance can cost more in total."],riskLenderTitle:"Loans without a liquidation during the term",riskLender:"Some loans sell nothing during the term and settle only at the end. Where the lender cannot claim more than the BTC, a fall below the loan at the end is the lender's loss, not yours. A lender carrying that risk needs to be paid for it, for example through the rate or a lower LTV. This page does not put a number on the lender's side.",riskNot:"Not included: the lender failing or losing your BTC, taxes, and interest on money. The page uses an interest rate of 0; with 4%, the number would be about 5% lower.",rules:["Every simulated day, the day's lowest price is compared with your liquidation price. That price rises when unpaid interest is added to the debt.","A margin call is checked at the day's closing price. The time to top up counts in whole days and can be checked up to a day late (30 hours count as 2 days). If the lender sold everything when a margin call is not fixed within 1 day, the example would give {d1} of 100; within 2 days {d2}, within 3 days {d3}. With only a warning, as in the example: {none}.","When the price reaches the liquidation price, the sale is counted at the lowest price of that hour, never above the liquidation price. The simulated days keep their real hours for this.","In real liquidation hours since 2014, that price was {median} below the liquidation price in the middle case, and {p90} or more in 1 of 10. A lender selling within minutes often gets more.","Partial liquidations, fees and a cash reserve follow exactly the rules you set. The real-history method uses the same code, but checks every hour."],methodsTitle:"Three methods side by side",methodsIntro:"Every method can be wrong in its own way. So the page computes the same loan three ways, plus a textbook formula as a rough check.",methodsHead:["Method","What it assumes","Example loan"],methodsRows:{sim:["Simulation (the number at the top)","real days since 2014 in 30-day pieces, recent years weighted more, no trend"],garch:["Volatility model ([[garch]])","its estimate of today's volatility ({today} a year); wild days make more wild days likely; rare extreme days"],replay:["Real history","the loan started on every real day since 2014; includes BTC's rise since then"],barrier:["Textbook formula","calm, regular moves at {vol} a year; ignores margin calls"]},methodsWhy:"Why they differ: real history comes out lower because BTC rose strongly since 2014, which the simulation deliberately leaves out. The volatility model starts from today's market.",fanTitle:"Range of simulated prices",fanNote:"Each month: 9 of 10 simulated prices lie in the light band, half in the dark band; the line is the middle one. The bands show prices, not outcomes: a path that dips below the liquidation line and recovers still ended in a liquidation.",fanTip:{q95:"95 of 100 below",q75:"75 of 100 below",q50:"middle (half below)",q25:"25 of 100 below",q05:"5 of 100 below"},byMonthTitle:"Liquidated by the end of each month (of 100)",testTitle:"The test against history",test:'From 2016 on, each month, the method saw only the past and predicted the lowest price of the next 90 and 365 days. A fair method is breached about 5 times in 100 at its "worst 5%" level. Fewer breaches mean a cautious method.',testRow:"{model}, {days} days",testModels:{simulation:"Simulation",garch:"Volatility model"},testUnit:'Number = how often reality fell below the "worst 5%" level, of 100 forecasts (promised: 5). Euro history; US dollars are similar.',testStrength:"How strong this test is: the monthly forecasts overlap. The 90-day test holds about {n90} separate periods, the one-year test only about {n365}. It can catch a clearly optimistic method, but it cannot prove exact accuracy.",dataTitle:"Data and the weekly update",data:["Price data: hourly prices from the exchanges Bitstamp (USD since 2014, EUR since 2017) and Kraken (EUR 2014\u20132016), as published by the exchanges. Known gap: Bitstamp was offline from 5 to 9 January 2015.","Other currencies (CHF, GBP, CAD, AUD, CZK, PLN): the euro prices, converted hour by hour with the daily exchange rate of the European Central Bank. Compared with real exchange prices, half of all hours differ by 0.2% or less.","The simulation uses BTC's price in your loan's currency. The answer can therefore differ by about a point between currencies.","Current price: Bitstamp, the same exchange as the price history; only if it does not answer, Coinbase. Other currencies: the euro price \xD7 the latest ECB rate. The simulation and the real history use the price history up to the last weekly update, so the same terms give the same number all week.","Once a week, an automatic job adds the newest prices and exchange rates. It checks them first (gaps, impossible prices, sources that disagree) and stops if something looks wrong. All figures on this page are recomputed then."],measure:"Your lender decides which BTC price counts: one exchange, an average of several, or an average over some minutes. This page uses the lowest price of every hour on one exchange, which is cautious. How much a smoother price changes the result: {link}.",measureLink:"Insights: hourly lows or a smoother price",trendTitle:"Why no price trend is assumed",trend:`With BTC's past average growth built in, the test against history failed: the method became too optimistic. On the check page, "Does the price trend matter?" shows how much a trend would change your answer.`,limitsTitle:"What the model cannot do",limits:["It only knows price moves that happened since 2014. A crash of a new kind is not in it.","The weighting of recent years is a judgement. If BTC became as wild as in 2017 again, the true risk would be higher.","It steps day by day: the time to top up counts in whole days, and two dips on one day count as one.","It joins 30-day pieces at random, so longer rising or falling phases are mixed up. Crash clusters longer than 30 days are only partly kept; the volatility model shown next to it takes them into account.","It assumes no price trend. If BTC rises strongly, real outcomes are better; if it falls for years, they are worse."],mathsTitle:"The maths",mathsIntro:"For readers who want the exact definitions. All values are computed from the current data at every build.",mathsOpen:"Show the formulas",mathsData:"Data",mathsDataNote:"C: a day's closing price, L: the lowest hourly price of the day (UTC days).",mathsSim:"Simulation: weighted block bootstrap",mathsDays:"days per block",mathsLiquidated:"liquidated on day k (D: debt, B: BTC pledged)",mathsSimNote:"Margin calls, the time to top up, partial liquidations, fees and reserves follow the lender rules step by step. The random draws are fixed (seed 20240101), one stream per path.",mathsNoTrend:"(no trend; m: the log price's drift)",mathsGarch:"Volatility model: GARCH(1,1) with Student-t days",mathsUnitVar:"scaled to variance 1",mathsGarchValues:"Fitted by maximum likelihood on all days since 2014: \u03B1 = {alpha}, \u03B2 = {beta} (\u03B1 + \u03B2 = {persistence}), \u03BD = {nu}; today's volatility \u221A(365 \xB7 h) = {today} a year. The day's lowest price is drawn from a Brownian bridge.",mathsBarrier:"Textbook formula (geometric Brownian motion, no trend)",mathsRisk:"Cost of the risk",mathsRiskNote:"N futures i; per sale: b = BTC sold, P = sale price, k = share of the sale that repays debt (the rest is the fee). S\u0303 = end price scaled to an average of S\u2080. Textbook option: Reiner and Rubinstein (1991), a down-and-in call with the strike at the barrier.",mathsReplay:"Real history",mathsReplayNote:"The same loan, started at 00:00 UTC on every day since 2014. Every hour's lowest price is checked against the liquidation price, and the time to top up is counted in hours.",mathsCode:"The code",verifyTitle:"Verify it yourself",code:"All code, data and tests are open: {link}",verify:["An independent second version of the simulation, written in Python from the raw exchange data, agrees exactly with this page for 12 loans in euros and US dollars. The volatility model matches a standard statistics package. Details: the maths audit ({audit}).","The tests recompute 12 reference loans to 9 decimal places. They also check every rule of the lender model, and break the code on purpose to see that the tests notice.",`Check one number by hand: take the liquidation price from your answer and look up in the price data how often BTC fell that far within your loan's duration. That is roughly the "real history" number.`,"People working at lenders have commented on the method. No one has paid for or influenced the results."]},feedback:{intro:"Four short questions. Your answers go into an e-mail in your own mail app, and you decide whether to send it. Nothing is sent by this page.",use:"What will you mainly use the money for?",useOptions:{spend:"Spend it",compare:"Compare offers",buy:"Buy more BTC",curious:"Just curious"},meaning:"In one sentence: what does the big number at the top mean?",useful:"This page gives me what I need to decide.",easy:"This page is easy to use.",scaleLow:"not at all",scaleHigh:"fully",missing:"What was confusing, or what is missing? (optional)",language:"Which language would you prefer for this page? (optional)",languageMissing:"Your language is missing? Tell us.",languageSubject:"Language request for Bitcoin Loan Check",attach:"Attach my loan terms (no personal data)",write:"Write e-mail",copy:"Copy text",copied:"Copied. Send it to {email}.",subject:"Bitcoin Loan Check feedback"},compare:{add:"+ Compare an offer",addRefi:"+ Compare with a refinancing offer",addC:"+ Offer C",remove:"Remove {name}",endKeep:"End the comparison and keep:",keptNote:"{name} is now in your terms. The comparison has ended.",title:"Compare offers",titleRefi:"Current loan and refinancing",sameFutures:"same simulated futures for all",names:["Offer A","Offer B","Offer C"],current:"Current loan",refinanced:"Refinancing",nameLabel:"Name of this offer (stays in your browser)",rowLiq:"Liquidated, of 100",withinMonths:"within {months} months",nextMonths:"next {months} months, both",wholeTerm:"whole new term, {months} months",rowSold:"Liquidated at",rowCost:"Full cost",perYear:"effective {apr} a year",interestLeft:"interest, {months} months left",inclSwitching:"incl. switching costs, {months} months, effective {apr} a year",rowRisk:"Cost incl. liquidation risk",perYearAbout:"about {rate} a year",rowReceive:"You receive",rowReceiveNow:"At the start",nowGet:"you receive {amount}",nowPay:"you pay {amount}",nowBtc:"you get {btc} BTC back",rowMargin:"Margin call at",fixTerms:"fix the terms",noWinner:"No offer is marked as better: one can be safer, another cheaper. Tap a name to see that offer in full below.",diffAmount:"The offers lend different amounts.",diffMonths:"The offers run for different lengths; a longer loan has more time to be liquidated.",shorterRefi:"The new loan runs {m} months, {n} are left on the current one. Its liquidation number and its cost cover only these {m} months; after that, you would need a new loan again.",longerRefi:"The new loan runs {m} months, {n} are left on the current one. Its full cost covers all {m} months, the current loan's only {n}.",onlyMonths:"only its {months} months",showing:"Showing below: {name}. Everything under this line is about this offer.",startsFrom:"Starts from your current loan: you owe {owed} against {btc} BTC, {months} months left. Its LTV today: {ltv}.",whenRisen:"Possible when BTC has risen since you took the loan (so your LTV is lower now), and only up to your lender's maximum starting LTV.",atMargin:"the margin call at",atLiquidation:"the liquidation LTV of",limitBack:"The new LTV ({ltv}) would reach {limit}, so no loan can start like this. At today's price, at most {max} BTC can be taken back. Ask your lender for their maximum starting LTV.",limitBackNone:"The new LTV ({ltv}) would reach {limit}, so no loan can start like this. At today's price, no BTC can be taken back.",limitMore:"The new LTV ({ltv}) would reach {limit}, so no loan can start like this. At today's price, at most {max} more can be borrowed. Ask your lender for their maximum starting LTV.",limitMoreNone:"The new LTV ({ltv}) would reach {limit}, so no loan can start like this. At today's price, nothing more can be borrowed.",higherThanToday:"Starting LTV {ltv}, up from {today} today. Check that this is within your lender's maximum starting LTV.",extraPurpose:"What will you do with the extra cash?",copyHint:"The terms below start as a copy of your current loan. Replace them with the new offer's: interest rate, duration, liquidation LTV, margin call and fees.",newLoanLine:"New loan: {amount} against {btc} BTC, starting LTV {ltv}.",whatChanges:"What changes?",same:"Same amount",more:"Borrow more",back:"Take back BTC",extra:"Extra cash",backBtc:"BTC taken back",moreTerms:"More terms of the new loan",switching:"Switching costs",switchingSum:"{sum} so far",exitFee:"Fee for repaying the current loan early",transferFee:"Other costs of switching (transfer, network fees)"},share:{compare:"Loan offers compared, liquidated within the term, of 100: {list}.",refi:"Refinancing checked: next {months} months, liquidated, of 100: current loan {a}, refinancing {b}.",one:"Loan offer checked: {n} of 100 simulated futures end in liquidation within {months} months. Liquidation at {price} ({drop}). Full cost {cost}.",existing:"Loan checked: {n} of 100 simulated futures end in liquidation in the {months} months left. Liquidation at {price} ({drop})."},donate:{text:"This page is free and has no ads. If it helped you, you can support its upkeep with a Bitcoin donation.",copy:"Copy address",copied:"Address copied",public:"Donations on the Bitcoin network are public."},footer:{maker:"Independent project by {name} ({linkedin}). No lender pays for or influences this page.",license:'Open source under the MIT licence. Provided "as is", without warranty of any kind: use it at your own risk.',notAdvice:"This page is not financial, investment or tax advice. It is a calculator with a model of past price moves. It cannot know your situation or the future. Check every number against your lender's documents."},glossary:{title:"Glossary",terms:{ltv:{term:"LTV (loan-to-value)",text:"The loan divided by the value of the pledged BTC, in percent. Loan \u20AC10,000 and BTC worth \u20AC20,000 means an LTV of 50%. When the BTC price falls, the LTV rises."},marginCall:{term:"Margin call",text:"A warning from the lender that your LTV has risen to a set level. Depending on the lender, you must add BTC or repay part of the loan within some hours, or the lender sells part of your BTC."},liquidation:{term:"Liquidation",text:"The lender sells your pledged BTC to repay the loan, without asking you. It happens when the LTV reaches the liquidation level, or when a margin call is not fixed in time."},partialLiquidation:{term:"Partial liquidation",text:"The lender sells only part of your BTC, enough to bring the LTV back to a lower level. The loan continues, with less BTC behind it."},collateral:{term:"Collateral",text:"Something you give as security for a loan. Here: your BTC. You get it back when the loan is repaid."},curePeriod:{term:"Time to top up (cure period)",text:"The time you have after a margin call to add BTC or repay part of the loan. Contracts often call it the cure period."},originationFee:{term:"Origination fee",text:"A one-off fee for opening the loan. It can be taken from the money you receive."},aprVsRate:{term:"APR vs. interest rate",text:"The interest rate is the price of borrowing before fees. The effective APR adds fees and the timing of payments, as one yearly percentage."},compounding:{term:"Compounding",text:"Interest that is added to the debt also earns interest. The debt grows a little faster."},dayCount:{term:"Day count",text:"The rule for turning a yearly rate into interest for a period: each month as one twelfth of a year, or the actual days."},drawdown:{term:"Drawdown",text:"How far a price falls from an earlier high. From \u20AC60,000 down to \u20AC30,000 is a drawdown of 50%."},ohlc:{term:"OHLC (candle)",text:"Four prices for a period such as one hour: open, high, low, close. This page uses the low of every hour to check for sales."},priceIndex:{term:"Price index",text:"The price source a lender uses to value your BTC: one exchange, or an average of several. It decides when a margin call or sale happens."},counterpartyRisk:{term:"Counterparty risk",text:"The risk that the other side, here the lender, does not keep its promise, for example because it goes bankrupt."},rehypothecation:{term:"Rehypothecation",text:"The lender lends out or reuses the BTC you pledged. If the lender gets into trouble, your BTC may be gone."},simulatedFuture:{term:"Simulated future",text:'One possible path of the BTC price over your loan, built from real past price moves. Counting what happens in many of them gives a chance in "N of 100".'},blockBootstrap:{term:"Block bootstrap",text:"The method behind the simulated futures: pieces of real price history (30 days each) are picked at random and joined together."},garch:{term:"GARCH model",text:"A statistics model for prices in which wild days make further wild days more likely, and very large moves happen more often than in the textbook model."},historicalReplay:{term:"Historical replay",text:"The loan is started on every past day and checked against what the price really did afterwards."},riskCost:{term:"Cost of the risk",text:"What a liquidation takes from you by the end of the loan, on average over the simulated futures: the missed rise on the BTC sold, and the fee. An option price, not a fee."},priceTrend:{term:"Price trend",text:"An assumed yearly price change of the middle simulated future (compounded). It shifts all simulated futures up or down; the swings stay the same."}}},errors:{LOAN_AMOUNT_INVALID:{problem:"The loan amount must be a number above zero.",fix:"Enter the amount from your offer, for example 10000."},PRICE_INVALID:{problem:"The BTC price must be a number above zero.",fix:"Load the current price or type today's price."},LTV_OUT_OF_RANGE:{problem:"The starting LTV must be between 0% and 100%.",fix:"Enter the LTV from your offer, for example 50."},LIQ_LTV_NOT_ABOVE_INITIAL:{problem:"The liquidation LTV is not higher than the starting LTV. The loan would be liquidated at once.",fix:"Check both numbers. The liquidation LTV must be higher, for example 50% at the start and 80% for liquidation."},LIQ_LTV_TOO_HIGH:{problem:"The liquidation LTV must be a number up to 100%.",fix:"Enter the liquidation LTV from your offer, for example 80."},MARGIN_LTV_OUT_OF_RANGE:{problem:"The margin-call LTV must lie between the starting LTV and the liquidation LTV.",fix:"Check the number, or leave it empty if your offer has no margin call."},DURATION_INVALID:{problem:"The duration must be a whole number of months, at least 1.",fix:"Enter the months, for example 12 for one year."},NEGATIVE_RATE:{problem:"An interest rate cannot be negative here.",fix:"Enter the rate as a positive number, for example 10, or 0."},RATE_PATH_INVALID:{problem:"The rate changes are not in order, do not start at month 0, or go past the end of the loan.",fix:"Start with month 0, then add later months in increasing order, all before the end."},NEGATIVE_FEE:{problem:"A fee cannot be negative, and a percentage fee must be below 100%.",fix:"Enter the fee from your offer, or 0."},FEE_EXCEEDS_LOAN:{problem:"The origination fee is as large as the loan or larger.",fix:"Check whether the fee is a percentage or a fixed amount."},CURE_NEGATIVE:{problem:"The time to top up cannot be negative.",fix:"Enter the hours from your offer."},TAX_RATE_INVALID:{problem:"A tax rate must be between 0% and below 100%.",fix:"Enter a percentage such as 25, or 0."},RESERVE_NEGATIVE:{problem:"The amount kept ready cannot be negative.",fix:"Enter an amount, or 0."},CURE_TARGET_INVALID:{problem:"The LTV the lender brings you back to must be above 0% and below the margin-call LTV.",fix:"Leave it empty to use your starting LTV, or enter the number from your offer."},COLLATERAL_INVALID:{problem:"The amount of BTC pledged must be a number above zero.",fix:"Enter the BTC amount, for example 0.25."},COLLATERAL_TOO_LOW:{problem:"With this little BTC, the loan is larger than the value of the BTC (an LTV of 100% or more).",fix:"Check the BTC amount, the loan amount and the BTC price."},EXISTING_LOAN_AT_LIQUIDATION:{problem:"With these numbers, your LTV today is already at or above the liquidation LTV.",fix:"Check the amount owed, the BTC pledged and the BTC price. If they are right, contact your lender now."}},legal:{templateNote:"Template: some parts still have to be filled in.",impressumTitle:"Legal notice (Impressum)",impressum:["Information under \xA7 5 DDG (German Digital Services Act)","Lennart Bodden","c/o Online-Impressum 11950, Europaring 90, 53757 Sankt Augustin, Germany","E-mail: {email}","Contact form: {form}","Responsible for the content under \xA7 18 (2) MStV: Lennart Bodden, address as above",'This page ("Bitcoin Loan Check", bitcoinloancheck.com) is a free, private and independent project. It does not offer loans, does not arrange loans, and has no business relationship with any lender. It is not financial, investment or tax advice.',"Sources: BTC prices from Bitstamp and Kraken, exchange rates from the European Central Bank. The code is under the MIT licence; the embedded font Source Serif 4 under the SIL Open Font License."],privacyTitle:"Privacy notice",privacy:[{h:"1. Controller",p:["Responsible for data processing on this page: Lennart Bodden, c/o Online-Impressum 11950, Europaring 90, 53757 Sankt Augustin, Germany, e-mail: {email}.","No data protection officer is appointed, because there is no obligation to do so."]},{h:"2. In brief",p:["This page has no user accounts, sets no cookies and uses no analytics, tracking or advertising services. All calculations run in your browser; your inputs are not sent to anyone.","Personal data arise only because your browser contacts servers: the hosting service Cloudflare, which delivers the page, and a public price service for the current BTC price. Both see your IP address.","You are not obliged to provide any data. Without your IP address, however, the page cannot be delivered to you."]},{h:"3. Delivery of the page by Cloudflare",p:["The page is delivered through Cloudflare Pages, including name resolution (DNS) and a worldwide delivery network. The provider is Cloudflare, Inc., 101 Townsend St., San Francisco, CA 94107, USA.","When you open the page, Cloudflare processes the technical data that delivering any web page requires: your IP address, date and time, the address requested, your browser type and operating system. Cloudflare also uses these data to fend off attacks and may keep them in logs for a short time for that purpose.","We ourselves only see summary figures, for example the number of visits per day and country, no IP addresses.","Cloudflare processes the data on our behalf under its data processing agreement (Art. 28 GDPR). Cloudflare is certified under the EU-U.S. Data Privacy Framework, so an adequacy decision of the EU Commission applies to the USA (Art. 45 GDPR). The agreement also contains the EU standard contractual clauses.","Legal basis: Art. 6 (1) (f) GDPR. Our legitimate interest is a secure, fast and reliable delivery of the page. More information: https://www.cloudflare.com/privacypolicy/"]},{h:"4. Current BTC price",p:["So that the results use today's price, your browser asks Bitstamp (www.bitstamp.net) for the current BTC price when the page opens. Bitstamp has its European companies in Luxembourg.",'Only if Bitstamp does not answer, your browser asks Coinbase instead (api.coinbase.com, Coinbase, Inc., USA). Coinbase states that it is certified under the EU-U.S. Data Privacy Framework. Changing the currency or "Reload price" repeats the request.',"The price service receives your IP address, the time and your browser type, as with any visit to a web page. The requests contain no cookies, no referrer and nothing you entered. We receive none of these data. The price services are responsible for their own processing; details are in their privacy notices.","Legal basis: Art. 6 (1) (f) GDPR. Our legitimate interest is calculating with a current price; without it, the results would be out of date. You can enter your own price instead."]},{h:"5. Storage in your browser",p:["The page stores only on your device and only what the functions you use need. These data never leave your device.",`Your inputs are kept in this browser tab's storage (session storage), so that they survive a reload; closing the tab deletes them. Only if you tick "Remember my inputs in this browser for my next visit" are they kept in your browser's local storage, until you remove the tick.`,"If you choose a language or the light or dark mode, the page remembers that choice in local storage.",`"Start over and forget my inputs" removes all of these data; you can also delete them in your browser's settings.`,"Legal basis: \xA7 25 (2) No. 2 TDDDG, because the storage is strictly necessary for the function you explicitly asked for."]},{h:"6. Shared links",p:[`If you use "Share", your inputs are written into the link after the "#" sign. Browsers do not send this part to any server, not even to Cloudflare. Whoever receives the link from you can see your inputs. On a phone, "Share" opens your device's share menu; what happens next is decided by you and the app you choose.`]},{h:"7. Feedback and contact by e-mail",p:['"Help improve this page" and "Your language is missing?" prepare an e-mail in your own mail program. Nothing is sent unless you send it yourself. Your loan terms are attached only if you tick that box.',"If you send an e-mail, we receive your e-mail address and your message. The mailbox is run by Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Ireland. Google may also process the data in the USA.","Google LLC is certified under the EU-U.S. Data Privacy Framework, so an adequacy decision of the EU Commission applies to the USA (Art. 45 GDPR).","To sort and answer e-mails, we have new messages summarised once a day by the AI service Claude. Claude is provided by Anthropic Ireland, Limited, 6th Floor, South Bank House, Barrow Street, Dublin 4, D04 TR29, Ireland. Anthropic also processes the data in the USA, under EU standard contractual clauses (Art. 46 GDPR). Claude only reads: it sends, answers and deletes nothing. We have switched off the use of our conversations for training AI models.","We use your message only to read it, answer it and improve the page, and delete it once it is no longer needed for that, at the latest after twelve months. Legal basis: Art. 6 (1) (f) GDPR; our legitimate interest is answering you and improving the page."]},{h:"8. Donations in bitcoin",p:["If you donate to the address shown, the transfer is permanently visible to everyone on the Bitcoin network, like every bitcoin transaction. We collect no further data and do not try to link donations to people."]},{h:"9. Links to other sites",p:["Links to the source code and the licence lead to GitHub (GitHub, Inc., USA). Only when you open such a link does GitHub process data under its own privacy notice.","The links to LinkedIn and to the contact form of Online-Impressum also lead to other sites with their own privacy rules. Nothing from them loads until you click."]},{h:"10. Security",p:["The page is delivered only over an encrypted connection (HTTPS). It loads no scripts, fonts or styles from other servers, and a strict security rule allows only its own scripts."]},{h:"11. Your rights",p:["You have the right of access (Art. 15 GDPR), rectification (Art. 16), erasure (Art. 17), restriction of processing (Art. 18) and data portability (Art. 20).","You also have the right to object at any time, on grounds relating to your particular situation, to processing based on Art. 6 (1) (f) GDPR (Art. 21 GDPR). Write to {email}.","You can lodge a complaint with a data protection supervisory authority, in particular in the EU country where you live or work (Art. 77 GDPR).","There is no automated decision-making and no profiling."]},{h:"12. Version",p:["Version of this privacy notice: 27 October 2026. If the page changes, we update this notice. The German version is the original."]}],links:"Impressum \xB7 Privacy notice"}};var se={meta:{name:"Bitcoin-Kredit-Check",title:"Bitcoin-Kredit-Check: Liquidationsrisiko jedes BTC-Kredits",ogTitle:"Bitcoin-Kredit-Check: ein unabh\xE4ngiger Check f\xFCr jedes Bitcoin-Kreditangebot",description:"Wie wahrscheinlich wird ein Bitcoin-besicherter Kredit liquidiert, bei welchem Kurs, und was kostet er? Kostenlos, Open Source, im Browser.",ogFacts:"<b>Liquidationsrisiko</b>, <b>Liquidationskurs</b> und <b>Gesamtkosten</b>, gepr\xFCft an echten BTC-Kursen seit 2014. L\xE4uft in Ihrem Browser.",ogTrust:"Kostenlos \xB7 Open Source"},nav:{label:"Seiten",skip:"Zum Inhalt springen",check:"Kredit pr\xFCfen",insights:"Erkenntnisse",method:"So funktioniert es"},ui:{languageName:"Deutsch",languageSwitch:"Sprache",percentPoints:"Prozentpunkte",themeToLight:"Zum hellen Modus wechseln",themeToDark:"Zum dunklen Modus wechseln",headline:"Ein unabh\xE4ngiger Check f\xFCr jedes Bitcoin-Kreditangebot.",subhead:"Geben Sie die Bedingungen eines beliebigen Kreditgebers ein. Sehen Sie den Liquidationskurs, wie oft ein solcher Kredit seit 2014 liquidiert wurde, und die Gesamtkosten im Vergleich zum Verkauf.",trustBrowser:"L\xE4uft nur in Ihrem Browser",trustTracking:"Kein Tracking",trustCode:"Open Source",whereLink:"Wo Sie diese Zahlen finden",close:"Schlie\xDFen",more:"Mehr",newTab:" (\xF6ffnet in einem neuen Tab)",moreNumber:"Mehr zu dieser Zahl",computing:"Berechnung l\xE4uft\u2026 {pct} %",computingShort:"Die Antwort wird berechnet\u2026",fixErrors:"Einige Eingaben m\xFCssen kor  einem BTC-Kurs von 31.250 \u20AC.",repayment:"Werden Zinsen zum Kredit addiert, w\xE4chst Ihre Schuld jeden Monat, und damit auch der Liquidationskurs. Beispiel: 10.000 \u20AC zu 10 % f\xFCr ein Jahr. Monatlich gezahlt, schulden Sie das ganze Jahr 10.000 \u20AC. Zum Kredit addiert, schulden Sie am Ende etwa 11.000 \u20AC, und der Liquidationskurs steigt um etwa 10 %.",marginCall:"Ein [[marginCall]] kommt vor einer Liquidation: Ihr LTV ist auf eine Warnstufe gestiegen. Was dann passiert, h\xE4ngt vom Kreditgeber ab. Es kann nur eine Warnung sein. Sie haben vielleicht einige Stunden, um BTC nachzuschie\xDFen oder einen Teil zur\xFCckzuzahlen, sonst verkauft der Kreditgeber alles oder so viel wie n\xF6tig. Oder der Kreditgeber verkauft sofort einen Teil Ihrer BTC. Beispiel: Margin Call bei 70 % mit 48 Stunden Frist: Liegt der LTV nach 48 Stunden noch bei 70 %, verkauft der Kreditgeber."}},where:{title:"Wo Sie diese Zahlen finden",intro:"Ihr Angebot oder Kreditvertrag enth\xE4lt f\xFCnf Zahlen, die diese Seite braucht. Suchen Sie nach diesen W\xF6rtern:",items:[{field:"Kreditbetrag",words:'"Darlehensbetrag", "Kreditbetrag", "principal", "loan amount"'},{field:"Start-LTV",words:'"LTV", "Beleihungsquote", "Loan-to-Value". Steht nur die Sicherheitsmenge da: Kredit \xF7 Wert der Sicherheit'},{field:"Liquidations-LTV",words:'"Liquidation", "Verwertung", der Abschnitt zum Verkauf oder zur Verwertung der Sicherheit'},{field:"Laufzeit",words:'"Laufzeit", "F\xE4lligkeit", "term", "maturity"'},{field:"Zinssatz",words:'"Sollzins", "Nominalzins", "Zinssatz", "interest rate". Nicht den Effektivzins: den berechnet die Seite selbst'}],others:'Die \xFCbrigen Bedingungen stehen in Abschnitten wie "Geb\xFChren", "\xDCberwachung der Sicherheit" oder "Margin Call". Die Seite f\xFCllt sie mit Startwerten, die Sie unter "Weitere Bedingungen aus Ihrem Angebot" \xE4ndern k\xF6nnen.'},results:{title:"Ihr Ergebnis",heroOf:"von 100",heroLiq:"simulierten Zuk\xFCnften enden mit der Liquidation die uidiert \xB7 {btc} hinterlegt",sliderRefi:"Bei einer Umschuldung hei\xDFt ein niedrigerer LTV: weniger leihen oder weniger BTC zur\xFCcknehmen. Das \xE4ndern Sie in Ihren Bedingungen unter \u201EWas \xE4ndert sich?\u201C.",sliderExisting:"Ziehen Sie, um einen niedrigeren LTV zu testen: BTC nachschie\xDFen oder einen Teil zur\xFCckzahlen. Loslassen \xFCbernimmt den Wert.",sliderNote:"Ziehen Sie, um einen niedrigeren LTV zu testen: weniger leihen oder mehr BTC hinterlegen. Loslassen \xFCbernimmt den Wert.",otherOptions:"Weitere M\xF6glichkeiten (liquidiert, von 100):",yourTerms:"Ihre Bedingungen, wie sie sind",levers:{lowerLtv:"Start-LTV {value}",shorter:"{value} statt {months} Monate",lowerLtvExisting:"LTV {value} (BTC nachschie\xDFen oder einen Teil zur\xFCckzahlen)",shorterExisting:"Nach {value} statt {months} Monaten zur\xFCckzahlen",reserve:"{value} f\xFCr einen Margin Call bereithalten",warningOnly:"Margin Call nur als Warnung",higherLiq:"Liquidations-LTV {value}, \xFCbrige Regeln gleich",higherLiqWarning:"Liquidations-LTV {value} und Margin Call nur als Warnung",monthlyInterest:"Zinsen monatlich zahlen statt addieren"},higherLiqNote:"Ein h\xF6herer Liquidations-LTV hilft nur, wenn die Margin-Call-Regeln nicht vorher verkaufen. Fragen Sie Ihren Kreditgeber, was nach einem Margin Call passiert."},sections:{falls:"Was passiert, wenn BTC f\xE4llt",cost:"Was es kostet",borrowOrSell:"Leihen oder verkaufen?",leverage:"Lohnt sich der Hebel?",history:"Ihr Kredit in der echten Vergangenheit",feedback:"Helfen Sie, diese Seite zu verbessern"},falls:{ladderToday:"Heute",ladderMargin:"Margin Call",ladderSale:"Liquidation",marginNow:"Ihr Kredit liegt bereits \xFCber dem Margin Call: Zum heutigen Kurs w\xFCrde {topUp} BTC nachschie\xDFen (\u2248 {topUpValue}) oder {repay} zur\xFCckzahlen den LTV wieder auf {target} bringen.",marginWarning:"Bei {mcPrice} (Margin Call): Sie erhalten eine Warnung. {topUp} BTC nachschie\xDFen (\u2248 {topUpValue}) oder {repay} zur\xFCckzahlen w\xFCrde den LTV wieder auf {target} bringen.",marginCure:"Bei {mcPrice} (Margin Call): Sie haben {hours} Stunden, um {topUp} BTC nachzuschie\xDFen (\u2248 {topUpValue}) oder {repay} zur\xFCckzuzahlen. Sonst verkauft der Kreditgeber {what}.",marginAuto:"Bei {mcPrice} (Margin Call): Der Kreditgeber verkauft sofort mindestens {sold} BTC, um den LTV wieder auf {target} zu bringen. Sie behalten h\xF6chstens {left} Ihrer {btc} BTC, und der Kredit l\xE4uft weiter.",whatAll:"alles",whatPartial:"mindestens {sold} BTC, so viele, dass {target} erreicht wird",liquidationAll:"Bei {price} (Liquidation): Der Kreditgeber verkauft mindestens {sold} BTC, inklusive Geb\xFChr, und der Kredit endet.",liquidationPartial:"Bei {price} (Liquidation): Der Kreditgeber verkauft mindestens {sold} BTC, so viele, dass der LTV wieder bei {target} liegt. Sie behalten h\xF6chstens {left} Ihrer {btc} BTC, und der Kredit l\xE4uft weiter.",fastFall:"F\xE4llt BTC durch diesen Kurs, z\xE4hlt diese Seite den Verkauf zum tiefsten Kurs der Stunde, in der er erreicht wird.",futuresTitle:"20 m\xF6gliche Zuk\xFCnfte",futuresLine:"Jede Linie ist ein m\xF6glicher Verlauf des BTC-Kurses w\xE4hrend Ihres Kredits, gebaut aus echten 30-Tage-Abschnitten der BTC-Vergangenheit, zuf\xE4llig aneinandergereiht. \u2715 = Liquidation. {k} dieser 20 enden mit einer Liquidation.",futuresHelp:"Die Simulation nimmt die echten t\xE4glichen Kursbewegungen von BTC seit 2014, schneidet sie in 30-Tage-St\xFCcke und reiht zuf\xE4llig gew\xE4hlte St\xFCcke zu einem neuen Verlauf \xFCber die L\xE4nge Ihres Kredits aneinander. Jeder Verlauf beh\xE4lt die echte Mischung aus ruhigen und wilden Wochen. Beispiel: Ein Verlauf kann mit einem Abschnitt aus dem Mai 2021 beginnen (ein Einbruch um 50 %), gefolgt von einem aus Ende 2023 (ein stetiger Anstieg).",futuresMarginNote:"Manche \u2715 liegen \xFCber der roten Linie: Dort wurde ein Margin Call (gelbe Linie) nicht rechtzeitig behoben, oder der Kreditgeber hat einen Teil der BTC verkauft.",showOthers:"Die n\xE4chsten 20 Zuk\xFCnfte zeigen (Satz {n} von {sets})",futuresPicked:"Die 100 Zuk\xFCnfte der f\xFCnf S\xE4tze sind zuf\xE4llig aus allen simulierten Zuk\xFCnften gew\xE4hlt, so dass {n} davon mit einer Liquidation enden, wie in der Antwort.",questionsTitleExisting:"{n} Fragen an Ihren Kreditgeber",questionsTitle:"Vor der Unterschrift: {n} Fragen an Ihren Kreditgeber",questionsPreview:"Was nach einem Margin Call passiert, welcher Kurs z\xE4hlt, wer Ihre BTC verwahrt \u2026",questions:["Bei welchem LTV verkaufen Sie meine BTC?","Was genau passiert nach einem Margin Call? Nur eine Warnung oder ein Verkauf nach einer Anzahl Stunden? Alles oder nur ein Teil?","Welchen BTC-Kurs nutzen Sie: eine B\xF6rse, einen Durchschnitt, \xFCber welchen Zeitraum?","Verkaufen Sie alle meine BTC oder nur so viel wie n\xF6tig?","Was kostet eine Liquidation?","Wer verwahrt meine BTC? Werden sie getrennt aufbewahrt? Werden sie weiterverliehen?","Wenn ich den Kreditgeber wechsle: Wie wird mein bisheriger Kredit abgel\xF6st, und wie lange sind meine BTC unterwegs?","Kostet eine vorzeitige R\xFCckzahlung eine Geb\xFChr?"]},cost:{line:"Sie erhalten {received} und zahlen {payback} zur\xFCck. Der Kredit kostet {cost}, wenn nichts schiefgeht ({apr} pro Jahr inklusive Geb\xFChren).",lineRefi:"Vom neuen Kredit \xFCber {amount} zahlen {owed} Ihren bisherigen Kredit zur\xFCck. Zu Beginn: {now}. Sie zahlen insgesamt {payback} zur\xFCck. Der neue Kredit kostet {cost}, wenn nichts schiefgeht, inklusive Wechselkosten ({apr} pro Jahr).",riskTitle:"Kosten inklusive Liquidationsrisiko",riskLine:"Inklusive Liquidationsrisiko: etwa {total} (etwa {rate} pro Jahr statt {apr}).",riskLineExisting:"Inklusive Liquidationsrisiko: etwa {total} f\xFCr die verbleibenden {months} Monate, statt {interest} Zinsen.",riskPart:"Davon sind {risk} die Kosten des Risikos: was ein voller Schutz gegen eine Liquidation in den simulierten Zuk\xFCnften im Durchschnitt kosten w\xFCrde.",riskFastFall:"Jeder Zwangsverkauf z\xE4hlt zum tiefsten Kurs der Stunde, in der BTC Ihren Liquidationskurs erreicht: bei einem schnellen Einbruch darunter.",riskNotFee:"Diese Kosten stellt Ihnen niemand in Rechnung. In {none} von 100 Zuk\xFCnften sind sie null; nach einer Liquidation weit h\xF6her.",riskCompare:"Nutzen Sie die Zahl zum Vergleich von Angeboten: Ein niedrigerer Zins mit h\xF6herer Liquidationswahrscheinlichkeit kann insgesamt mehr kosten.",riskLink:"So entsteht diese Zahl \u2192",lineExisting:"Sie zahlen ab heute insgesamt {payback} zur\xFCck, davon {interest} Zinsen.",timingNote:"Der Jahreszins inklusive Geb\xFChren ber\xFCcksichtigt, wann Sie zahlen: Derselbe Gesamtbetrag, fr\xFCher gezahlt, zum Beispiel Zinsen jeden Monat statt am Ende, ergibt einen h\xF6heren Zins.",schedule:"Monatlichen Zahlungsplan anzeigen",scheduleHead:["Monat","Datum","Zinsen","Tilgung","Zahlung","Restschuld danach"],sellIntroRefi:"Den Kredit zu behalten schl\xE4gt den Verkauf von BTC heute zur R\xFCckzahlung nur, wenn BTC genug steigt. Wechselkosten sind eingerechnet. Angenommen, Sie zahlen am Ende durch einen BTC-Verkauf zur\xFCck:",sellIntroExisting:"Den Kredit zu behalten schl\xE4gt den Verkauf von BTC heute zur R\xFCckzahlung nur, wenn BTC genug steigt. Angenommen, Sie zahlen am Ende durch einen BTC-Verkauf zur\xFCck:",sellIntro:"Leihen schl\xE4gt den Verkauf von BTC heute nur, wenn BTC genug steigt. Angenommen, Sie zahlen am Ende durch einen BTC-Verkauf zur\xFCck:",breakevenFall:"BTC darf am Ende bis zu {fall} tiefer stehen, weil ein Verkauf heute h\xF6her besteuert wird. Der Kredit darf unterwegs nicht liquidiert werden.",breakeven:"BTC muss am Ende mindestens {rise} h\xF6her stehen, und der Kredit darf unterwegs nicht liquidiert werden.",taxNow:"Steuer bei BTC-Verkauf heute",taxLater:"Steuer bei Verkauf am Ende",taxNote:"Geben Sie Ihre eigenen Steuers\xE4tze ein (0, wenn keine). Die Regeln h\xE4ngen von Land und Haltedauer ab; fragen Sie eine Steuerberatung. Auch eine Liquidation ist ein Verkauf und kann besteuert werden.",levIntro:"Mit {received} kaufen Sie heute {bought} BTC.",levIntroRefi:"Mit den zus\xE4tzlichen {received} kaufen Sie heute {bought} BTC. Verglichen wird unten mit derselben Umschuldung ohne das zus\xE4tzliche Geld.",levHeadlineRefi:"In {more} von 100 Zuk\xFCnften haben Sie am Ende mehr BTC als ohne das zus\xE4tzliche Geld. In {less} von 100 weniger (davon {liq} liquidiert).",levSizesRefi:"Wie viel, als mittlerer Wert jeder Gruppe, in BTC verglichen damit, das zus\xE4tzliche Geld nicht zu leihen: mehr BTC {more}, weniger, aber nicht liquidiert {less}, liquidiert {liq}.",levHeadline:"In {more} von 100 Zuk\xFCnften haben Sie am Ende mehr BTC als ohne Kredit. In {less} von 100 weniger ({liq} davon liquidiert).",levSizes:"Wie viel, als mittlerer Wert jeder Gruppe, in BTC gegen\xFCber ohne Kredit: mehr BTC {more}, weniger, nicht liquidiert {less}, liquidiert {liq}.",levLegendMore:"mehr BTC",levLegendLess:"weniger, nicht liquidiert",levLegendLiq:"liquidiert",levLiquidated:"Bei einer Liquidation haben Sie am Ende h\xF6chstens {end} BTC statt {start} BTC, obwohl Sie mehr gekauft haben. Bei einem schnellen Einbruch weniger.",levBreakeven:"Gewinnschwelle: BTC muss am Ende {rise} h\xF6her stehen, ohne Liquidation unterwegs.",levCash:"R\xFCckzahlung mit neuem Geld: Sie behalten die gekauften BTC, sofern der Kredit nicht liquidiert wird, und zahlen {payback} aus anderem Geld.",levTrendTitle:"Spielt der Kurstrend hier eine Rolle?",levTrendUnit:"Zahl = Zuk\xFCnfte von 100, in denen Sie am Ende mehr BTC haben als ohne Kredit."},history:{replayNone:"Dieser Kredit ist l\xE4nger als die echten Kurse seit 2014, daher l\xE4sst er sich nicht darauf nachspielen. Die Simulation oben deckt ihn trotzdem ab.",replayFew:"Bei einem so langen Kredit lassen nur Starttage bis {last} genug echte Kurse \xFCbrig, daher beruht diese Zahl auf wenigen getrennten Zeitr\xE4umen.",storiesNone:"Bei einem so langen Kredit l\xE4sst sich keines dieser echten Jahre mit den Kursen seit 2014 bis zum Ende verfolgen.",storiesTitle:"Wenn eines dieser echten Jahre heute beg\xE4nne",storiesLine:"Ihr Kredit, mit echten BTC-Kursen ab diesen Starttagen, skaliert auf den heutigen Kurs. \u2715 = Liquidation. Gestrichelt = was danach geschah.",sold:"{date}: nach {days} Tagen liquidiert. Ein Jahr sp\xE4ter stand BTC beim {end}-fachen des Starts.",partial:"{date}: nach {days} Tagen teilweise liquidiert; Sie behalten {left} Ihrer BTC.",survived:"{date}: keine Liquidation. Ein Jahr sp\xE4ter stand BTC beim {end}-fachen des Starts.",byMonth:"Mehr als die H\xE4lfte aller Liquidationen in der Simulation passiert in den ersten {months} Monaten.",trendTitle:"Spielt der Kurstrend eine Rolle?",trendIntro:"Niemand wei\xDF, wohin sich BTC bewegt. Hier ist Ihr Kredit mit f\xFCnf verschiedenen j\xE4hrlichen Werten f\xFCr den [[priceTrend]]. Die Schwankungen bleiben wie in der Vergangenheit.",trendRow:"{trend} pro Jahr",trendNone:"Kein Trend (die Antwort oben)",trendUnit:"Zahl = Zuk\xFCnfte von 100, in denen der Kredit liquidiert wird.",trendConclusion:"Ein steigender Kurs senkt das Risiko, aber selbst bei {topTrend} pro Jahr enden noch {top} von 100 Zuk\xFCnften mit einer Liquidation.",bridgeLower:"Die Antwort oben nennt {n}: Die Simulation beh\xE4lt die Schwankungen von BTC, l\xE4sst aber seinen Anstieg seit 2014 weg, weil niemand wei\xDF, ob er sich fortsetzt.",sum:"An Starttagen seit 2014 {a}-mal von 100 liquidiert \xB7 seit 2020 {b}",sumOnly:"An Starttagen seit 2014 {a}-mal von 100 liquidiert",sumNone:"L\xE4nger, als die echten Kurse seit 2014 erlauben",years:{title:"Dieser Kredit, gestartet an jedem Tag ab \u2026",head:["Starttage ab","Starttage","Liquidiert, von 100"],headPartly:"Teilweise, von 100",all:"{date} (alle)",note:"Jede Zeile z\xE4hlt jeden Starttag ab diesem Datum bis zum letzten mit genug Kursen. Sp\xE4tere Zeilen haben weniger Starttage und weniger Einbr\xFCche hinter sich. Vergangenheit, keine Vorhersage."},bridgeOther:"Die Antwort oben nennt {n}. Vergangenheit und Simulation m\xFCssen nicht \xFCbereinstimmen: siehe \u201ESo funktioniert es\u201C (Link oben).",trendUncertainty:"Seit 2014 wuchs BTC um etwa {estimate} pro Jahr. Die Schwankungen sind aber so gro\xDF, dass dieser Wert nur irgendwo zwischen {low} und {high} liegt. Der fr\xFChere Trend ist zu unsicher, um darauf zu bauen.",trendPast:"Das j\xE4hrliche Wachstum von BTC (mit Zinseszinseffekt) \xFCber 4-Jahres-Zeitr\xE4ume seit 2014 lag zwischen {worst} (schw\xE4chster) und {best} (st\xE4rkster), mittlerer Wert {median}. Es hat mit der Zeit abgenommen: {firstFrom}\u2013{firstTo} {firstRate} pro Jahr, {lastFrom}\u2013{lastTo} {lastRate} pro Jahr.",entry:{title:"Ihr Kredit, nach dem, was BTC in den 90 Tagen vor dem Start tat",head:["BTC in den 90 Tagen vor dem Start","Starttage","Liquidiert, von 100"],headPartly:"Teilweise, von 100",rows:{fell:"Mehr als 10 % gefallen",flat:"Etwa gleich (\u221210 % bis +10 %)",rose:"10\u201350 % gestiegen",roseStrongly:"50\u2013100 % gestiegen",doubled:"Mehr als verdoppelt",early:"Erste 90 Tage der Daten (keine fr\xFCheren Kurse)"},total:"Alle Starttage",note:"Vergangenheit, keine Vorhersage. Benachbarte Starttage teilen dieselben Einbr\xFCche, jede Zeile beruht also auf wenigen getrennten Zeitr\xE4umen.",link:"Hintergrund unter Erkenntnisse"},trendSwings:"In {deep} von {years} Kalenderjahren seit 2014 fiel BTC innerhalb desselben Jahres um mindestens 50 % von einem Hoch. Ein Kredit muss diese Einbr\xFCche \xFCberstehen, egal wohin der langfristige Weg f\xFChrt."},insights:{title:"Erkenntnisse",metaTitle:"Erkenntnisse \xB7 Bitcoin-Kredit-Check",metaDescription:"Was mit Bitcoin-gedeckten Krediten seit 2014 geschah: wie viel Puffer sie brauchten, welche Bedingungen am meisten z\xE4hlten und wie schnell BTC-Einbr\xFCche verliefen. Keine Prognose, keine Beratung.",intro:'Was mit BTC-gedeckten Krediten seit 2014 geschah, gemessen an echten st\xFCndlichen Kursen. Keine Prognose und keine Beratung: Es zeigt, was geschah, nie, was "am besten" ist.',basis:"Gemessen an echten st\xFCndlichen BTC-Kursen in US-Dollar vom {from} bis {to}, mit einem Kredit, der an jedem Tag startet. Jede Woche aktualisiert.",reference:"Der Referenzkredit, wenn eine Tabelle nicht eine Bedingung \xE4ndert: {story}",story:"10.000 $ f\xFCr 12 Monate zu 10 % pro Jahr (1 % Geb\xFChr), Start-LTV 50 %, Margin Call bei 70 % mit 48 Stunden zum Nachschie\xDFen, Liquidation bei 80 %.",overlap:"Nahe beieinanderliegende Starttage teilen sich dieselben Einbr\xFCche. Die Zahlen beruhen also auf weniger getrennten Ereignissen, als ihre Gr\xF6\xDFe vermuten l\xE4sst.",toc:"Auf dieser Seite",toCheck:"Eigene Bedingungen pr\xFCfen \u2192",groups:{buffer:"Wie viel Puffer brauchte ein Kredit?",levers:"Welche Bedingungen z\xE4hlten am meisten?",offers:"Angebote fair vergleichen",goal:"Nach Ziel",today:"Der heutige Markt im Vergleich zur Vergangenheit"},survival:{title:"Liquidierte Kredite nach Start-LTV und Laufzeit",lead:"Von 100 Starttagen: wie viele mit liquidiertem Referenzkredit endeten. Nur Start-LTV und Laufzeit \xE4ndern sich.",takeSome:"Bei einem Start-LTV von {ltv} oder weniger wurde seit 2014 an keinem Starttag ein Kredit \xFCber {months} Monate liquidiert.",takeNone:"Kein Start-LTV in dieser Tabelle \xFCberstand jeden Starttag. Selbst bei LTV 20 % wurden {n} von 100 Kredite \xFCber ein Jahr liquidiert.",colLtv:"Start-LTV",months:"{n} Monate",unit:"Zahl = liquidiert, von 100 Starttagen. Dunkler = h\xE4ufiger."},falls:{title:"Die gr\xF6\xDFten R\xFCckg\xE4nge innerhalb von 30 Tagen bis einem Jahr",lead:"Vom Er\xF6ffnungskurs jedes Tages bis zum tiefsten Stundenkurs innerhalb des Zeitraums.",take:"Innerhalb eines Jahres fiel BTC in 10 von 100 Zeitr\xE4umen um {q90} oder mehr. Der schlimmste R\xFCckgang betrug {worst}, ab dem {date}.",head:["Inner\xADhalb","In der H\xE4lfte der Zeit\xADr\xE4ume","In 10 von 100","In 5 von 100","Schlimms\xADter"],days:"{n} Tage",unit:"Lesart: In 10 von 100 Zeitr\xE4umen dieser L\xE4nge fiel BTC zwischendurc
