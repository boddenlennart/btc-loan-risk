00","Schlimms\xADter Start\xADtag"],take:"Bei einem Start-LTV von 50 % h\xE4tten an 90 von 100 Starttagen {q90} mehr BTC gereicht. Der schlimmste Starttag brauchte {max} mehr.",note:"Zu Beginn hinterlegt, senken zus\xE4tzliche BTC den Start-LTV. Beiseitegelegt helfen sie nur, wenn sie rechtzeitig nachgeschossen werden."},partial:{title:"Teil- oder Komplettliquidation: die BTC, die Ihnen bleiben",lead:"An den {n} Starttagen, an denen der Referenzkredit liquidiert wurde: wie viel der hinterlegten BTC am Ende noch Ihnen geh\xF6rte, nach Tilgung des Kredits.",full:"Komplettliquidation: Der Kreditgeber verkauft alles",part:"Teilliquidation: Der Kreditgeber verkauft so viel, dass der LTV wieder 50 % betr\xE4gt",head:["Regel","Verbliebene BTC (mittlerer Wert)"],take:"Mit Teilliquidationen blieben an {n} von 100 dieser Starttage mehr BTC \xFCbrig.",note:"Eine Teilliquidation h\xE4lt den Kredit am Laufen, ein weiterer R\xFCckgang kann also zu einer weiteren f\xFChren."},cost:{title:"Was Liquidationen seit 2014 gekostet haben",lead:"Zinsen und Geb\xFChren, plus der durchschnittliche Verlust einer Liquidation mal ihrer H\xE4ufigkeit. Der Verlust: die verkauften BTC, bewertet am Laufzeitende, minus den Kredit, den sie tilgten.",head:["Start-LTV","Zinsen und Geb\xFChren","Liqui\xADdiert, von 100","Durch\xADschnitt\xADlicher Verlust bei Liqui\xADdation","Zinsen, Geb\xFChren und Liqui\xADda\xADtionen"],offer:"Angebot",sameCost:"Zinsen und Geb\xFChren: {cost} in jeder Zeile; nur der Start-LTV \xE4ndert sich.",offersTitle:"Zwei Angebote f\xFCr dieselben 10.000 $ \xFCber 12 Monate",offerA:"A: 8 % pro Jahr, LTV 60 %",offerB:"B: 12 % pro Jahr, LTV 40 %",takeMore:"Angebot A hat die niedrigeren Zinsen. Einschlie\xDFlich der Liquidationen seit 2014 kostete es {a}, Angebot B {b}.",takeLess:"Angebot A hat die niedrigeren Zinsen und kostete auch einschlie\xDFlich der Liquidationen seit 2014 weniger: {a} gegen\xFCber {b} f\xFCr Angebot B.",note:"Ein Durchschnitt \xFCber Starttage, kein Preis, den Sie zahlen. Eine einzelne Liquidation kann viel mehr kosten.",differs:"Der Unterschied zu \u201EKosten inklusive Liquidationsrisiko\u201C im Check: Diese Tabelle zeigt, was Liquidationen mit den Kursen seit 2014 wirklich gekostet haben. Der starke Anstieg von BTC ist enthalten, daher wiegt eine verpasste Erholung schwer. Der Check bepreist den Schutz gegen eine Liquidation \xFCber simulierte Zuk\xFCnfte, ohne angenommenen Trend. Beide beantworten verschiedene Fragen, daher unterscheiden sich die Zahlen."},measure:{title:"St\xFCndliche Tiefstkurse oder ein glatterer Kurs",lead:"Kreditgeber messen den BTC-Kurs unterschiedlich. Hier: der tiefste Kurs jeder Stunde (wie bei der Pr\xFCfung) gegen\xFCber dem st\xFCndlichen Schlusskurs, einem glatteren Ersatz f\xFCr einen gemittelten Preisindex.",head:["Start-LTV","St\xFCndliche Tiefstkurse","St\xFCndliche Schlusskurse"],take:"F\xFCr diese Kredite ergaben beide Kurse fast dasselbe: h\xF6chstens {n} von 100 Starttagen Unterschied.",note:"Der st\xFCndliche Tiefstkurs enth\xE4lt jeden kurzen Einbruch innerhalb der Stunde. Ein Kreditgeber, der \xFCber B\xF6rsen oder Minuten mittelt, sieht weniger dieser Einbr\xFCche."},buy:{title:"Mit dem Kredit mehr BTC kaufen",lead:"Der Kredit kauft zu Beginn BTC und wird am Ende durch einen BTC-Verkauf getilgt. Von 100 Starttagen: wie viele mit mehr BTC endeten als hinterlegt.",take:"\xDCber 12 Monate endeten bei LTV 20 % {a} von 100 Starttagen mit mehr BTC, bei LTV 50 % {b}.",unit:"Zahl = am Ende mehr BTC, von 100 Starttagen. Liquidationen eingerechnet.",neededTitle:"Der n\xF6tige Anstieg und wie oft er eintrat",neededHead:["Laufzeit","N\xF6tiger Anstieg","BTC stieg st\xE4rker, von 100 Zeitr\xE4umen"],neededNote:"Diese Tabelle l\xE4sst Liquidationen au\xDFen vor; die obere rechnet sie ein."},spend:{title:"Leihen statt verkaufen",lead:"Sie brauchen 10.000 $. Entweder verkaufen Sie daf\xFCr zu Beginn BTC, oder Sie leihen sie und tilgen am Ende durch einen BTC-Verkauf. Von 100 Starttagen: wie oft Leihen mehr BTC \xFCbrig lie\xDF.",head:["Start-LTV","Ohne Steuer","Verkauf jetzt mit 25 % besteuert, sp\xE4ter steuerfrei"],take:"Ohne Steuer lie\xDF Leihen bei LTV 30 % an {n} von 100 Starttagen mehr BTC \xFCbrig.",note:"Steuerregeln unterscheiden sich je nach Land und Person. Die 25 % sind nur ein Beispiel."},entry:{title:"Was BTC vor dem Start tat",lead:"Der Referenzkredit an jedem Starttag seit 2014, gruppiert nach der Kursbewegung von BTC in den 90 Tagen vor dem Start.",take:"Nachdem BTC in 90 Tagen um mehr als 10 % gefallen war, wurde der Referenzkredit an {fell} von 100 Starttagen liquidiert; nach einer Verdopplung an {doubled}; insgesamt an {all}.",note:"Vergangenheit, keine Vorhersage: Wenige Einbr\xFCche und Hausse-Phasen f\xFCllen jede Zeile, und benachbarte Starttage teilen sie. Die Pr\xFCfseite zeigt diese Tabelle f\xFCr Ihren eigenen Kredit."},swings:{title:"Die heutigen Kursschwankungen im Vergleich zur Vergangenheit",lead:"Wie stark sich der BTC-Kurs in den letzten 30 Tagen bewegte, auf ein Jahr gerechnet, im Vergleich zu jedem 30-Tage-Zeitraum seit 2014.",take:"In den letzten 30 Tagen schwankte der Kurs um {now}, auf ein Jahr gerechnet (Volatilit\xE4t). Seit 2014 waren {n} von 100 Zeitr\xE4umen von 30 Tagen ruhiger.",range:"Die H\xE4lfte aller Zeitr\xE4ume schwankte um weniger als {q50}. 10 von 100 schwankten um weniger als {q10}, 10 von 100 um mehr als {q90}.",chartTitle:"30-Tage-Kursschwankungen seit 2014, auf ein Jahr gerechnet",now:"Punkt: die letzten 30 Tage, {now}. Gestrichelte Linien: die Halvings 2016, 2020 und 2024, als die Zahl neuer BTC pro Block halbiert wurde.",halving:"Halving",vsSim:"Zum Vergleich: Die Simulation auf der Pr\xFCfseite nimmt {sim} pro Jahr an, mehr als die heutigen Schwankungen. Sie liegt also auf der vorsichtigen Seite, auch wenn die Ruhe endet.",note:"Keine Prognose: Ruhige Phasen k\xF6nnen schnell enden."}},method:{title:"So funktioniert es",metaTitle:"So funktioniert es \xB7 Bitcoin-Kredit-Check",metaDescription:"Wie der Bitcoin-Kredit-Check das Risiko eines BTC-gedeckten Kredits berechnet: die Simulation Schritt f\xFCr Schritt, welche Volatilit\xE4t sie nutzt und warum, die Mathematik und wie Sie jede Zahl selbst pr\xFCfen.",short:"Die Seite baut aus echten Kursbewegungen seit 2014 10.000 m\xF6gliche Zuk\xFCnfte des BTC-Kurses, wobei j\xFCngere Jahre st\xE4rker z\xE4hlen. Auf jede wendet sie die Regeln Ihres Kreditgebers an. Die Zahl oben z\xE4hlt, in wie vielen von 100 Zuk\xFCnften Ihr Kredit liquidiert wird. Zwei weitere Methoden pr\xFCfen sie.",toc:"Auf dieser Seite",layers:{everyone:"F\xFCr alle",details:"Die Einzelheiten",experts:"F\xFCr Fachleute"},oneTitle:"Eine simulierte Zukunft, Schritt f\xFCr Schritt",oneLead:"Der Beispielkredit: {story} Der Kurs erreicht die Liquidationslinie nach einem R\xFCckgang um {drop}.",oneSteps:["30 echte Tage ziehen. Ein zuf\xE4lliger Starttag seit 2014; die n\xE4chsten 30 Tage werden so \xFCbernommen, wie sie waren, mit der Bewegung und dem tiefsten Kurs jedes Tages. In dieser Zukunft stammt das erste St\xFCck aus {first}.","St\xFCcke aneinanderreihen. Dreizehn St\xFCcke ergeben ein Jahr. Einbr\xFCche bleiben innerhalb eines St\xFCcks erhalten, denn auf schlechte Tage folgen oft weitere.","Jeden Tag pr\xFCfen. Liegt der tiefste Kurs des Tages bei oder unter Ihrem Liquidationskurs? Wird ein Margin Call nicht rechtzeitig behoben? In dieser Zukunft wird der Kredit an Tag {day} liquidiert, {why}, in einem St\xFCck aus {crash}.","10.000-mal wiederholen, jedes Mal mit anderen St\xFCcken, und z\xE4hlen."],oneWhy:{liquidationLtv:"als der Kurs den Liquidationskurs erreichte",cureExpired:"weil ein Margin Call nicht innerhalb von {hours} Stunden behoben wurde",autoPartial:"nach Teilliquidationen"},oneChartNote:"Gelbe Linie: Margin Call, im Beispiel nur eine Warnung. Rote Linie: Liquidation, dort verkauft der Kreditgeber.",oneChartTitle:"Eine simulierte Zukunft des Beispielkredits, St\xFCck f\xFCr St\xFCck",onePiece:"Dieses St\xFCck: echte Tage aus {origin}",volTitle:"Welche Volatilit\xE4t, und warum sie z\xE4hlt",volLead:"Die Simulation nutzt keine Volatilit\xE4t, die jemand festgelegt hat. Sie verwendet echte Tage und hat damit die Volatilit\xE4t der echten BTC-Geschichte. BTC ist aber mit seinem Markt ruhiger geworden:",volChartTitle:"Volatilit\xE4t pro Jahr (wie stark der Kurs schwankt, auf ein Jahr gerechnet)",volChartNote:"Dunklere Balken z\xE4hlen in der Simulation mehr. Ein Tag von vor {h} Jahren z\xE4hlt halb so viel wie ein heutiger.",volSim:"was die Simulation nutzt: {vol}",volTip:"{year}: {vol} pro Jahr; {weight} aller Ziehungen",volTipSoFar:"{year} bisher: {vol} pro Jahr; {weight} aller Ziehungen",volWhy:"Warum j\xFCngere Jahre mehr z\xE4hlen: Mit dem Wachstum des BTC-Marktes sind seine Schwankungen kleiner geworden, von 80\u201390 % pro Jahr 2017\u20132021 auf 42\u201352 % seit 2023. Ein gr\xF6\xDFerer Markt braucht mehr Geld, um ihn um denselben Prozentsatz zu bewegen. Deshalb z\xE4hlen j\xFCngere Jahre mehr, \xE4ltere Einbr\xFCche aber weiterhin: 2014\u20132018 machen noch {pre} aller Ziehungen aus.",volHead:["Wie die Jahre z\xE4hlen","Genutzte Volatilit\xE4t","Beispielkredit: liquidiert, von 100"],volRows:{equal:"Alle Jahre gleich",half:"Halbwertszeit {n} Jahre",current:"(diese Seite)",since2020:"Nur ab 2020",since2022:"Nur ab 2022"},volLimit:"Ehrliche Grenze: Der Test an der Vergangenheit kann diese Gewichtungen nicht unterscheiden; alle bestanden ihn und blieben vorsichtig. Die Gewichtung ist eine Abw\xE4gung, gest\xFCtzt auf die sinkende Volatilit\xE4t. W\xFCrde BTC wieder so wild wie 2017, l\xE4ge das wahre Risiko n\xE4her an der ersten Zeile.",volStress:"Unter der Antwort zeigt der Check denselben Kredit auch mit ruhigeren und wilderen Schwankungen. Er beh\xE4lt dieselben echten Tage und skaliert jede Bewegung: auf die ruhigsten 12 Monate von BTC bisher ({calm}, bis {calmEnd}) oder auf 2017\u20132021 ({wild}). Dabei werden auch die schlimmsten einzelnen Tage im selben Verh\xE4ltnis kleiner oder gr\xF6\xDFer.",numTitle:"Von 10.000 Zuk\xFCnften zu Ihrer Zahl",num:["Gez\xE4hlt: {k} der {n} Zuk\xFCnfte enden mit liquidiertem Beispielkredit. Das sind {p} von 100, angezeigt als {shown}. Jeder Punkt steht f\xFCr 100 Zuk\xFCnfte.","Genau auf etwa \xB11: Mit {n} Zuk\xFCnften liegt die Zahl bei einer Wiederholung mit anderen Zufallsziehungen innerhalb von etwa {ci} Punkten.","Dieselben Bedingungen ergeben immer dieselbe Zahl, weil die Zufallsziehungen festgelegt sind. \u201ESicherer machen\u201C, der Schieberegler und der Angebotsvergleich nutzen genau dieselben Zuk\xFCnfte, ein Unterschied kommt also nur von der einen \xC4nderung.","Keine Prognose: Die Zahl sagt, wie oft ein solcher Kredit in Zuk\xFCnften aus der Vergangenheit scheiterte, nicht, was passieren wird."],rulesTitle:"Die Regeln Ihres Kreditgebers in der Simulation",exampleChanged:"Ge\xE4ndert am 27. Oktober 2026: Der Margin Call im Beispiel ist jetzt nur eine Warnung; verkauft wird erst beim Liquidations-LTV. Vorher verkaufte der Kreditgeber alles, wenn ein Margin Call nicht binnen 48 Stunden behoben war; die Zahl des Beispiels war damals h\xF6her.",rulesChanged:"Ge\xE4ndert am 27. Oktober 2026: Vorher z\xE4hlte ein Verkauf genau zum Liquidationskurs, jetzt zum tiefsten Kurs dieser Stunde. Die Kosten des Risikos sind jetzt h\xF6her, die nach einem Verkauf verbleibenden BTC weniger; wie oft Kredite liquidiert werden, hat sich kaum ge\xE4ndert.",riskTitle:"Die Kosten des Risikos",riskWhat:"Der Check zeigt Kosten inklusive Liquidationsrisiko: Zinsen und Geb\xFChren plus die Kosten des Risikos. Das ist, was Ihnen eine Liquidation bis zum Kreditende nimmt: der verpasste Anstieg der verkauften BTC und die als Geb\xFChr gezahlten BTC. F\xE4llt BTC nach dem Verkauf weiter, hat der Verkauf keinen zus\xE4tzlichen Schaden angerichtet und z\xE4hlt mit 0.",riskOneTitle:"Eine Zukunft, durchgerechnet",riskOne:"In einer simulierten Zukunft wird der Beispielkredit an Tag {day} bei {price} liquidiert. {repaid} BTC tilgten den Kredit, {fee} BTC waren die Liquidationsgeb\xFChr. Am Ende steht BTC bei {end} (skaliert, siehe unten). Verpasster Anstieg: {repaid} \xD7 ({end} \u2212 {price}) = {missed}. Liquidationsgeb\xFChr: {fee} \xD7 {end} = {feeValue}. In dieser Zukunft: {total}.",riskOneFell:"In einer simulierten Zukunft wird der Beispielkredit an Tag {day} bei {price} liquidiert. {repaid} BTC tilgten den Kredit, {fee} BTC waren die Liquidationsgeb\xFChr. Am Ende steht BTC bei {end} (skaliert, siehe unten), unter dem Verkaufspreis, also wurde kein Anstieg verpasst. Liquidationsgeb\xFChr: {fee} \xD7 {end} = {feeValue}. In dieser Zukunft: {total}.",riskAllTitle:"Von 10.000 Zuk\xFCnften zur Zahl",riskAll:"Jede der {n} Zuk\xFCnfte bekommt ihre eigenen Kosten, berechnet wie oben. In {none} Zuk\xFCnften wird nichts verkauft, ihre Kosten sind 0 \u20AC. In den \xFCbrigen {sold} sind es im Durchschnitt {avgSold}: Die H\xE4lfte davon kostet weniger als {median}, jede zehnte mehr als {p90}. Die Kosten des Risikos sind der Durchschnitt \xFCber alle Zuk\xFCnfte, die ohne Verkauf mit 0 eingerechnet:",riskFormula:"Kosten des Risikos = Summe aller {n} Kosten \xF7 {n} = ({none} \xD7 0 \u20AC + {sold} \xD7 {avgSold}) \xF7 {n} = {sumSold} \xF7 {n} = {risk}",riskFormula2:"Dasselbe mit Anteilen: Anteil der Zuk\xFCnfte mit Verkauf \xD7 ihre durchschnittlichen Kosten = {share} \xD7 {avgSold} = {risk}",riskAllEnd:"Genau auf etwa \xB1{ci}. Zu Zinsen und Geb\xFChren addiert, ergibt das die Kosten inklusive Liquidationsrisiko: {total} statt {cost}. Der Check zeigt sie auf 10 \u20AC gerundet, mit \u201Eetwa\u201C.",riskScaleTitle:"Warum die Endkurse skaliert werden",riskScale:"In der Simulation bleibt der mittlere Kurs auf dem heutigen Stand, aber der durchschnittliche Endkurs liegt {up} h\xF6her, weil gro\xDFe Anstiege ihn nach oben ziehen. Ein fairer Preis f\xFCr Schutz braucht einen Durchschnitt gleich dem heutigen Kurs, wie in der Optionsbewertung mit einem Zins von 0. Daher wird jeder Endkurs mit demselben Faktor multipliziert. Die Zahl braucht dann keine Annahme \xFCber den Kurstrend.",riskOptionTitle:"Die Sicht als Option",riskOption:"Die Kosten des Risikos sind der Preis einer Option, die Ihnen ersetzt, was eine Liquidation nimmt. Es ist eine Down-and-in-Barriere-Option auf die verkauften BTC, mit dem Aus\xFCbungspreis beim Verkaufspreis. Daf\xFCr gibt es eine Lehrbuchformel.",riskHead:["Methode","Kosten des Risikos, Beispielkredit"],riskRowFormula:"Lehrbuchformel f\xFCr die Option: glatte Kurse, eine konstante Volatilit\xE4t von {vol}, Verkauf beim Liquidationskurs",riskRowSim:"Die Simulation dieser Seite (die Zahl im Check)",riskWhy:"Beide unterscheiden sich, weil die Simulation die echten Bewegungen von BTC nutzt, auch Einbr\xFCche innerhalb eines Tages, und die Regeln des Kreditgebers wie eingestellt. Die Formel kennt beides nicht.",riskReadTitle:"So lesen Sie die Zahl",riskRead:["Ein Durchschnitt, keine Zahlung: Niemand stellt sie Ihnen in Rechnung.","Null in {none} von 100 Zuk\xFCnften; nach einer Liquidation weit mehr als der Durchschnitt.","Zum Vergleich von Angeboten: Ein niedrigerer Zins mit h\xF6herer Liquidationswahrscheinlichkeit kann insgesamt mehr kosten."],riskLenderTitle:"Kredite ohne Liquidation w\xE4hrend der Laufzeit",riskLender:"Manche Kredite verkaufen w\xE4hrend der Laufzeit nichts und rechnen erst am Ende ab. Kann der Kreditgeber nicht mehr als die BTC verlangen, ist ein Fall unter den Kreditbetrag am Ende sein Verlust, nicht Ihrer. Ein Kreditgeber, der dieses Risiko tr\xE4gt, muss daf\xFCr bezahlt werden, etwa \xFCber den Zins oder einen niedrigeren LTV. Diese Seite beziffert die Seite des Kreditgebers nicht.",riskNot:"Nicht enthalten: ein Ausfall des Kreditgebers oder der Verlust Ihrer BTC, Steuern und Zinsen auf Geld. Die Seite rechnet mit einem Zins von 0; mit 4 % w\xE4re die Zahl etwa 5 % niedriger.",rules:["An jedem simulierten Tag wird der tiefste Kurs des Tages mit Ihrem Liquidationskurs verglichen. Dieser Kurs steigt, wenn unbezahlte Zinsen zur Schuld addiert werden.","Ein Margin Call wird am Schlusskurs des Tages gepr\xFCft. Die Frist z\xE4hlt in ganzen Tagen und kann bis zu einen Tag zu sp\xE4t gepr\xFCft werden (30 Stunden z\xE4hlen als 2 Tage). Verkaufte der Kreditgeber alles, wenn ein Margin Call nicht binnen 1 Tag behoben ist, erg\xE4be das Beispiel {d1} von 100; binnen 2 Tagen {d2}, binnen 3 Tagen {d3}. Mit nur einer Warnung wie im Beispiel: {none}.","Erreicht der Kurs den Liquidationskurs, z\xE4hlt der Verkauf zum tiefsten Kurs dieser Stunde, nie \xFCber dem Liquidationskurs. Die simulierten Tage behalten daf\xFCr ihre echten Stunden.","In echten Liquidationsstunden seit 2014 lag dieser Kurs im mittleren Fall {median} unter dem Liquidationskurs, in 1 von 10 F\xE4llen {p90} oder mehr. Ein Kreditgeber, der binnen Minuten verkauft, erzielt oft mehr.","Teilliquidationen, Geb\xFChren und eine Bargeldreserve folgen genau Ihren Regeln. Die Methode \u201Eechte Vergangenheit\u201C nutzt denselben Code, pr\xFCft aber jede Stunde."],methodsTitle:"Drei Methoden im Vergleich",methodsIntro:"Jede Methode kann auf ihre eigene Art falsch liegen. Deshalb rechnet die Seite denselben Kredit auf drei Wegen, dazu eine Lehrbuchformel als grobe Pr\xFCfung.",methodsHead:["Methode","Was sie annimmt","Beispielkredit"],methodsRows:{sim:["Simulation (die Zahl oben)","echte Tage seit 2014 in 30-Tage-St\xFCcken, j\xFCngere Jahre st\xE4rker gewichtet, kein Trend"],garch:["Volatilit\xE4tsmodell ([[garch]])","seine Sch\xE4tzung der heutigen Volatilit\xE4t ({today} pro Jahr); wilde Tage machen weitere wilde Tage wahrscheinlicher; seltene extreme Tage"],replay:["Echte Vergangenheit","der Kredit an jedem echten Tag seit 2014 gestartet; enth\xE4lt den Anstieg von BTC seitdem"],barrier:["Lehrbuchformel","ruhige, gleichm\xE4\xDFige Bewegungen mit {vol} pro Jahr; ohne Margin Calls"]},methodsWhy:"Warum sie sich unterscheiden: Die echte Vergangenheit f\xE4llt niedriger aus, weil BTC seit 2014 stark gestiegen ist, was die Simulation bewusst wegl\xE4sst. Das Volatilit\xE4tsmodell startet vom heutigen Markt.",fanTitle:"Spanne der simulierten Kurse",fanNote:"Jeden Monat: 9 von 10 simulierten Kursen liegen im hellen Band, die H\xE4lfte im dunklen; die Linie ist der mittlere. Die B\xE4nder zeigen Kurse, keine Ergebnisse: Ein Verlauf, der unter die Liquidationslinie taucht und sich erholt, endete trotzdem mit einer Liquidation.",fanTip:{q95:"95 von 100 darunter",q75:"75 von 100 darunter",q50:"Mitte (die H\xE4lfte darunter)",q25:"25 von 100 darunter",q05:"5 von 100 darunter"},byMonthTitle:"Liquidiert bis zum Ende jedes Monats (von 100)",testTitle:"Der Test an der Vergangenheit",test:"Ab 2016 sah die Methode jeden Monat nur die Vergangenheit und sagte den tiefsten Kurs der n\xE4chsten 90 und 365 Tage voraus. Eine faire Methode wird an ihrem \u201Eschlechtesten 5 %\u201C-Wert etwa 5-mal von 100 unterschritten. Weniger Unterschreitungen hei\xDFen: Die Methode ist vorsichtig.",testRow:"{model}, {days} Tage",testModels:{simulation:"Simulation",garch:"Volatilit\xE4tsmodell"},testUnit:"Zahl = wie oft die Wirklichkeit unter dem \u201Eschlechtesten 5 %\u201C-Wert lag, von 100 Vorhersagen (versprochen: 5). Euro-Historie; in US-Dollar \xE4hnlich.",testStrength:"Wie stark dieser Test ist: Die monatlichen Vorhersagen \xFCberlappen sich. Der 90-Tage-Test umfasst etwa {n90} getrennte Zeitr\xE4ume, der Ein-Jahres-Test nur etwa {n365}. Er kann eine deutlich zu optimistische Methode erkennen, aber keine exakte Genauigkeit beweisen.",dataTitle:"Daten und die w\xF6chentliche Aktualisierung",data:["Kursdaten: st\xFCndliche Kurse der B\xF6rsen Bitstamp (USD seit 2014, EUR seit 2017) und Kraken (EUR 2014\u20132016), wie von den B\xF6rsen ver\xF6ffentlicht. Bekannte L\xFCcke: Bitstamp war vom 5. bis 9. Januar 2015 offline.","Weitere W\xE4hrungen (CHF, GBP, CAD, AUD, CZK, PLN): die Euro-Kurse, Stunde f\xFCr Stunde mit dem t\xE4glichen Wechselkurs der Europ\xE4ischen Zentralbank umgerechnet. Gegen\xFCber echten B\xF6rsenkursen weicht die H\xE4lfte aller Stunden um h\xF6chstens 0,2 % ab.","Die Simulation nutzt den BTC-Kurs in der W\xE4hrung Ihres Kredits. Die Antwort kann deshalb zwischen W\xE4hrungen um etwa einen Punkt abweichen.","Aktueller Kurs: Bitstamp, dieselbe B\xF6rse wie die Kurshistorie; nur wenn sie nicht antwortet, Coinbase. Weitere W\xE4hrungen: der Euro-Kurs \xD7 der neueste EZB-Kurs. Die Simulation und die echte Vergangenheit nutzen die Kurshistorie bis zur letzten w\xF6chentlichen Aktualisierung, daher geben dieselben Bedingungen die ganze Woche dieselbe Zahl.","Einmal pro Woche erg\xE4nzt ein automatischer Ablauf die neuesten Kurse und Wechselkurse. Er pr\xFCft sie zuerst (L\xFCcken, unm\xF6gliche Kurse, Quellen, die sich widersprechen) und h\xE4lt an, wenn etwas nicht stimmt. Alle Zahlen dieser Seite werden dann neu berechnet."],measure:"Ihr Kreditgeber entscheidet, welcher BTC-Kurs z\xE4hlt: eine B\xF6rse, ein Durchschnitt mehrerer oder ein Durchschnitt \xFCber einige Minuten. Diese Seite nutzt den tiefsten Kurs jeder Stunde an einer B\xF6rse, das ist vorsichtig. Wie stark ein glatterer Kurs das Ergebnis \xE4ndert: {link}.",measureLink:"Erkenntnisse: st\xFCndliche Tiefstkurse oder ein glatterer Kurs",trendTitle:"Warum kein Kurstrend angenommen wird",trend:"Mit dem fr\xFCheren Durchschnittswachstum von BTC fiel der Test an der Vergangenheit durch: Die Methode wurde zu optimistisch. Auf der Pr\xFCfseite zeigt \u201ESpielt der Kurstrend eine Rolle?\u201C, wie stark ein Trend Ihre Antwort \xE4ndern w\xFCrde.",limitsTitle:"Was das Modell nicht kann",limits:["Es kennt nur Kursbewegungen, die es seit 2014 gab. Ein Einbruch neuer Art ist nicht enthalten.","Die Gewichtung j\xFCngerer Jahre ist eine Abw\xE4gung. W\xFCrde BTC wieder so wild wie 2017, w\xE4re das wahre Risiko h\xF6her.","Es rechnet Tag f\xFCr Tag: Fristen z\xE4hlen in ganzen Tagen, und zwei Einbr\xFCche an einem Tag z\xE4hlen als einer.","Es reiht 30-Tage-St\xFCcke zuf\xE4llig aneinander, l\xE4ngere Phasen mit steigenden oder fallenden Kursen werden also vermischt. H\xE4ufungen von Einbr\xFCchen \xFCber mehr als 30 Tage bleiben nur teilweise erhalten; das daneben gezeigte Volatilit\xE4tsmodell ber\xFCcksichtigt sie.","Es nimmt keinen Kurstrend an. Steigt BTC stark, fallen echte Ergebnisse besser aus; f\xE4llt BTC \xFCber Jahre, schlechter."],mathsTitle:"Die Mathematik",mathsIntro:"F\xFCr alle, die die genauen Definitionen sehen m\xF6chten. Alle Werte werden bei jedem Bau aus den aktuellen Daten berechnet.",mathsOpen:"Formeln zeigen",mathsData:"Daten",mathsDataNote:"C: Schlusskurs eines Tages, L: tiefster Stundenkurs des Tages (UTC-Tage).",mathsSim:"Simulation: gewichteter Block-Bootstrap",mathsDays:"Tage pro Block",mathsLiquidated:"an Tag k liquidiert (D: Schuld, B: hinterlegte BTC)",mathsSimNote:"Margin Calls, Fristen, Teilliquidationen, Geb\xFChren und Reserven folgen Schritt f\xFCr Schritt den Regeln des Kreditgebers. Die Zufallsziehungen sind festgelegt (Startwert 20240101), ein Zufallsstrom pro Verlauf.",mathsNoTrend:"(kein Trend; m: Drift des log. Kurses)",mathsGarch:"Volatilit\xE4tsmodell: GARCH(1,1) mit Student-t-Tagen",mathsUnitVar:"auf Varianz 1 skaliert",mathsGarchValues:"Per Maximum-Likelihood an allen Tagen seit 2014 angepasst: \u03B1 = {alpha}, \u03B2 = {beta} (\u03B1 + \u03B2 = {persistence}), \u03BD = {nu}; heutige Volatilit\xE4t \u221A(365 \xB7 h) = {today} pro Jahr. Der tiefste Kurs eines Tages wird aus einer Brownschen Br\xFCcke gezogen.",mathsBarrier:"Lehrbuchformel (geometrische Brownsche Bewegung, kein Trend)",mathsRisk:"Kosten des Risikos",mathsRiskNote:"N Zuk\xFCnfte i; je Verkauf: b = verkaufte BTC, P = Verkaufspreis, k = Anteil des Verkaufs, der Schulden tilgt (der Rest ist die Geb\xFChr). S\u0303 = Endkurs, skaliert auf einen Durchschnitt von S\u2080. Lehrbuchoption: Reiner und Rubinstein (1991), ein Down-and-in-Call mit dem Aus\xFCbungspreis an der Barriere.",mathsReplay:"Echte Vergangenheit",mathsReplayNote:"Derselbe Kredit, an jedem Tag seit 2014 um 00:00 UTC gestartet. Der tiefste Kurs jeder Stunde wird mit dem Liquidationskurs verglichen, Margin-Call-Fristen z\xE4hlen in Stunden.",mathsCode:"Der Code",verifyTitle:"Selbst pr\xFCfen",code:"Der gesamte Code, die Daten und die Tests sind offen: {link}",verify:["Eine unabh\xE4ngige zweite Version der Simulation, in Python aus den rohen B\xF6rsendaten geschrieben, stimmt f\xFCr 12 Kredite in Euro und US-Dollar exakt mit dieser Seite \xFCberein. Das Volatilit\xE4tsmodell stimmt mit einem Standard-Statistikpaket \xFCberein. Einzelheiten: die Mathematik-Pr\xFCfung ({audit}).","Die Tests rechnen 12 Referenzkredite auf 9 Nachkommastellen nach. Sie pr\xFCfen au\xDFerdem jede Regel des Kreditgeber-Modells und bauen absichtlich Fehler in den Code ein, um zu sehen, dass die Tests sie bemerken.","Eine Zahl von Hand pr\xFCfen: Nehmen Sie den Liquidationskurs aus Ihrer Antwort und schauen Sie in den Kursdaten nach, wie oft BTC innerhalb Ihrer Laufzeit so weit fiel. Das ist ungef\xE4hr die Zahl \u201Eechte Vergangenheit\u201C.","Menschen, die bei Kreditgebern arbeiten, haben die Methode kommentiert. Niemand hat f\xFCr die Ergebnisse bezahlt oder sie beeinflusst."]},feedback:{intro:"Vier kurze Fragen. Ihre Antworten landen in einer E-Mail in Ihrem eigenen Mailprogramm, und Sie entscheiden, ob Sie sie senden. Diese Seite sendet nichts.",use:"Wof\xFCr nutzen Sie das Geld vor allem?",useOptions:{spend:"Ausgeben",compare:"Angebote vergleichen",buy:"Mehr BTC kaufen",curious:"Nur neugierig"},meaning:"In einem Satz: Was bedeutet die gro\xDFe Zahl oben?",useful:"Diese Seite gibt mir, was ich f\xFCr meine Entscheidung brauche.",easy:"Diese Seite ist einfach zu benutzen.",scaleLow:"gar nicht",scaleHigh:"voll und ganz",missing:"Was war verwirrend, oder was fehlt? (optional)",language:"In welcher Sprache h\xE4tten Sie diese Seite gern? (freiwillig)",languageMissing:"Ihre Sprache fehlt? Sagen Sie es uns.",languageSubject:"Sprachwunsch f\xFCr den Bitcoin-Kredit-Chec t l\xE4uft {m} Monate, beim bisherigen sind es noch {n}. Seine Gesamtkosten gelten f\xFCr alle {m} Monate, die des bisherigen nur f\xFCr {n}.",onlyMonths:"nur seine {months} Monate",showing:"Unten zu sehen: {name}. Alles unter dieser Zeile betrifft dieses Angebot.",startsFrom:"Ausgangspunkt ist Ihr bisheriger Kredit: Sie schulden {owed} gegen {btc} BTC, noch {months} Monate. Sein LTV heute: {ltv}.",whenRisen:"M\xF6glich, wenn BTC seit Kreditbeginn gestiegen ist (Ihr LTV also jetzt niedriger ist), und nur bis zum h\xF6chsten Start-LTV Ihres Kreditgebers.",atMargin:"den Margin Call bei",atLiquidation:"den Liquidations-LTV von",limitBack:"Der neue LTV ({ltv}) w\xFCrde {limit} erreichen, so kann kein Kredit starten. Zum heutigen Kurs lassen sich h\xF6chstens {max} BTC zur\xFCcknehmen. Fragen Sie Ihren Kreditgeber nach seinem h\xF6chsten Start-LTV.",limitBackNone:"Der neue LTV ({ltv}) w\xFCrde {limit} erreichen, so kann kein Kredit starten. Zum heutigen Kurs lassen sich keine BTC zur\xFCcknehmen.",limitMore:"Der neue LTV ({ltv}) w\xFCrde {limit} erreichen, so kann kein Kredit starten. Zum heutigen Kurs lassen sich h\xF6chstens {max} mehr leihen. Fragen Sie Ihren Kreditgeber nach seinem h\xF6chsten Start-LTV.",limitMoreNone:"Der neue LTV ({ltv}) w\xFCrde {limit} erreichen, so kann kein Kredit starten. Zum heutigen Kurs l\xE4sst sich nichts mehr leihen.",higherThanToday:"Start-LTV {ltv}, gegen\xFCber {today} heute. Pr\xFCfen Sie, ob das innerhalb des h\xF6chsten Start-LTV Ihres Kreditgebers liegt.",extraPurpose:"Was machen Sie mit dem zus\xE4tzlichen Geld?",copyHint:"Die Bedingungen unten sind zun\xE4chst eine Kopie Ihres bisherigen Kredits. Ersetzen Sie sie durch die des neuen Angebots: Zins, Laufzeit, Liquidations-LTV, Margin Call und Geb\xFChren.",newLoanLine:"Neuer Kredit: {amount} gegen {btc} BTC, Start-LTV {ltv}.",whatChanges:"Was \xE4ndert sich?",same:"Gleicher Betrag",more:"Mehr leihen",back:"BTC zur\xFCcknehmen",extra:"Zus\xE4tzliches Geld",backBtc:"Zur\xFCckgenom Ihr LTV eine festgelegte Stufe erreicht hat. Je nach Kreditgeber m\xFCssen Sie innerhalb einiger Stunden BTC nachschie\xDFen oder einen Teil zur\xFCckzahlen, oder der Kreditgeber verkauft einen Teil Ihrer BTC."},liquidation:{term:"Liquidation (Verwertung)",text:"Der Kreditgeber verkauft Ihre hinterlegten BTC, um den Kredit zu tilgen, ohne Sie zu fragen. Das passiert, wenn der LTV die Liquidationsschwelle erreicht oder ein Margin Call nicht rechtzeitig behoben wird."},partialLiquidation:{term:"Teilliquidation",text:"Der Kreditgeber verkauft nur einen Teil Ihrer BTC, gerade genug, um den LTV wieder auf eine niedrigere Stufe zu bringen. Der Kredit l\xE4uft weiter, mit weniger BTC dahinter."},collateral:{term:"Sicherheit (Collateral)",text:"Etwas, das Sie als Pfand f\xFCr einen Kredit geben. Hier: Ihre BTC. Sie bekommen sie zur\xFCck, wenn der Kredit getilgt ist."},curePeriod:{term:"Frist zum Nachschie\xDFen (Nachschussfrist)",text:"Die Zeit, die Sie nach einem Margin Call haben, um BTC nachzuschie\xDFen oder einen Teil zur\xFCckzuzahlen. Vertr\xE4ge nennen sie oft Nachschussfrist."},originationFee:{term:"Abschlussgeb\xFChr",text:"Eine einmalige Geb\xFChr f\xFCr die Er\xF6ffnung des Kredits. Sie kann vom ausgezahlten Geld abgezogen werden."},aprVsRate:{term:"Effektivzins vs. Sollzins",text:"Der Sollzins ist der Preis des Leihens ohne Geb\xFChren. Der Effektivzins rechnet Geb\xFChren und Zahlungszeitpunkte mit ein, als ein j\xE4hrlicher Prozentsatz."},compounding:{term:"Zinseszins",text:"Zinsen, die zur Schuld addiert werden, kosten selbst wieder Zinsen. Die Schuld w\xE4chst etwas schneller."},dayCount:{term:"Zinstageberechnung",text:"Die Regel, mit der aus einem Jahreszins die Zinsen f\xFCr einen Zeitraum werden: jeder Monat als ein Zw\xF6lftel des Jahres oder die tats\xE4chlichen Tage."},drawdown:{term:"Drawdown (Kursr\xFCckgang)",text:"Wie stark ein Kurs von einem fr\xFCheren Hoch f\xE4llt. Von 60.000 \u20AC auf 30.000 \u20AC ist ein Drawdown von 50 %."},ohlc:{term:"OHLC (Kerze)",text:"Vier Kurse f\xFCr einen Zeitraum wie eine Stunde: Er\xF6ffnung, Hoch, Tief, Schluss. Diese Seite pr\xFCft mit dem Tief jeder Stunde, ob verkauft wird."},priceIndex:{term:"Kursindex",text:"Die Kursquelle, mit der ein Kreditgeber Ihre BTC bewertet: eine B\xF6rse oder ein Durchschnitt mehrerer. Sie entscheidet, wann ein Margin Call oder Verkauf passiert."},counterpartyRisk:{term:"Gegenparteirisiko",text:"Das Risiko, dass die andere Seite, hier der Kreditgeber, ihr Versprechen nicht h\xE4lt, zum Beispiel weil sie pleitegeht."},rehypothecation:{term:"Rehypothekierung (Weiterverleihen)",text:"Der Kreditgeber verleiht die BTC, die Sie hinterlegt haben, weiter oder nutzt sie anderweitig. Ger\xE4t der Kreditgeber in Schwierigkeiten, k\xF6nnen Ihre BTC weg sein."},simulatedFuture:{term:"Simulierte Zukunft",text:'Ein m\xF6glicher Verlauf des BTC-Kurses w\xE4hrend Ihres Kredits, gebaut aus echten fr\xFCheren Kursbewegungen. Z\xE4hlt man, was in vielen davon passiert, ergibt sich eine H\xE4ufigkeit "N von 100".'},blockBootstrap:{term:"Block-Bootstrap",text:"Die Methode hinter den simulierten Zuk\xFCnften: St\xFCcke echter Kurshistorie (je 30 Tage) werden zuf\xE4llig ausgew\xE4hlt und aneinandergereiht."},garch:{term:"GARCH-Modell",text:"Ein Statistikmodell f\xFCr Kurse, in dem wilde Tage weitere wilde Tage wahrscheinlicher machen und sehr gro\xDFe Bewegungen h\xE4ufiger vorkommen als im Lehrbuchmodell."},historicalReplay:{term:"Nachspielen der Vergangenheit",text:"Der Kredit wird an jedem fr\xFCheren Tag gestartet und mit dem verglichen, was der Kurs danach wirklich getan hat."},riskCost:{term:"Kosten des Risikos",text:"Was Ihnen eine Liquidation bis zum Kreditende nimmt, im Durchschnitt \xFCber die simulierten Zuk\xFCnfte: der verpasste Anstieg der verkauften BTC und die Geb\xFChr. Ein Optionspreis, keine Geb\xFChr."},priceTrend:{term:"Kurstrend",text:"Eine angenommene j\xE4hrliche Kurs\xE4nderung der mittleren simulierten Zukunft (mit Zinseszinseffekt). Sie ro\xDF wie der Kredit oder gr\xF6\xDFer.",fix:"Pr\xFCfen Sie, ob die Geb\xFChr ein Prozentsatz oder ein fester Betrag ist."},CURE_NEGATIVE:{problem:"Die Frist zum Nachschie\xDFen kann nicht negativ sein.",fix:"Geben Sie die Stunden aus Ihrem Angebot ein."},TAX_RATE_INVALID:{problem:"Ein Steuersatz muss zwischen 0 % und unter 100 % liegen.",fix:"Geben Sie einen Prozentsatz wie 25 ein, oder 0."},RESERVE_NEGATIVE:{problem:"Der bereitgehaltene Betrag kann nicht negativ sein.",fix:"Geben Sie einen Betrag ein, oder 0."},CURE_TARGET_INVALID:{problem:"Der LTV, auf den der Kreditgeber Sie zur\xFCckbringt, muss \xFCber 0 % und unter dem Margin-Call-LTV liegen.",fix:"Lassen Sie das Feld leer, um Ihren Start-LTV zu verwenden, oder geben Sie die Zahl aus Ihrem Angebot ein."},COLLATERAL_INVALID:{problem:"Die Menge der hinterlegten BTC muss eine Zahl \xFCber null sein.",fix:"Geben Sie die BTC-Menge ein, zum Beispiel 0,25."},COLLATERAL_TOO_LOW:{problem:"Mit so wenig BTC ist der Kredit gr\xF6\xDFer als der Wert der BTC (ein LTV von 100 % oder mehr).",fix:"Pr\xFCfen Sie die BTC-Menge, den Kreditbetrag und den BTC-Preis."},EXISTING_LOAN_AT_LIQUIDATION:{problem:"Mit diesen Zahlen liegt Ihr LTV heute schon beim Liquidations-LTV oder dar\xFCber.",fix:"Pr\xFCfen Sie den geschuldeten Betrag, die hinterlegten BTC und den BTC-Kurs. Stimmen sie, wenden Sie sich jetzt an Ihren Kreditgeber."}},legal:{templateNote:"Vorlage: Einige Teile m\xFCssen noch ausgef\xFCllt werden.",impressumTitle:"Impressum",impressum:["Angaben gem\xE4\xDF \xA7 5 DDG (Digitale-Dienste-Gesetz)","Lennart Bodden","c/o Online-Impressum 11950, Europaring 90, 53757 Sankt Augustin, Deutschland","E-Mail: {email}","Kontaktformular: {form}","Verantwortlich f\xFCr den Inhalt nach \xA7 18 Abs. 2 MStV: Lennart Bodden, Anschrift wie oben","Diese Seite (\u201EBitcoin-Kredit-Check\u201C, bitcoinloancheck.com) ist ein kostenloses, privates und unabh\xE4ngiges Projekt. Sie bietet keine Kredite an, vermittelt keine Kredite und steht in keiner Gesch\xE4ftsbeziehung zu einem Kreditgeber. Sie ist keine Finanz-, Anlage- oder Steuerberatung.","Quellen: BTC-Kurse von Bitstamp und Kraken, Wechselkurse der Europ\xE4ischen Zentralbank. Der Code steht unter der MIT-Lizenz; die eingebettete Schrift Source Serif 4 unter der SIL Open Font License."],privacyTitle:"Datenschutzerkl\xE4rung",privacy:[{h:"1. Verantwortlicher",p:["Verantwortlich f\xFCr die Datenverarbeitung auf dieser Seite ist Lennart Bodden, c/o Online-Impressum 11950, Europaring 90, 53757 Sankt Augustin, Deutschland, E-Mail: {email}.","Ein Datenschutzbeauftragter ist nicht benannt, weil daf\xFCr keine Pflicht besteht."]},{h:"2. Das Wichtigste in K\xFCrze",p:["Diese Seite hat keine Benutzerkonten, setzt keine Cookies und nutzt keine Analyse-, Tracking- oder Werbedienste. Alle Berechnungen finden in Ihrem Browser statt; Ihre Eingaben werden an niemanden \xFCbermittelt.","Personenbezogene Daten fallen nur an, weil Ihr Browser Server kontaktiert: den Hosting-Dienst Cloudflare, der die Seite ausliefert, und einen \xF6ffentlichen Kursdienst f\xFCr den aktuellen BTC-Kurs. Beide sehen dabei Ihre IP-Adresse.","Sie sind nicht verpflichtet, Daten bereitzustellen. Ohne Ihre IP-Adresse kann die Seite Ihnen allerdings nicht ausgeliefert werden."]},{h:"3. Auslieferung der Seite durch Cloudflare",p:["Die Seite wird \xFCber Cloudflare Pages ausgeliefert, einschlie\xDFlich Namensaufl\xF6sung (DNS) und weltweitem Auslieferungsnetz. Anbieter ist Cloudflare, Inc., 101 Townsend St., San Francisco, CA 94107, USA.","Beim Aufruf verarbeitet Cloudflare die technischen Daten, die jede Auslieferung einer Webseite erfordert: Ihre IP-Adresse, Datum und Uhrzeit, die aufgerufene Adresse, Ihren Browsertyp und Ihr Betriebssystem. Cloudflare nutzt diese Daten auch, um Angriffe abzuwehren, und kann sie daf\xFCr vor\xFCbergehend in Protokollen speichern.","Wir selbst sehen nur zusammengefasste Zahlen, zum Beispiel die Zahl der Aufrufe pro Tag und Land, keine IP-Adressen.","Cloudflare verarbeitet die Daten in unserem Auftrag auf Grundlage seines Auftragsverarbeitungsvertrags (Art. 28 DSGVO). Cloudflare ist nach dem EU-US Data Privacy Framework zertifiziert; f\xFCr die USA besteht damit ein Angemessenheitsbeschluss der EU-Kommission (Art. 45 DSGVO). Zus\xE4tzlich enth\xE4lt der Vertrag die EU-Standardvertragsklauseln.","Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO. Unser berechtigtes Interesse ist eine sichere, schnelle und zuverl\xE4ssige Auslieferung der Seite. Weitere Informationen: https://www.cloudflare.com/privacypolicy/"]},{h:"4. Aktueller BTC-Kurs",p:["Damit die Ergebnisse mit dem heutigen Kurs rechnen, fragt Ihr Browser beim \xD6ffnen der Seite den aktuellen BTC-Kurs bei Bitstamp ab (www.bitstamp.net). Bitstamp hat seine europ\xE4ischen Gesellschaften in Luxemburg.","Nur wenn Bitstamp nicht antwortet, fragt Ihr Browser stattdessen Coinbase (api.coinbase.com, Coinbase, Inc., USA). Coinbase gibt an, nach dem EU-US Data Privacy Framework zertifiziert zu sein. Ein Wechsel der W\xE4hrung oder \u201EKurs neu laden\u201C wiederholt die Abfrage.","Dabei erh\xE4lt der Kursdienst Ihre IP-Adresse, die Uhrzeit und Ihren Browsertyp, wie bei jedem Aufruf einer Webseite. Die Abfragen enthalten keine Cookies, keinen Referrer und nichts von Ihren Eingaben. Wir erhalten keine dieser Daten. F\xFCr ihre eigene Verarbeitung sind die Kursdienste selbst verantwortlich; Einzelheiten stehen in ihren Datenschutzhinweisen.","Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO. Unser berechtigtes Interesse ist die Berechnung mit einem aktuellen Kurs; ohne ihn w\xE4ren die Ergebnisse veraltet. Sie k\xF6nnen stattdessen einen eigenen Kurs eingeben."]},{h:"5. Speicherung in Ihrem Browser",p:["Die Seite speichert nur auf Ihrem Ger\xE4t und nur, was f\xFCr die von Ihnen genutzten Funktionen n\xF6tig ist. Diese Daten verlassen Ihr Ger\xE4t nicht.","Ihre Eingaben bleiben im Speicher dieses Browser-Tabs (Session Storage), damit sie ein Neuladen \xFCberstehen; beim Schlie\xDFen des Tabs werden sie gel\xF6scht. Nur wenn Sie \u201EMeine Eingaben in diesem Browser f\xFCr den n\xE4chsten Besuch speichern\u201C ankreuzen, bleiben sie im lokalen Speicher Ihres Browsers (Local Storage), bis Sie den Haken entfernen.","W\xE4hlen Sie eine Sprache oder den hellen oder dunklen Modus, merkt sich die Seite diese Wahl im lokalen Speicher.","\u201ENeu beginnen und meine Eingaben l\xF6schen\u201C entfernt alle diese Daten; Sie k\xF6nnen sie auch in den Einstellungen Ihres Browsers l\xF6schen.","Rechtsgrundlage ist \xA7 25 Abs. 2 Nr. 2 TDDDG, weil die Speicherung f\xFCr die von Ihnen ausdr\xFCcklich gew\xFCnschte Funktion unbedingt erforderlich ist."]},{h:"6. Geteilte Links",p:["Wenn Sie \u201ETeilen\u201C nutzen, stehen Ihre Eingaben im Link hinter dem Zeichen \u201E#\u201C. Diesen Teil senden Browser an keinen Server, auch nicht an Cloudflare. Wer den Link von Ihnen erh\xE4lt, kann Ihre Eingaben sehen. Auf dem Telefon \xF6ffnet \u201ETeilen\u201C das Teilen-Men\xFC Ihres Ger\xE4ts; was danach geschieht, entscheiden Sie und die von Ihnen gew\xE4hlte App."]},{h:"7. Feedback und Kontakt per E-Mail",p:["\u201EHelfen Sie, diese Seite zu verbessern\u201C und \u201EIhre Sprache fehlt?\u201C bereiten eine E-Mail in Ihrem eigenen Mailprogramm vor. Es wird nichts gesendet, solange Sie nicht selbst senden. Ihre Kreditbedingungen werden nur angeh\xE4ngt, wenn Sie das ankreuzen.","Senden Sie eine E-Mail, erhalten wir Ihre E-Mail-Adresse und Ihre Nachricht. Das Postfach wird von Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland, betrieben. Google kann die Daten auch in den USA verarbeiten.","Google LLC ist unter dem EU-US Data Privacy Framework zertifiziert; f\xFCr die USA besteht damit ein Angemessenheitsbeschluss der EU-Kommission (Art. 45 DSGVO).","Um E-Mails zu sortieren und zu beantworten, lassen wir neue Nachrichten einmal t\xE4glich von dem KI-Dienst Claude zusammenfassen. Claude wird von Anthropic Ireland, Limited, 6th Floor, South Bank House, Barrow Street, Dublin 4, D04 TR29, Irland, bereitgestellt. Anthropic verarbeitet die Daten auch in den USA; daf\xFCr gelten EU-Standardvertragsklauseln (Art. 46 DSGVO). Claude liest nur: Es sendet, beantwortet und l\xF6scht nichts. Die Nutzung unserer Unterhaltungen zum Training von KI-Modellen haben wir abgeschaltet.","Wir nutzen Ihre Nachricht nur, um sie zu lesen, zu beantworten und die Seite zu verbessern, und l\xF6schen sie, sobald sie daf\xFCr nicht mehr n\xF6tig ist, sp\xE4testens nach zw\xF6lf Monaten. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO; unser berechtigtes Interesse ist die Beantwortung Ihrer Nachricht und die Verbesserung der Seite."]},{h:"8. Spenden in Bitcoin",p:["Wenn Sie an die angezeigte Adresse spenden, ist die \xDCberweisung wie jede Bitcoin-Transaktion dauerhaft \xF6ffentlich im Bitcoin-Netz sichtbar. Wir erheben dabei keine weiteren Daten und versuchen nicht, Spenden Personen zuzuordnen."]},{h:"9. Links zu anderen Seiten",p:["Links zum Quellcode und zur Lizenz f\xFChren zu GitHub (GitHub, Inc., USA). Erst wenn Sie einen solchen Link \xF6ffnen, verarbeitet GitHub Daten nach seinen eigenen Datenschutzhinweisen.","Auch die Links zu LinkedIn und zum Kontaktformular von Online-Impressum f\xFChren zu anderen Seiten mit eigenen Datenschutzregeln. Von dort wird nichts geladen, bevor Sie klicken."]},{h:"10. Sicherheit",p:["Die Seite wird nur verschl\xFCsselt (HTTPS) ausgeliefert. Sie l\xE4dt keine Skripte, Schriften oder Stile von anderen Servern, und eine strenge Sicherheitsregel erlaubt nur ihre eigenen Skripte."]},{h:"11. Ihre Rechte",p:["Sie haben das Recht auf Auskunft (Art. 15 DSGVO), Berichtigung (Art. 16), L\xF6schung (Art. 17), Einschr\xE4nkung der Verarbeitung (Art. 18) und Daten\xFCbertragbarkeit (Art. 20).","Sie haben au\xDFerdem das Recht, einer Verarbeitung auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO aus Gr\xFCnden, die sich aus Ihrer besonderen Situation ergeben, jederzeit zu widersprechen (Art. 21 DSGVO). Schreiben Sie dazu an {email}.","Sie k\xF6nnen sich bei einer Datenschutz-Aufsichtsbeh\xF6rde beschweren, insbesondere in dem EU-Staat, in dem Sie wohnen oder arbeiten (Art. 77 DSGVO).","Eine automatisierte Entscheidungsfindung oder ein Profiling findet nicht statt."]},{h:"12. Stand",p:["Stand dieser Datenschutzerkl\xE4rung: 27. Oktober 2026. \xC4ndert sich die Seite, passen wir diese Erkl\xE4rung an."]}],links:"Impressum \xB7 Datenschutzerkl\xE4rung"}};var Y={en:ae,de:se},I="en";var we=/^(.*?\/)(de\/)?((?:insights|method)\/)?(index\.html)?$/,Q=()=>typeof location>"u"?null:location.pathname.match(we);function F(t,e=I){let r=Q(),s=typeof location<"u"&&location.protocol==="file:"?"index.html":"";return`${r?r[1]:"/"}${e==="de"?"de/":""}${t}${s}`}function H(){let t=Q();return t&&t[3]||""}function oe(){if(typeof location>"u"||typeof history>"u"||!Q())return;let t=F(H());t!==location.pathname&&history.replaceState(null,"",`${t}${location.search}${location.hash}`)}function le(){let t=null;try{t=localStorage.getItem("btc-loan-risk:lang")}catch{}return I=(/\/de\/((insights|method)\/)?(index\.html)?$/.test(location.pathname)?"de":null)||(t==="de"||t==="en"?t:(navigator.language||"").toLowerCase().startsWith("de")?"de":"en"),document.documentElement.lang=I,oe(),I}function X(t){I=t,document.documentElement.lang=t;try{localStorage.setItem("btc-loan-risk:lang",t)}catch{}oe()}var K=()=>I,M=()=>Y[I];function d(t,e={}){let r=t.split(".").reduce((a,c)=>a==null?a:a[c],Y[I]);return typeof r!="string"?r??t:Object.keys(e).filter(a=>Number(e[a])===1&&typeof e[a]!="boolean").reduce((a,c)=>a.replace(new RegExp(`\\{${c}\\} (months|Monaten|Monate)\\b`,"g"),(h,b)=>`{${c}} ${b.startsWith("m")?"month":"Monat"}`),r).replace(/\{(\w+)\}/g,(a,c)=>e[c]??`{${c}}`)}var o=t=>String(t).replace(/[&<>"]/g,e=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[e]);function ee(t){return o(t).replace(/\[\[(\w+)\]\]/g,(e,r,s,n)=>{let a=Y[I].glossary.terms[r];if(!a)return r;let c=s===0||/[.!?:]\s*$/.test(n.slice(0,s)),h=I==="en"&&
