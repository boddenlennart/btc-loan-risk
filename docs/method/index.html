DFen"},liquidationSale:{label:"Beim Liquidations-LTV verkauft der Kreditgeber",all:"alles",partial:"nur so viel wie n\xF6tig"},cureTargetLtv:{label:"LTV, auf den der Kreditgeber Sie zur\xFCckbringt",hint:"Leer hei\xDFt: Ihr Start-LTV."},liquidationFee:{label:"Liquidationsgeb\xFChr",debt:"% des geschuldeten Betrags",collateralSold:"% der verkauften BTC"},repayWith:{label:"Wie zahlen Sie zur\xFCck?",sell:"Durch BTC-Verkauf am Ende",cash:"Mit neuem Geld"},currency:{label:"W\xE4hrung"},startDate:{label:"Startdatum",hint:"Nur wichtig, wenn Zinsen nach tats\xE4chlichen Tagen berechnet werden."},dayCount:{label:"Wie Tage gez\xE4hlt werden","30/360":"Jahreszins \xF7 12 pro Monat","act/365":"Tats\xE4chliche Tage \xF7 365","act/360":"Tats\xE4chliche Tage \xF7 360"},simPaths:{label:"Simulierte Zuk\xFCnfte",2e3:"2.000 (schnell)",1e4:"10.000",2e4:"20.000 (langsam auf Handys)"},bootstrapBlockDays:{label:"L\xE4nge der kopierten Kursabschnitte (Tage)"}},help:{initialLtv:"LTV = Kredit \xF7 Wert der hinterlegten BTC. Ein niedrigerer LTV hei\xDFt: mehr BTC hinter demselben Kredit, der Kurs kann also tiefer fallen. Beispiel: Kredit 10.000 \u20AC bei 50 % LTV hei\xDFt, Sie hinterlegen BTC im Wert von 20.000 \u20AC. Bei einem BTC-Kurs von 50.000 \u20AC sind das 0,4 BTC.",liquidationLtv:"F\xE4llt BTC, bleibt Ihr Kredit gleich, aber Ihre BTC sind weniger wert; der LTV steigt. Bei diesem LTV verkauft der Kreditgeber Ihre BTC. Eine h\xF6here Zahl gibt Ihnen mehr Spielraum. Beispiel: 10.000 \u20AC Kredit, 0,4 BTC, Liquidation bei 80 %: Verkauft wird, wenn 0,4 BTC nur noch 12.500 \u20AC wert sind, also bei einem BTC-Kurs von 31.250 \u20AC.",repayment:"Werden Zinsen zum Kredit addiert, w\xE4chst Ihre Schuld jeden Monat, und damit auch der Kurs, bei dem Ihre BTC verkauft werden. Beispiel: 10.000 \u20AC zu 10 % f\xFCr ein Jahr. Monatlich gezahlt, schulden Sie das ganze Jahr 10.000 \u20AC. Zum Kredit addiert, schulden Sie am Ende etwa 11.000 \u20AC, und der Verkaufskurs steigt um etwa 10 %.",marginCall:"Ein [[marginCall]] kommt vor einem Verkauf: Ihr LTV ist auf eine Warnstufe gestiegen. Was dann passiert, h\xE4ngt vom Kreditgeber ab. Es kann nur eine Warnung sein. Sie haben vielleicht einige Stunden, um BTC nachzuschie\xDFen oder einen Teil zur\xFCckzuzahlen, sonst verkauft der Kreditgeber alles oder so viel wie n\xF6tig. Oder der Kreditgeber verkauft sofort einen Teil Ihrer BTC. Beispiel: Margin Call bei 70 % mit 48 Stunden Frist: Liegt der LTV nach 48 Stunden noch bei 70 %, verkauft der Kreditgeber."}},where:{title:"Wo Sie diese Zahlen finden",intro:"Ihr Angebot oder Kreditvertrag enth\xE4lt f\xFCnf Zahlen, die diese Seite braucht. Suchen Sie nach diesen W\xF6rtern:",items:[{field:"Kreditbetrag",words:'"Darlehensbetrag", "Kreditbetrag", "principal", "loan amount"'},{field:"Start-LTV",words:'"LTV", "Beleihungsquote", "Loan-to-Value". Steht nur die Sicherheitsmenge da: Kredit \xF7 Wert der Sicherheit'},{field:"Liquidations-LTV",words:'"Liquidation", "Verwertung", der Abschnitt zum Verkauf oder zur Verwertung der Sicherheit'},{field:"Laufzeit",words:'"Laufzeit", "F\xE4lligkeit", "term", "maturity"'},{field:"Zinssatz",words:'"Sollzins", "Nominalzins", "Zinssatz", "interest rate". Nicht den Effektivzins: den berechnet die Seite selbst'}],others:'Die \xFCbrigen Bedingungen stehen in Abschnitten wie "Geb\xFChren", "\xDCberwachung der Sicherheit" oder "Margin Call". Die Seite f\xFCllt sie mit Startwerten, die Sie unter "Weitere Bedingungen aus Ihrem Angebot" \xE4ndern k\xF6nnen.',sample:"Darlehensbetrag: EUR 15.000,00 \xB7 Laufzeit: 12 Monate \xB7 Beleihungsquote bei Auszahlung: 50 % \xB7 Sollzins: 11,5 % p. a. \xB7 Erreicht die Beleihungsquote 83 %, darf der Kreditgeber die Sicherheit verwerten."},results:{title:"Ihr Ergebnis",heroOf:"von 100",heroLiq:"simulierten Zuk\xFCnften enden mit der Liquidation dieses Kredits innerhalb von {months} Monaten.",heroLiqExisting:"simulierten Zuk\xFCnften enden mit der Liquidation dieses Kredits in den verbleibenden {months} Monaten.",heroPartial:"simulierten Zuk\xFCnften enden damit, dass der Kreditgeber innerhalb von {months} Monaten alle Ihre BTC verkauft. In {m} weiteren verkauft er einen Teil davon.",labelExample:"Beispiel",labelYours:"Ihre Bedingungen",labelShared:"Mit Ihnen geteilt",ownTerms:"Eigene Bedingungen eingeben \u2192",editTerms:"Bedingungen \xE4ndern",exampleStory:"{amount} f\xFCr {months} Monate leihen, gegen BTC im Wert von {value} (LTV {ltv}). Verkauf bei LTV {liq}.",tileSold:"Liquidiert bei",tilePartSold:"Teil\xADliquidation bei",tileSoldSub:"{drop} gegen\xFCber heute",tileMargin:"Margin Call bei",tileMarginHours:"{hours} Std. zum Beheben",tileMarginWarning:"nur eine Warnung",tileMarginAuto:"sofortiger Teilverkauf",tileCost:"Gesamt\xADkosten",tileCostSub:"effektiv {apr} pro Jahr",tileInterest:"Rest\xADzinsen",tileInterestSub:"bis zum Ende",tileBreakeven:"Besser als Verkauf ab",tileBreakevenBuy:"Lohnt sich ab",tileBreakevenValue:"BTC {rise}",tileBreakevenSub:"bis zum Ende",howToCheck:"So pr\xFCfen Sie diese Zahl",counterpartyLine:"Der Kreditgeber selbst kann ausfallen oder Ihre BTC verlieren. Dieses Risiko steckt nicht in dieser Zahl.",hookFastest:"Am schnellsten fiel BTC seit 2014 so weit ({drop}) innerhalb von {time}.",hookNever:"So weit ({drop}) ist BTC seit 2014 nicht gefallen; der gr\xF6\xDFte R\xFCckgang war {worst}.",hookHours:"{n} Stunden",hookHour:"1 Stunde",hookDays:"{n} Tagen",hookLink:"Wie viel Puffer Kredite brauchten",headlineHelp:"Eine simulierte Zukunft ist ein m\xF6glicher Verlauf des BTC-Kurses w\xE4hrend Ihres Kredits, gebaut aus echten Kursbewegungen seit 2014. Die Seite berechnet 10.000 davon und z\xE4hlt, was der Kreditgeber in jeder tun w\xFCrde. Beispiel: 64 von 100 hei\xDFt, in 64 von je 100 Verl\xE4ufen wurden Ihre BTC vor Laufzeitende verkauft. Das ist keine Prognose und kein Versprechen.",legendLiquidated:"liquidiert",legendPartial:"Teil der BTC verkauft",legendMargin:"Margin Call, nichts verkauft",legendNothing:"nichts passiert",kept:"Wo BTC verkauft wurden, behalten Sie etwa {kept} davon (mittlerer Wert).",rising:"Weil Zinsen zur Schuld addiert werden, steigt der Liquidationskurs bis zum Ende auf {end}.",basis:"Ohne Kurstrend gerechnet \xB7 keine Prognose",otherMethods:"Andere Methoden: echte Vergangenheit seit 2014 {h} von 100, ein Volatilit\xE4tsmodell {g} von 100; die Simulation ist die vorsichtigste",assumeNoTopUp:"Angenommen: Sie schie\xDFen nach einem Margin Call weder BTC noch Geld nach.",assumeReserve:"Angenommen: Sie schie\xDFen beim ersten Margin Call einmal {reserve} nach, danach nichts mehr.",soldGetBack:"Bei einer Liquidation erhalten Sie etwa {back} Ihrer {btc} BTC zur\xFCck; der Rest tilgt Kredit und Geb\xFChr.",soldPartial:"F\xE4llt BTC auf den Liquidationskurs, verkauft der Kreditgeber etwa {sold} Ihrer {btc} BTC, um den LTV wieder auf {target} zu bringen. Sie behalten {left} BTC, und der Kredit l\xE4uft weiter.",barLine:"{n} von 100 liquidiert",barWas:"(vorher {m})",barGo:"Zur Antwort \u2191",sliderUndone:"Ihr Start-LTV ist jetzt {ltv}.",sliderUndo:"R\xFCckg\xE4ngig",limitsTitle:"Was das nicht abbildet",limits:["Die Zukunft kann wilder sein als die Vergangenheit. Jedes Modell kann falsch liegen.","Der Kreditgeber selbst kann pleitegehen, Auszahlungen stoppen oder Ihre BTC verlieren.","Kurse k\xF6nnen \xFCber den Liquidationskurs hinweg springen, etwa bei einem B\xF6rsenausfall. Dann bekommen Sie wom\xF6glich weniger zur\xFCck.","Ihr Kreditgeber misst den BTC-Kurs wom\xF6glich anders als diese Seite."],sharedNote:"Jemand hat diese Berechnung mit Ihnen geteilt. \xC4ndern Sie eine der Bedingungen, um Ihr eigenes Ergebnis zu sehen.",bestLever:"Eine \xC4nderung senkt diese Zahl: {lever} \u2192 {p} von 100.",safer:"Sicherer machen",sliderLine:"Start-LTV {ltv} \u2192 {p} von 100 liquidiert \xB7 Sie hinterlegen {btc}",sliderLineExisting:"LTV {ltv} \u2192 {p} von 100 liquidiert \xB7 {btc} hinterlegt ({add} nachschie\xDFen)",sliderLineExistingNow:"LTV {ltv} \u2192 {p} von 100 liquidiert \xB7 {btc} hinterlegt",sliderNote:"Ziehen Sie, um einen niedrigeren LTV zu testen: weniger leihen oder mehr BTC hinterlegen. Loslassen \xFCbernimmt den Wert.",otherOptions:"Weitere M\xF6glichkeiten, jeweils eine \xC4nderung (liquidiert, von 100):",yourTerms:"Ihre Bedingungen, wie sie sind",levers:{lowerLtv:"Start-LTV {value}",shorter:"{value} statt {months} Monate",reserve:"{value} f\xFCr einen Margin Call bereithalten",warningOnly:"Margin Call nur als Warnung",higherLiq:"Liquidations-LTV {value}, \xFCbrige Regeln gleich",higherLiqWarning:"Liquidations-LTV {value} und Margin Call nur als Warnung",monthlyInterest:"Zinsen monatlich zahlen statt addieren"},higherLiqNote:"Ein h\xF6herer Liquidations-LTV hilft nur, wenn die Margin-Call-Regeln nicht vorher verkaufen. Fragen Sie Ihren Kreditgeber, was nach einem Margin Call passiert."},sections:{falls:"Was passiert, wenn BTC f\xE4llt",cost:"Was es kostet",borrowOrSell:"Leihen oder verkaufen?",leverage:"Lohnt sich der Hebel?",history:"Ihr Kredit in jedem Absturz seit 2014",feedback:"Helfen Sie, diese Seite zu verbessern"},falls:{ladderToday:"Heute",ladderMargin:"Margin Call",ladderSale:"Liquidation",marginWarning:"Bei {mcPrice} (Margin Call): Sie erhalten eine Warnung. {topUp} BTC nachschie\xDFen (\u2248 {topUpValue}) oder {repay} zur\xFCckzahlen w\xFCrde den LTV wieder auf {target} bringen.",marginCure:"Bei {mcPrice} (Margin Call): Sie haben {hours} Stunden, um {topUp} BTC nachzuschie\xDFen (\u2248 {topUpValue}) oder {repay} zur\xFCckzuzahlen. Sonst verkauft der Kreditgeber {what}.",marginAuto:"Bei {mcPrice} (Margin Call): Der Kreditgeber verkauft sofort etwa {sold} BTC, um den LTV wieder auf {target} zu bringen. Sie behalten {left} Ihrer {btc} BTC, und der Kredit l\xE4uft weiter.",whatAll:"alles",whatPartial:"etwa {sold} BTC, gerade so viele, dass {target} erreicht wird",liquidationAll:"Bei {price} (Liquidation): Der Kreditgeber verkauft {sold} BTC, inklusive Geb\xFChr. Sie bekommen {returned} BTC zur\xFCck (\u2248 {returnedValue}) und behalten das geliehene Geld.",liquidationPartial:"Bei {price} (Liquidation): Der Kreditgeber verkauft etwa {sold} BTC, gerade so viele, dass der LTV wieder bei {target} liegt. Sie behalten {left} Ihrer {btc} BTC, und der Kredit l\xE4uft weiter.",futuresTitle:"20 m\xF6gliche Zuk\xFCnfte",futuresLine:"Jede Linie ist ein m\xF6glicher Verlauf des BTC-Kurses w\xE4hrend Ihres Kredits, gebaut aus echten 30-Tage-Abschnitten der BTC-Vergangenheit, zuf\xE4llig aneinandergereiht. \u2715 = der Kreditgeber verkauft. {k} dieser 20 enden mit einem Verkauf.",futuresHelp:"Die Simulation nimmt die echten t\xE4glichen Kursbewegungen von BTC seit 2014, schneidet sie in 30-Tage-St\xFCcke und reiht zuf\xE4llig gew\xE4hlte St\xFCcke zu einem neuen Verlauf \xFCber die L\xE4nge Ihres Kredits aneinander. Jeder Verlauf beh\xE4lt die echte Mischung aus ruhigen und wilden Wochen. Beispiel: Ein Verlauf kann mit einem Abschnitt aus dem Mai 2021 beginnen (ein Einbruch um 50 %), gefolgt von einem aus Ende 2023 (ein stetiger Anstieg).",futuresMarginNote:"Manche \u2715 liegen \xFCber der roten Linie: Dort wurde ein Margin Call (gelbe Linie) nicht rechtzeitig behoben, oder der Kreditgeber hat einen Teil der BTC verkauft.",showOthers:"20 andere Zuk\xFCnfte zeigen ({n} von {sets})",questionsTitle:"Vor der Unterschrift: {n} Fragen an Ihren Kreditgeber",questionsPreview:"Was nach einem Margin Call passiert, welcher Kurs z\xE4hlt, wer Ihre BTC verwahrt \u2026",questions:["Bei welchem LTV verkaufen Sie meine BTC?","Was genau passiert nach einem Margin Call? Nur eine Warnung oder ein Verkauf nach einer Anzahl Stunden? Alles oder nur ein Teil?","Welchen BTC-Kurs nutzen Sie: eine B\xF6rse, einen Durchschnitt, \xFCber welchen Zeitraum?","Verkaufen Sie alle meine BTC oder nur so viel wie n\xF6tig?","Was kostet eine Liquidation?","Wer verwahrt meine BTC? Werden sie getrennt aufbewahrt? Werden sie weiterverliehen?","Wenn ich den Kreditgeber wechsle: Wie wird mein bisheriger Kredit abgel\xF6st, und wie lange sind meine BTC unterwegs?","Kostet eine vorzeitige R\xFCckzahlung eine Geb\xFChr?"]},cost:{line:"Sie erhalten {received} und zahlen {payback} zur\xFCck. Der Kredit kostet {cost}, wenn nichts schiefgeht ({apr} pro Jahr inklusive Geb\xFChren).",lineExisting:"Sie zahlen ab heute insgesamt {payback} zur\xFCck, davon {interest} Zinsen.",timingNote:"Der Jahreszins inklusive Geb\xFChren ber\xFCcksichtigt, wann Sie zahlen: Derselbe Gesamtbetrag, fr\xFCher gezahlt, zum Beispiel Zinsen jeden Monat statt am Ende, ergibt einen h\xF6heren Zins.",schedule:"Monatlichen Zahlungsplan anzeigen",scheduleHead:["Monat","Datum","Zinsen","Tilgung","Zahlung","Restschuld danach"],sellIntro:"Leihen schl\xE4gt den Verkauf von BTC heute nur, wenn BTC genug steigt. Angenommen, Sie zahlen am Ende durch einen BTC-Verkauf zur\xFCck:",breakeven:"BTC muss am Ende mindestens {rise} h\xF6her stehen, und der Kredit darf unterwegs nicht liquidiert werden.",taxNow:"Steuer bei BTC-Verkauf heute",taxLater:"Steuer bei Verkauf am Ende",taxNote:"Geben Sie Ihre eigenen Steuers\xE4tze ein (0, wenn keine). Die Regeln h\xE4ngen von Land und Haltedauer ab; fragen Sie eine Steuerberatung. Auch eine Liquidation ist ein Verkauf und kann besteuert werden.",levIntro:"Mit {received} kaufen Sie heute {bought} BTC.",levHeadline:"In {more} von 100 Zuk\xFCnften haben Sie am Ende mehr BTC als ohne Kredit. In {less} von 100 weniger ({liq} davon liquidiert).",levSizes:"Wie viel, als mittlerer Wert jeder Gruppe, in BTC gegen\xFCber ohne Kredit: mehr BTC {more}, weniger, nicht verkauft {less}, liquidiert {liq}.",levLegendMore:"mehr BTC",levLegendLess:"weniger, nicht verkauft",levLegendLiq:"liquidiert",levLiquidated:"Bei einer Liquidation haben Sie am Ende etwa {end} BTC statt {start} BTC, obwohl Sie mehr gekauft haben.",levBreakeven:"Gewinnschwelle: BTC muss am Ende {rise} h\xF6her stehen, ohne Verkauf unterwegs.",levCash:"R\xFCckzahlung mit neuem Geld: Sie behalten die gekauften BTC, sofern Ihre Sicherheit nicht verkauft wird, und zahlen {payback} aus anderem Geld.",levTrendTitle:"Spielt der Kurstrend hier eine Rolle?",levTrendUnit:"Zahl = Zuk\xFCnfte von 100, in denen Sie am Ende mehr BTC haben als ohne Kredit."},history:{replay:"An einem beliebigen Tag seit 2014 gestartet, w\xE4re genau dieser Kredit {n}-mal von 100 liquidiert worden{partial}.",replayPartial:", und in {m} weiteren F\xE4llen w\xE4re ein Teil der BTC verkauft worden",storiesTitle:"Wenn eines dieser echten Jahre heute beg\xE4nne",storiesLine:"Ihr Kredit, mit echten BTC-Kursen ab diesen Starttagen, skaliert auf den heutigen Kurs. \u2715 = Verkauf. Gestrichelt = was danach geschah.",sold:"{date}: nach {days} Tagen verkauft. Ein Jahr sp\xE4ter stand BTC beim {end}-fachen des Starts.",partial:"{date}: nach {days} Tagen teilweise verkauft; Sie behalten {left} Ihrer BTC.",survived:"{date}: kein Verkauf. Ein Jahr sp\xE4ter stand BTC beim {end}-fachen des Starts.",byMonth:"Mehr als die H\xE4lfte aller Liquidationen in der Simulation passiert in den ersten {months} Monaten.",trendTitle:"Spielt der Kurstrend eine Rolle?",trendIntro:"Niemand wei\xDF, wohin sich BTC bewegt. Hier ist Ihr Kredit mit f\xFCnf verschiedenen j\xE4hrlichen Werten f\xFCr den [[priceTrend]]. Die Schwankungen bleiben wie in der Vergangenheit.",trendRow:"{trend} pro Jahr",trendNone:"Kein Trend (die Antwort oben)",trendUnit:"Zahl = Zuk\xFCnfte von 100, in denen der Kredit liquidiert wird.",trendConclusion:"Ein steigender Kurs senkt das Risiko, aber selbst bei {topTrend} pro Jahr enden noch {top} von 100 Zuk\xFCnften mit einer Liquidation.",bridgeLower:"Die Antwort oben nennt {n}. Der Unterschied: Die echte Vergangenheit enth\xE4lt den starken Anstieg von BTC seit 2014; die Simulation beh\xE4lt die Schwankungen, l\xE4sst den Anstieg aber weg, weil niemand wei\xDF, ob er sich fortsetzt.",bridgeOther:"Die Antwort oben nennt {n}. Vergangenheit und Simulation m\xFCssen nicht \xFCbereinstimmen: siehe \u201ESo funktioniert es\u201C (Link oben).",trendUncertainty:"Seit 2014 wuchs BTC um etwa {estimate} pro Jahr. Die Schwankungen sind aber so gro\xDF, dass dieser Wert nur irgendwo zwischen {low} und {high} liegt. Der fr\xFChere Trend ist zu unsicher, um darauf zu bauen.",trendPast:"Das j\xE4hrliche Wachstum von BTC (mit Zinseszinseffekt) \xFCber 4-Jahres-Zeitr\xE4ume seit 2014 lag zwischen {worst} (schw\xE4chster) und {best} (st\xE4rkster), mittlerer Wert {median}. Es hat mit der Zeit abgenommen: {firstFrom}\u2013{firstTo} {firstRate} pro Jahr, {lastFrom}\u2013{lastTo} {lastRate} pro Jahr.",trendSwings:"In {deep} von {years} Kalenderjahren seit 2014 fiel BTC innerhalb desselben Jahres um mindestens 50 % von einem Hoch. Ein Kredit muss diese Einbr\xFCche \xFCberstehen, egal wohin der langfristige Weg f\xFChrt."},insights:{title:"Erkenntnisse",metaTitle:"Erkenntnisse \xB7 Bitcoin-Kredit-Check",metaDescription:"Was mit Bitcoin-gedeckten Krediten seit 2014 geschah: wie viel Puffer sie brauchten, welche Bedingungen am meisten z\xE4hlten und wie schnell BTC-Einbr\xFCche verliefen. Keine Prognose, keine Beratung.",intro:'Was mit BTC-gedeckten Krediten seit 2014 geschah, gemessen an denselben st\xFCndlichen Kursen wie die Pr\xFCfung. Keine Prognose und keine Beratung: Es zeigt, was geschah, nie, was "am besten" ist.',coming:"Diese Seite entsteht gerade. Sie wird zeigen:",groups:["Wie viel Puffer braucht ein Kredit?","Welche Bedingungen z\xE4hlen am meisten?","Angebote fair vergleichen","Nach Ziel: mehr BTC kaufen oder ausgeben, ohne zu verkaufen","Die heutigen Kursschwankungen im Vergleich zur Vergangenheit"],levFacts:"Seit 2014 stand BTC 4 Jahre sp\xE4ter an {h4} der Starttage in den Daten dieser Seite h\xF6her. Ein Jahr sp\xE4ter nur an {h1}, und das schlechteste Jahr endete bei {w1}. Ein Kredit muss den Weg \xFCberstehen, nicht nur das Ziel erreichen. Die Vergangenheit garantiert nicht die Zukunft."},method:{title:"So funktioniert es",metaTitle:"So funktioniert es \xB7 Bitcoin-Kredit-Check",metaDescription:"Wie der Bitcoin-Kredit-Check das Risiko eines BTC-gedeckten Kredits berechnet, welche Daten er nutzt, wie er an der Vergangenheit getestet wurde und wie Sie jede Zahl selbst pr\xFCfen.",short:"Die Seite nimmt die echten Kursbewegungen von BTC seit 2014 und baut daraus 10.000 m\xF6gliche Zuk\xFCnfte. Auf jede wendet sie Stunde f\xFCr Stunde die Regeln Ihres Kreditgebers an. Die Zahl oben z\xE4hlt, in wie vielen von 100 Zuk\xFCnften Ihre BTC verkauft werden. Zwei weitere Methoden pr\xFCfen sie.",example:"Diagramme und Zahlen auf dieser Seite nutzen den Beispielkredit: {story}",toc:"Auf dieser Seite",stepsTitle:"Wie die Zahlen entstehen",steps:["Echte Kurse: jede Stunde seit 2014, mit ihrem tiefsten Kurs, damit kurze Einbr\xFCche nicht verloren gehen.","M\xF6gliche Zuk\xFCnfte: echte t\xE4gliche Kursbewegungen, in 30-Tage-St\xFCcke geschnitten und zuf\xE4llig zu 10.000 Verl\xE4ufen aneinandergereiht.","Die Regeln des Kreditgebers: Margin Call, Fristen, Teilverk\xE4ufe und Geb\xFChren, genau wie eingegeben, in jedem Verlauf.","Gez\xE4hlt: in wie vielen von 100 Verl\xE4ufen die BTC vor Laufzeitende verkauft werden. Das ist die Zahl oben."],fanTitle:"Spanne der simulierten Kurse",fanNote:"Jeden Monat: 9 von 10 simulierten Kursen liegen im hellen Band, die H\xE4lfte im dunklen; die Linie ist der mittlere. Die B\xE4nder zeigen Kurse, keine Ergebnisse: Ein Verlauf, der unter die Liquidationslinie taucht und sich erholt, endete trotzdem mit einer Liquidation.",byMonthTitle:"Liquidiert bis zum Ende jedes Monats (von 100)",methodsTitle:"Drei Methoden im Vergleich",methodsIntro:"Jede Methode kann auf ihre eigene Art falsch liegen. Deshalb rechnet die Seite denselben Kredit auf drei Wegen, dazu eine Lehrbuchformel als grobe Pr\xFCfung.",methods:["M\xF6gliche Zuk\xFCnfte aus fr\xFCheren Kursbewegungen: die Methode oben. Sie liefert die Zahl oben auf der Seite.","Volatilit\xE4tsmodell ([[garch]]): Wilde Tage machen weitere wilde Tage wahrscheinlicher. Es ist an dieselben Kurse angepasst.","Echte Vergangenheit: derselbe Kredit, an jedem Tag seit 2014 gestartet, gegen den echten tiefsten Kurs jeder Stunde. Sie enth\xE4lt den Anstieg von BTC seit 2014."],compareTitle:"Methoden im Vergleich (liquidiert, von 100)",compareRows:{bootstrap:"M\xF6gliche Zuk\xFCnfte aus fr\xFCheren Kursbewegungen",garch:"Volatilit\xE4tsmodell (GARCH)",replay:"Echte Vergangenheit seit 2014",barrier:"Lehrbuchformel (ruhige, gleichm\xE4\xDFige Bewegungen)"},barrierNote:"Die Lehrbuchformel nimmt ruhige, gleichm\xE4\xDFige Kursbewegungen an (Volatilit\xE4t {sigma} pro Jahr) und l\xE4sst die Margin-Call-Regeln au\xDFen vor; sie zeigt deshalb eher eine niedrigere Zahl. Sie dient nur als grobe Pr\xFCfung.",settings:"Verwendete Einstellungen: {paths} Zuk\xFCnfte, {block}-Tage-Abschnitte, Daten {from} bis {to}.",testTitle:"Der Test an der Vergangenheit",test:'Ab 2016 sah die Methode nur die Vergangenheit und sagte dann den tiefsten Kurs der n\xE4chsten 90 und 365 Tage voraus. Die Wirklichkeit lag in 0 bis 6 von 100 F\xE4llen unter ihrem "schlechtesten 5 %"-Wert, nahe an oder unter den versprochenen 5. Die Methode ist eher vorsichtig als optimistisch.',dataTitle:"Daten und die w\xF6chentliche Aktualisierung",data:["Kursdaten: st\xFCndliche Kurse der B\xF6rsen Bitstamp (USD seit 2014, EUR seit 2017) und Kraken (EUR 2014\u20132016), wie von den B\xF6rsen ver\xF6ffentlicht. Bekannte L\xFCcke: Bitstamp war vom 5. bis 9. Januar 2015 offline.","Weitere W\xE4hrungen (CHF, GBP, CAD, AUD, CZK, PLN): die Euro-Kurse, Stunde f\xFCr Stunde mit dem t\xE4glichen Wechselkurs der Europ\xE4ischen Zentralbank umgerechnet. Gegen\xFCber echten B\xF6rsenkursen weicht die H\xE4lfte aller Stunden um h\xF6chstens 0,2 % ab.","Aktueller Kurs: Coinbase, oder wenn das scheitert Kraken, Binance oder CoinGecko. Die Seite erg\xE4nzt au\xDFerdem die Stunden seit der letzten Aktualisierung von Bitstamp.","Einmal pro Woche erg\xE4nzt ein automatischer Ablauf die neuesten Kurse und Wechselkurse. Er pr\xFCft sie zuerst (L\xFCcken, unm\xF6gliche Kurse, Quellen, die sich widersprechen) und h\xE4lt an, wenn etwas nicht stimmt."],measure:"Ihr Kreditgeber entscheidet, welcher BTC-Kurs z\xE4hlt: eine B\xF6rse, ein Durchschnitt mehrerer oder ein Durchschnitt \xFCber einige Minuten. Eine einzelne B\xF6rse kann kurz viel tiefer fallen als andere. Diese Seite nutzt den tiefsten Kurs jeder Stunde an einer B\xF6rse. Das ist vorsichtig, kann die Methode Ihres Kreditgebers aber nicht genau nachbilden.",trendTitle:"Warum kein Kurstrend angenommen wird",trend:'Mit dem fr\xFCheren Durchschnittswachstum von BTC fiel der Test an der Vergangenheit durch: Die Methode wurde zu optimistisch. Auf der Pr\xFCfseite zeigt "Spielt der Kurstrend eine Rolle?", wie stark ein Trend Ihre Antwort \xE4ndern w\xFCrde.',limitsTitle:"Was das Modell nicht kann",limits:["Es kennt nur Kursbewegungen, die es seit 2014 gab. Ein Einbruch neuer Art ist nicht enthalten.","Es reiht 30-Tage-St\xFCcke zuf\xE4llig aneinander, l\xE4ngere Phasen mit steigenden oder fallenden Kursen werden also vermischt. Der Test an der Vergangenheit pr\xFCft, dass es dadurch nicht zu optimistisch wird.","Es nimmt keinen Kurstrend an. Steigt BTC stark, fallen echte Ergebnisse besser aus; f\xE4llt BTC \xFCber Jahre, schlechter."],verifyTitle:"Selbst pr\xFCfen",code:"Der gesamte Code, die Daten und die Tests sind offen: {link}",verify:["Die Tests rechnen 12 Referenzkredite auf 9 Nachkommastellen nach. Sie pr\xFCfen au\xDFerdem jede Regel des Kreditgeber-Modells und bauen absichtlich Fehler in den Code ein, um zu sehen, dass die Tests sie bemerken.",'Eine Zahl von Hand pr\xFCfen: Nehmen Sie den Liquidationskurs aus Ihrer Antwort und schauen Sie in den Kursdaten nach, wie oft BTC innerhalb Ihrer Laufzeit so weit fiel. Das ist ungef\xE4hr die Zahl "echte Vergangenheit".']},feedback:{intro:"Vier kurze Fragen. Ihre Antworten landen in einer E-Mail in Ihrem eigenen Mailprogramm, und Sie entscheiden, ob Sie sie senden. Diese Seite sendet nichts.",use:"Wof\xFCr nutzen Sie das Geld vor allem?",useOptions:{spend:"Ausgeben",compare:"Angebote vergleichen",buy:"Mehr BTC kaufen",curious:"Nur neugierig"},meaning:"In einem Satz: Was bedeutet die gro\xDFe Zahl oben?",useful:"Diese Seite gibt mir, was ich f\xFCr meine Entscheidung brauche.",easy:"Diese Seite ist einfach zu benutzen.",scaleLow:"gar nicht",scaleHigh:"voll und ganz",missing:"Was war verwirrend, oder was fehlt? (optional)",language:"In welcher Sprache h\xE4tten Sie diese Seite gern? (freiwillig)",languageMissing:"Ihre Sprache fehlt? Sagen Sie es uns.",languageSubject:"Sprachwunsch f\xFCr den Bitcoin-Kredit-Check",attach:"Meine Kreditbedingungen anh\xE4ngen (keine pers\xF6nlichen Daten)",write:"E-Mail schreiben",copy:"Text kopieren",copied:"Kopiert. Senden Sie ihn an {email}.",subject:"Feedback Bitcoin-Kredit-Check"},compare:{add:"+ Angebot vergleichen",addRefi:"+ Mit einer Umschuldung vergleichen",addC:"+ Angebot C",remove:"{name} entfernen",end:"Vergleich beenden",title:"Angebote vergleichen",titleRefi:"Bisheriger Kredit und Umschuldung",sameFutures:"dieselben simulierten Zuk\xFCnfte f\xFCr alle",names:["Angebot A","Angebot B","Angebot C"],current:"Bisheriger Kredit",refinanced:"Umschuldung",nameLabel:"Name dieses Angebots (bleibt in Ihrem Browser)",rowLiq:"Liquidiert, von 100",withinMonths:"innerhalb von {months} Monaten",nextMonths:"n\xE4chste {months} Monate, beide",wholeTerm:"ganze neue Laufzeit, {months} Monate",rowSold:"Verkauf bei",rowCost:"Gesamtkosten",perYear:"effektiv {apr} pro Jahr",interestLeft:"Restzinsen",inclSwitching:"inkl. Wechselkosten",rowReceive:"Sie erhalten",rowReceiveNow:"Sie erhalten jetzt",rowMargin:"Margin Call bei",fixTerms:"Bedingungen pr\xFCfen",noWinner:"Kein Angebot ist als besser markiert: Eines kann sicherer sein, ein anderes g\xFCnstiger. Tippen Sie auf einen Namen, um das Angebot unten ganz zu sehen.",diffAmount:"Die Angebote verleihen unterschiedliche Betr\xE4ge.",diffMonths:"Die Angebote laufen unterschiedlich lange; ein l\xE4ngerer Kredit hat mehr Zeit, liquidiert zu werden.",shorterRefi:"Der neue Kredit ist k\xFCrzer als die Restlaufzeit des bisherigen.",showing:"Unten zu sehen: {name}. Alles unter dieser Zeile betrifft dieses Angebot.",startsFrom:"Ausgangspunkt ist Ihr bisheriger Kredit: Sie schulden {owed} gegen {btc} BTC, noch {months} Monate.",newLoanLine:"Neuer Kredit: {amount} gegen {btc} BTC, Start-LTV {ltv}.",whatChanges:"Was \xE4ndert sich?",same:"Gleicher Betrag",more:"Mehr leihen",back:"BTC zur\xFCcknehmen",extra:"Zus\xE4tzliches Geld",backBtc:"Zur\xFCckgenommene BTC",moreTerms:"Weitere Bedingungen des neuen Kredits",switching:"Wechselkosten",switchingSum:"bisher {sum}",exitFee:"Geb\xFChr f\xFCr die vorzeitige R\xFCckzahlung des bisherigen Kredits",transferFee:"Weitere Wechselkosten (\xDCberweisung, Netzwerkgeb\xFChren)"},share:{compare:"Kreditangebote verglichen, liquidiert innerhalb der Laufzeit, von 100: {list}.",refi:"Umschuldung gepr\xFCft: n\xE4chste {months} Monate, liquidiert, von 100: bisheriger Kredit {a}, Umschuldung {b}.",one:"Kreditangebot gepr\xFCft: In {n} von 100 simulierten Zuk\xFCnften wird der Kredit innerhalb von {months} Monaten liquidiert. BTC wird bei {price} verkauft ({drop}). Gesamtkosten {cost}.",existing:"Kredit gepr\xFCft: In {n} von 100 simulierten Zuk\xFCnften wird der Kredit in den verbleibenden {months} Monaten liquidiert. BTC wird bei {price} verkauft ({drop})."},donate:{text:"Diese Seite ist kostenlos und werbefrei. Wenn sie Ihnen geholfen hat, k\xF6nnen Sie ihren Betrieb mit einer Bitcoin-Spende unterst\xFCtzen.",copy:"Adresse kopieren",copied:"Adresse kopiert",public:"Spenden im Bitcoin-Netzwerk sind \xF6ffentlich einsehbar."},footer:{maker:"Unabh\xE4ngiges Projekt von {name}. Kein Kreditgeber bezahlt oder beeinflusst diese Seite.",license:'Open Source unter der MIT-Lizenz. Bereitgestellt "wie besehen" ("as is"), ohne jede Gew\xE4hrleistung: Nutzung auf eigenes Risiko.',notAdvice:"Diese Seite ist keine Finanz-, Anlage- oder Steuerberatung. Sie ist ein Rechner mit einem Modell fr\xFCherer Kursbewegungen. Sie kennt weder Ihre Lage noch die Zukunft. Pr\xFCfen Sie jede Zahl anhand der Unterlagen Ihres Kreditgebers."},glossary:{title:"Glossar",terms:{ltv:{term:"LTV (Loan-to-Value, Beleihungsquote)",text:"Der Kredit geteilt durch den Wert der hinterlegten BTC, in Prozent. Kredit 10.000 \u20AC und BTC im Wert von 20.000 \u20AC ergibt einen LTV von 50 %. F\xE4llt der BTC-Kurs, steigt der LTV."},marginCall:{term:"Margin Call (Nachschussaufforderung)",text:"Eine Warnung des Kreditgebers, dass Ihr LTV eine festgelegte Stufe erreicht hat. Je nach Kreditgeber m\xFCssen Sie innerhalb einiger Stunden BTC nachschie\xDFen oder einen Teil zur\xFCckzahlen, oder der Kreditgeber verkauft einen Teil Ihrer BTC."},liquidation:{term:"Liquidation (Verwertung)",text:"Der Kreditgeber verkauft Ihre hinterlegten BTC, um den Kredit zu tilgen, ohne Sie zu fragen. Das passiert, wenn der LTV die Liquidationsschwelle erreicht oder ein Margin Call nicht rechtzeitig behoben wird."},partialLiquidation:{term:"Teilverkauf",text:"Der Kreditgeber verkauft nur einen Teil Ihrer BTC, gerade genug, um den LTV wieder auf eine niedrigere Stufe zu bringen. Der Kredit l\xE4uft weiter, mit weniger BTC dahinter."},collateral:{term:"Sicherheit (Collateral)",text:"Etwas, das Sie als Pfand f\xFCr einen Kredit geben. Hier: Ihre BTC. Sie bekommen sie zur\xFCck, wenn der Kredit getilgt ist."},curePeriod:{term:"Nachschussfrist",text:"Die Zeit, die Sie nach einem Margin Call haben, um ihn zu beheben, zum Beispiel durch zus\xE4tzliche BTC."},originationFee:{term:"Abschlussgeb\xFChr",text:"Eine einmalige Geb\xFChr f\xFCr die Er\xF6ffnung des Kredits. Sie kann vom ausgezahlten Geld abgezogen werden."},aprVsRate:{term:"Effektivzins vs. Sollzins",text:"Der Sollzins ist der Preis des Leihens ohne Geb\xFChren. Der Effektivzins rechnet Geb\xFChren und Zahlungszeitpunkte mit ein, als ein j\xE4hrlicher Prozentsatz."},compounding:{term:"Zinseszins",text:"Zinsen, die zur Schuld addiert werden, kosten selbst wieder Zinsen. Die Schuld w\xE4chst etwas schneller."},dayCount:{term:"Zinstageberechnung",text:"Die Regel, mit der aus einem Jahreszins die Zinsen f\xFCr einen Zeitraum werden: jeder Monat als ein Zw\xF6lftel des Jahres oder die tats\xE4chlichen Tage."},drawdown:{term:"Drawdown (Kursr\xFCckgang)",text:"Wie stark ein Kurs von einem fr\xFCheren Hoch f\xE4llt. Von 60.000 \u20AC auf 30.000 \u20AC ist ein Drawdown von 50 %."},ohlc:{term:"OHLC (Kerze)",text:"Vier Kurse f\xFCr einen Zeitraum wie eine Stunde: Er\xF6ffnung, Hoch, Tief, Schluss. Diese Seite pr\xFCft mit dem Tief jeder Stunde, ob verkauft wird."},priceIndex:{term:"Kursindex",text:"Die Kursquelle, mit der ein Kreditgeber Ihre BTC bewertet: eine B\xF6rse oder ein Durchschnitt mehrerer. Sie entscheidet, wann ein Margin Call oder Verkauf passiert."},counterpartyRisk:{term:"Gegenparteirisiko",text:"Das Risiko, dass die andere Seite, hier der Kreditgeber, ihr Versprechen nicht h\xE4lt, zum Beispiel weil sie pleitegeht."},rehypothecation:{term:"Rehypothekierung (Weiterverleihen)",text:"Der Kreditgeber verleiht die BTC, die Sie hinterlegt haben, weiter oder nutzt sie anderweitig. Ger\xE4t der Kreditgeber in Schwierigkeiten, k\xF6nnen Ihre BTC weg sein."},simulatedFuture:{term:"Simulierte Zukunft",text:'Ein m\xF6glicher Verlauf des BTC-Kurses w\xE4hrend Ihres Kredits, gebaut aus echten fr\xFCheren Kursbewegungen. Z\xE4hlt man, was in vielen davon passiert, ergibt sich eine H\xE4ufigkeit "N von 100".'},blockBootstrap:{term:"Block-Bootstrap",text:"Die Methode hinter den simulierten Zuk\xFCnften: St\xFCcke echter Kurshistorie (je 30 Tage) werden zuf\xE4llig ausgew\xE4hlt und aneinandergereiht."},garch:{term:"GARCH-Modell",text:"Ein Statistikmodell f\xFCr Kurse, in dem wilde Tage weitere wilde Tage wahrscheinlicher machen und sehr gro\xDFe Bewegungen h\xE4ufiger vorkommen als im Lehrbuchmodell."},historicalReplay:{term:"Nachspielen der Vergangenheit",text:"Der Kredit wird an jedem fr\xFCheren Tag gestartet und mit dem verglichen, was der Kurs danach wirklich getan hat."},priceTrend:{term:"Kurstrend",text:"Eine angenommene j\xE4hrliche Kurs\xE4nderung der mittleren simulierten Zukunft (mit Zinseszinseffekt). Sie verschiebt alle simulierten Zuk\xFCnfte nach oben oder unten; die Schwankungen bleiben gleich."}}},errors:{LOAN_AMOUNT_INVALID:{problem:"Der Kreditbetrag muss eine Zahl \xFCber null sein.",fix:"Geben Sie den Betrag aus Ihrem Angebot ein, zum Beispiel 10000."},PRICE_INVALID:{problem:"Der BTC-Kurs muss eine Zahl \xFCber null sein.",fix:"Laden Sie den aktuellen Kurs oder geben Sie den heutigen Kurs ein."},LTV_OUT_OF_RANGE:{problem:"Der Start-LTV muss zwischen 0 % und 100 % liegen.",fix:"Geben Sie den LTV aus Ihrem Angebot ein, zum Beispiel 50."},LIQ_LTV_NOT_ABOVE_INITIAL:{problem:"Der Liquidations-LTV ist nicht h\xF6her als der Start-LTV. Der Kredit w\xFCrde sofort liquidiert.",fix:"Pr\xFCfen Sie beide Zahlen. Der Liquidations-LTV muss h\xF6her sein, zum Beispiel 50 % zu Beginn und 80 % f\xFCr die Liquidation."},LIQ_LTV_TOO_HIGH:{problem:"Der Liquidations-LTV muss eine Zahl bis 100 % sein.",fix:"Geben Sie den Liquidations-LTV aus Ihrem Angebot ein, zum Beispiel 80."},MARGIN_LTV_OUT_OF_RANGE:{problem:"Der Margin-Call-LTV muss zwischen Start-LTV und Liquidations-LTV liegen.",fix:"Pr\xFCfen Sie die Zahl oder lassen Sie das Feld leer, wenn Ihr Angebot keinen Margin Call hat."},DURATION_INVALID:{problem:"Die Laufzeit muss eine ganze Zahl von Monaten sein, mindestens 1.",fix:"Geben Sie die Monate ein, zum Beispiel 12 f\xFCr ein Jahr."},NEGATIVE_RATE:{problem:"Ein Zinssatz kann hier nicht negativ sein.",fix:"Geben Sie den Zins als positive Zahl ein, zum Beispiel 10, oder 0."},RATE_PATH_INVALID:{problem:"Die Zins\xE4nderungen sind nicht in der richtigen Reihenfolge, beginnen nicht bei Monat 0 oder reichen \xFCber das Laufzeitende hinaus.",fix:"Beginnen Sie mit Monat 0 und f\xFCgen Sie sp\xE4tere Monate aufsteigend hinzu, alle vor dem Ende."},NEGATIVE_FEE:{problem:"Eine Geb\xFChr kann nicht negativ sein, und eine Geb\xFChr in Prozent muss unter 100 % liegen.",fix:"Geben Sie die Geb\xFChr aus Ihrem Angebot ein, oder 0."},FEE_EXCEEDS_LOAN:{problem:"Die Abschlussgeb\xFChr ist so gro\xDF wie der Kredit oder gr\xF6\xDFer.",fix:"Pr\xFCfen Sie, ob die Geb\xFChr ein Prozentsatz oder ein fester Betrag ist."},CURE_NEGATIVE:{problem:"Die Zeit zum Nachschie\xDFen kann nicht negativ sein.",fix:"Geben Sie die Stunden aus Ihrem Angebot ein."},TAX_RATE_INVALID:{problem:"Ein Steuersatz muss zwischen 0 % und unter 100 % liegen.",fix:"Geben Sie einen Prozentsatz wie 25 ein, oder 0."},RESERVE_NEGATIVE:{problem:"Der bereitgehaltene Betrag kann nicht negativ sein.",fix:"Geben Sie einen Betrag ein, oder 0."},CURE_TARGET_INVALID:{problem:"Der LTV, auf den der Kreditgeber Sie zur\xFCckbringt, muss \xFCber 0 % und unter dem Margin-Call-LTV liegen.",fix:"Lassen Sie das Feld leer, um Ihren Start-LTV zu verwenden, oder geben Sie die Zahl aus Ihrem Angebot ein."},COLLATERAL_INVALID:{problem:"Die Menge der hinterlegten BTC muss eine Zahl \xFCber null sein.",fix:"Geben Sie die BTC-Menge ein, zum Beispiel 0,25."},EXISTING_LOAN_AT_LIQUIDATION:{problem:"Mit diesen Zahlen liegt Ihr LTV heute schon beim Liquidations-LTV oder dar\xFCber.",fix:"Pr\xFCfen Sie den geschuldeten Betrag, die hinterlegten BTC und den BTC-Kurs. Stimmen sie, wenden Sie sich jetzt an Ihren Kreditgeber."}},legal:{templateNote:"Vorlage: Die Teile in \xABWinkelanf\xFChrungszeichen\xBB m\xFCssen ausgef\xFCllt werden, und der Text sollte vor der Ver\xF6ffentlichung anwaltlich gepr\xFCft werden.",impressumTitle:"Impressum",impressum:["Angaben gem\xE4\xDF \xA7 5 DDG (Digitale-Dienste-Gesetz), soweit f\xFCr diese Seite anwendbar:","bitcoinloancheck \u2014 Lennart Bodden","c/o Online-Impressum 11950, Europaring 90, 53757 Sankt Augustin, Deutschland","E-Mail: {email}","Verantwortlich f\xFCr den Inhalt nach \xA7 18 Abs. 2 MStV: Lennart Bodden, Anschrift wie oben","Zust\xE4ndige Aufsichtsbeh\xF6rde: Landesanstalt f\xFCr Medien Nordrhein-Westfalen","Diese Seite ist ein kostenloser, privater Rechner. Sie bietet keine Kredite an, vermittelt keine Kredite und steht in keiner Gesch\xE4ftsbeziehung zu einem Kreditgeber."],privacyTitle:"Datenschutzerkl\xE4rung",privacy:[{h:"1. Verantwortlicher",p:["Verantwortlich f\xFCr die Datenverarbeitung auf dieser Seite: \xABVor- und Nachname\xBB, \xABStra\xDFe und Hausnummer\xBB, \xABPLZ und Ort\xBB, \xABLand\xBB, {email}."]},{h:"2. Hosting durch GitHub Pages",p:["Diese Seite wird \xFCber GitHub Pages ausgeliefert, einen Dienst der GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA. Beim Aufruf der Seite verarbeitet GitHub technische Daten, die jeder Webserver ben\xF6tigt: Ihre IP-Adresse, Datum und Uhrzeit, die aufgerufene Adresse und Ihren Browsertyp. GitHub kann diese Daten in Logdateien speichern.","Rechtsgrundlage: Art. 6 Abs. 1 lit. f DSGVO. Unser berechtigtes Interesse ist die sichere und zuverl\xE4ssige Auslieferung der Seite. GitHub hat seinen Sitz in den USA. \xABRechtsgrundlage der \xDCbermittlung in die USA pr\xFCfen und nennen, zum Beispiel das EU-US Data Privacy Framework.\xBB Datenschutzerkl\xE4rung von GitHub: https://docs.github.com/de/site-policy/privacy-policies/github-general-privacy-statement"]},{h:"3. Aktueller BTC-Kurs (automatische Abfragen beim \xD6ffnen)",p:["Um den aktuellen BTC-Kurs zu zeigen, kontaktiert Ihr Browser beim \xD6ffnen der Seite direkt \xF6ffentliche Kursdienste: zuerst api.coinbase.com (Coinbase); nur wenn dieser nicht antwortet, nacheinander api.kraken.com (Kraken), api.binance.com (Binance) und api.coingecko.com (CoinGecko). Zus\xE4tzlich l\xE4dt Ihr Browser die neuesten Stundenkurse von www.bitstamp.net (Bitstamp). Ein erneutes Laden des Kurses oder ein Wechsel der W\xE4hrung wiederholt die Kursabfrage.","Diese Dienste erhalten dabei Ihre IP-Adresse, die Uhrzeit und Ihren Browsertyp, wie bei jedem Besuch einer Webseite. Die Abfragen enthalten keine Cookies, keinen Referrer und nichts von dem, was Sie im Formular eingeben. Wir erhalten keine dieser Daten. \xABVollst\xE4ndigen Firmennamen und Anschrift jedes Dienstes erg\xE4nzen, sowie die Rechtsgrundlage f\xFCr \xDCbermittlungen au\xDFerhalb der EU.\xBB","Rechtsgrundlage: Art. 6 Abs. 1 lit. f DSGVO. Unser berechtigtes Interesse ist die Anzeige eines aktuellen Kurses, ohne den die Ergebnisse veraltet w\xE4ren."]},{h:"4. Ihre Eingaben, lokale Speicherung und geteilte Links",p:["Alle Berechnungen finden in Ihrem Browser statt. Ihre Eingaben werden weder an uns noch an Dritte \xFCbermittelt.",'Damit Ihre Eingaben und Ihre Sprachwahl beim n\xE4chsten Besuch noch vorhanden sind, speichert die Seite sie im lokalen Speicher Ihres Browsers (Schl\xFCssel "btc-loan-risk:form" und "btc-loan-risk:lang"). Diese Daten bleiben auf Ihrem Ger\xE4t. Sie k\xF6nnen sie jederzeit mit der Schaltfl\xE4che "Neu beginnen und meine Eingaben l\xF6schen" oder in den Einstellungen Ihres Browsers entfernen.','Wenn Sie "Link zu dieser Berechnung kopieren" nutzen, werden Ihre Eingaben in den Link nach dem "#"-Zeichen geschrieben. Diesen Teil senden Browser an keinen Server, auch nicht an GitHub. Wer den Link von Ihnen erh\xE4lt, kann Ihre Eingaben sehen.',"Rechtsgrundlage: \xA7 25 Abs. 2 Nr. 2 TDDDG, da die Speicherung f\xFCr die von Ihnen genutzte Funktion unbedingt erforderlich ist. \xABDiese Einsch\xE4tzung pr\xFCfen.\xBB"]},{h:"5. Feedback per E-Mail",p:['Der Bereich "Helfen Sie, diese Seite zu verbessern" bereitet eine E-Mail in Ihrem eigenen Mailprogramm vor. Es wird nichts gesendet, wenn Sie nicht selbst senden. Senden Sie die E-Mail, erhalten wir Ihre E-Mail-Adresse und Ihre Nachricht und nutzen sie nur, um Ihr Feedback zu lesen, zu beantworten und die Seite zu verbessern. Wir l\xF6schen sie, sobald sie daf\xFCr nicht mehr ben\xF6tigt werden.',"Rechtsgrundlage: Art. 6 Abs. 1 lit. f DSGVO. Unser berechtigtes Interesse ist die Verbesserung der Seite und die Beantwortung Ihrer Nachricht. \xABDiese Einsch\xE4tzung pr\xFCfen und erg\xE4nzen, wie lange Feedback-E-Mails aufbewahrt werden.\xBB"]},{h:"6. Keine Cookies, keine Analyse",p:["Diese Seite setzt keine Cookies und nutzt keine Analyse-, Tracking- oder Werbedienste. Sie l\xE4dt keine Schriften, Skripte oder Stile von anderen Servern."]},{h:"7. Ihre Rechte",p:["Sie haben das Recht auf Auskunft, Berichtigung, L\xF6schung und Einschr\xE4nkung der Verarbeitung Ihrer personenbezogenen Daten, das Recht auf Daten\xFCbertragbarkeit sowie das Recht, einer Verarbeitung auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO zu widersprechen. Kontakt: {email}.","Sie haben au\xDFerdem das Recht, sich bei einer Datenschutz-Aufsichtsbeh\xF6rde zu beschweren, zum Beispiel bei \xABName der f\xFCr Sie zust\xE4ndigen Beh\xF6rde\xBB."]},{h:"8. Stand",p:["Stand dieser Datenschutzerkl\xE4rung: \xABDatum\xBB."]}],links:"Impressum \xB7 Datenschutzerkl\xE4rung"}};var _={en:ie,de:re},I="en";var pe=/^(.*?\/)(de\/)?((?:insights|method)\/)?(index\.html)?$/,Y=()=>typeof location>"u"?null:location.pathname.match(pe);function H(e,n=I){let r=Y(),t=typeof location<"u"&&location.protocol==="file:"?"index.html":"";return`${r?r[1]:"/"}${n==="de"?"de/":""}${e}${t}`}function P(){let e=Y();return e&&e[3]||""}function ae(){if(typeof location>"u"||typeof history>"u"||!Y())return;let e=H(P());e!==location.pathname&&history.replaceState(null,"",`${e}${location.search}${location.hash}`)}function se(){let e=null;try{e=localStorage.getItem("btc-loan-risk:lang")}catch{}return I=(/\/de\/((insights|method)\/)?(index\.html)?$/.test(location.pathname)?"de":null)||(e==="de"||e==="en"?e:(navigator.language||"").toLowerCase().startsWith("de")?"de":"en"),document.documentElement.lang=I,ae(),I}function J(e){I=e,document.documentElement.lang=e;try{localStorage.setItem("btc-loan-risk:lang",e)}catch{}ae()}var E=()=>I,q=()=>_[I];function b(e,n={}){let r=e.split(".").reduce((t,i)=>t==null?t:t[i],_[I]);return typeof r!="string"?r??e:r.replace(/\{(\w+)\}/g,(t,i)=>n[i]??`{${i}}`)}var a=e=>Stri
